<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="831eddb738b5b1ae28a10a41fe1da8ac2df6a058" content="831eddb738b5b1ae28a10a41fe1da8ac2df6a058" />
    
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --border-color: #334155;
            --font-main: 'Cairo', sans-serif;
            --chat-bg: #0b141a;
            --msg-me: #005c4b;
            --msg-them: #202c33;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --border-color: #e2e8f0;
            --chat-bg: #efeae2;
            --msg-me: #d9fdd3;
            --msg-them: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        body { background-color: var(--bg-main); color: var(--text-main); direction: rtl; }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000;
        }
        header h1 { color: var(--accent-color); font-size: 1.8rem; font-weight: 800; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent-color); }
        .btn-auth { background-color: var(--accent-color); color: #fff; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }

        .main-layout { display: grid; grid-template-columns: 2fr 1.2fr; gap: 2rem; }
        @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

        .section-title { font-size: 1.4rem; border-right: 4px solid var(--accent-color); padding-right: 10px; margin-bottom: 1.2rem; }

        /* تصميم محادثات الواتساب */
        .whatsapp-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            height: 480px;
            display: flex;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .users-list {
            width: 35%;
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            background-color: var(--bg-card);
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover, .user-item.active { background-color: var(--bg-input); }
        .user-item img { width: 35px; height: 35px; border-radius: 50%; }
        .user-item span { font-size: 0.9rem; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-area {
            width: 65%;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        .chat-header {
            padding: 10px 15px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent-color);
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }

        .bubble.me {
            align-self: flex-start;
            background-color: var(--msg-me);
            color: #fff;
            border-top-right-radius: 0;
        }

        .bubble.them {
            align-self: flex-end;
            background-color: var(--msg-them);
            color: var(--text-main);
            border-top-left-radius: 0;
        }

        .chat-input-bar {
            display: flex;
            padding: 10px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            gap: 8px;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 8px 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
        }

        .chat-input-bar button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        /* كروت القصص والنشر */
        .story-card { background-color: var(--bg-card); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.2rem; border: 1px solid var(--border-color); }
        .story-card h3 { color: var(--accent-color); margin-bottom: 0.4rem; }
        .publish-box { background-color: var(--bg-card); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 0.8rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.6rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); }
        .btn-primary { width: 100%; padding: 0.7rem; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>منصة حكاية</h1>
        <div class="header-actions">
            <button class="btn-auth" id="themeToggle">🌙 المظهر</button>
            <div id="authBox">
                <button class="btn-auth" id="loginBtn">تسجيل الدخول بـ Google</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            <main>
                <h2 class="section-title">أحدث القصص المنشورة</h2>
                <div id="stories-container"></div>
            </main>

            <aside>
                <!-- نظام محادثة واتساب الفردي -->
                <h2 class="section-title">الدردشة والتعارف (مثل واتساب) 💬</h2>
                <div class="whatsapp-container">
                    <div class="users-list" id="usersList">
                        <!-- قائمة المستخدمين ستظهر هنا -->
                    </div>
                    <div class="chat-area">
                        <div class="chat-header" id="chatHeader">اختر مستخدماً للبدء في المحادثة</div>
                        <div class="messages-box" id="messagesBox"></div>
                        <form class="chat-input-bar" id="chatForm">
                            <input type="text" id="msgInput" placeholder="اكتب رسالة..." disabled required>
                            <button type="submit" id="sendBtn" disabled>إرسال</button>
                        </form>
                    </div>
                </div>

                <!-- نموذج نشر القصص -->
                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group"><input type="text" id="storyTitle" placeholder="عنوان القصة" required></div>
                        <div class="form-group"><input type="text" id="authorName" placeholder="اسم الكاتب" required></div>
                        <div class="form-group"><textarea id="storyContent" rows="4" placeholder="نص القصة..." required></textarea></div>
                        <button type="submit" class="btn-primary">نشر القصة</button>
                    </form>
                </div>
            </aside>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
          authDomain: "hikaya-5ff25.firebaseapp.com",
          databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
          projectId: "hikaya-5ff25",
          storageBucket: "hikaya-5ff25.firebasestorage.app",
          messagingSenderId: "1031922678593",
          appId: "1:1031922678593:web:c242a9e36ad40becc9bfc0",
          measurementId: "G-KR76L2WSZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let selectedUser = null;
        let currentChatId = null;

        const authBox = document.getElementById('authBox');
        const usersList = document.getElementById('usersList');
        const messagesBox = document.getElementById('messagesBox');
        const chatHeader = document.getElementById('chatHeader');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatForm = document.getElementById('chatForm');

        // تسجيل الدخول والخروج
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                authBox.innerHTML = `
                    <img src="${user.photoURL}" class="user-avatar">
                    <button class="btn-auth" style="background:#ef4444" onclick="auth.signOut()">خروج</button>
                `;
                document.getElementById('authorName').value = user.displayName;
                
                // حفظ المستخدم في قاعدة البيانات
                database.ref('users/' + user.uid).set({
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL
                });

                loadUsers();
            } else {
                currentUser = null;
                authBox.innerHTML = `<button class="btn-auth" id="loginBtn">تسجيل الدخول بـ Google</button>`;
                document.getElementById('loginBtn').addEventListener('click', () => {
                    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
                });
                usersList.innerHTML = '<div style="padding:10px; font-size:0.8rem; text-align:center;">سجل دخول لرؤية الأصدقاء</div>';
            }
        });

        // تحميل قائمة الأصدقاء/المستخدمين
        function loadUsers() {
            database.ref('users').on('value', snapshot => {
                usersList.innerHTML = '';
                snapshot.forEach(child => {
                    const u = child.val();
                    if (u.uid !== currentUser.uid) {
                        const div = document.createElement('div');
                        div.className = 'user-item';
                        div.innerHTML = `<img src="${u.photo}"><span>${u.name}</span>`;
                        div.onclick = () => startChat(u, div);
                        usersList.appendChild(div);
                    }
                });
            });
        }

        // بدء محادثة خاصة عند اختيار صديق
        function startChat(targetUser, element) {
            document.querySelectorAll('.user-item').forEach(e => e.classList.remove('active'));
            element.classList.add('active');

            selectedUser = targetUser;
            chatHeader.textContent = "محادثة مع: " + selectedUser.name;
            msgInput.disabled = false;
            sendBtn.disabled = false;

            // توليد معرف معرف المحادثة الفريد بين الشخصين
            currentChatId = currentUser.uid < selectedUser.uid 
                ? `${currentUser.uid}_${selectedUser.uid}` 
                : `${selectedUser.uid}_${currentUser.uid}`;

            loadMessages();
        }

        // تحميل الرسائل الخاصة بالطرفين
        function loadMessages() {
            database.ref('private_chats/' + currentChatId).on('value', snapshot => {
                messagesBox.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const b = document.createElement('div');
                    b.className = `bubble ${msg.senderId === currentUser.uid ? 'me' : 'them'}`;
                    b.textContent = msg.text;
                    messagesBox.appendChild(b);
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }

        // إرسال رسالة خاصة
        chatForm.addEventListener('submit', e => {
            e.preventDefault();
            if (!currentChatId || !msgInput.value.trim()) return;

            database.ref('private_chats/' + currentChatId).push({
                senderId: currentUser.uid,
                text: msgInput.value.trim(),
                timestamp: Date.now()
            });

            msgInput.value = '';
        });

        // تغيير المظهر
        document.getElementById("themeToggle").addEventListener("click", () => {
            const isLight = document.documentElement.getAttribute("data-theme") === "light";
            document.documentElement.setAttribute("data-theme", isLight ? "" : "light");
        });

        // حفظ وقراءة القصص محلياً
        const storiesContainer = document.getElementById("stories-container");
        let stories = JSON.parse(localStorage.getItem("hikaya_stories")) || [
            { id: 1, title: "رحلة غارلون", author: "غارلون", content: "قصة مشوقة عن المغامرات والقتال..." }
        ];

        function renderStories() {
            storiesContainer.innerHTML = "";
            stories.forEach(story => {
                const article = document.createElement("article");
                article.className = "story-card";
                article.innerHTML = `<h3>${story.title}</h3><p><b>الكاتب:</b> ${story.author}</p><p>${story.content}</p>`;
                storiesContainer.appendChild(article);
            });
        }
        renderStories();

        document.getElementById("storyForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const title = document.getElementById("storyTitle").value;
            const author = document.getElementById("authorName").value;
            const content = document.getElementById("storyContent").value;
            stories.unshift({ id: Date.now(), title, author, content });
            localStorage.setItem("hikaya_stories", JSON.stringify(stories));
            renderStories();
            document.getElementById("storyForm").reset();
        });
    </script>

    <!-- Monetag Direct Link Script (1/7 Clicks) -->
    <script>
        let clickCount = 0;
        document.addEventListener('click', function() {
            clickCount++;
            if (clickCount % 7 === 1) {
                window.open('https://omg10.com/4/11651127', '_blank');
            }
        });
    </script>
</body>
</html>
