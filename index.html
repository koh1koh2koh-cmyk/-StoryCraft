<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --border-color: #334155;
            --font-main: 'Cairo', sans-serif;
            --wa-bg: #111b21;
            --wa-card: #202c33;
            --wa-green: #00a884;
            --wa-bubble-me: #005c4b;
            --wa-bubble-them: #202c33;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --border-color: #e2e8f0;
            --wa-bg: #efeae2;
            --wa-card: #ffffff;
            --wa-bubble-me: #d9fdd3;
            --wa-bubble-them: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        body { background-color: var(--bg-main); color: var(--text-main); direction: rtl; overflow-x: hidden; }

        header {
            background-color: var(--bg-card);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 999;
        }
        header h1 { color: var(--accent-color); font-size: 1.25rem; font-weight: 800; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent-color); object-fit: cover; }
        .btn-auth { background-color: var(--accent-color); color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
        .btn-logout { background-color: #ef4444; }

        .container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
        
        /* تخطيط مرن يضمن أن القائمة تأخذ المساحة الضخمة والواسعة اليسرى بينما النشر ثابت في اليمين */
        .main-layout { 
            display: flex; 
            gap: 2rem; 
            align-items: flex-start;
            flex-wrap: wrap;
        }

        @media (min-width: 992px) {
            aside { width: 350px; flex-shrink: 0; position: sticky; top: 5rem; }
            main { flex: 1; min-width: 0; }
        }

        @media (max-width: 991px) {
            .main-layout { flex-direction: column; }
            aside, main { width: 100%; }
        }

        .section-title { font-size: 1.2rem; border-right: 4px solid var(--accent-color); padding-right: 10px; margin-bottom: 1rem; }

        .publish-box { 
            background-color: var(--bg-card); 
            padding: 1.5rem; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; }
        .form-group textarea { resize: vertical; min-height: 150px; }
        .btn-primary { width: 100%; padding: 0.8rem; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; }

        .story-card { 
            background-color: var(--bg-card); 
            border-radius: 12px; 
            padding: 1.8rem; 
            margin-bottom: 1.5rem; 
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .story-card h3 { color: var(--accent-color); margin-bottom: 0.5rem; font-size: 1.4rem; }
        .story-card .story-author { font-size: 0.9rem; color: var(--accent-color); margin-bottom: 15px; display: block; font-weight: 600; }
        
        .story-text { 
            font-size: 1.1rem; 
            line-height: 2.2; 
            color: var(--text-muted); 
            white-space: pre-wrap; 
            word-break: break-word;
            overflow-wrap: break-word;
            width: 100%;
        }

        /* تنسيقات الدردشة */
        .chat-float-btn { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background-color: var(--wa-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); cursor: pointer; z-index: 1000; }
        .chat-modal { position: fixed; bottom: 95px; left: 25px; width: 380px; height: 550px; background-color: var(--wa-bg); border-radius: 16px; border: 1px solid var(--border-color); display: none; flex-direction: column; overflow: hidden; z-index: 1000; }
        .chat-modal.open { display: flex; }
        @media (max-width: 480px) { .chat-modal { bottom: 0; left: 0; width: 100%; height: 100%; border-radius: 0; } }

        .modal-header { background-color: var(--wa-card); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .chat-search-box { padding: 10px; background-color: var(--wa-bg); border-bottom: 1px solid var(--border-color); }
        .chat-search-box input { width: 100%; padding: 8px 12px; background: var(--wa-card); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-main); outline: none; }
        .modal-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .users-list { flex: 1; overflow-y: auto; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .user-item:hover { background-color: var(--wa-card); }
        .user-item img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .user-item .name { font-weight: 700; color: var(--text-main); }
        .user-item .sub { font-size: 0.8rem; color: var(--text-muted); }

        .active-chat { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--wa-bg); display: none; flex-direction: column; z-index: 10; }
        .active-chat.open { display: flex; }
        .chat-sub-header { padding: 10px 15px; background-color: var(--wa-card); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .back-btn { background: none; border: none; color: var(--accent-color); font-size: 1.2rem; cursor: pointer; }
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; word-break: break-word; }
        .msg-bubble.me { align-self: flex-start; background-color: var(--wa-bubble-me); color: #fff; }
        .msg-bubble.them { align-self: flex-end; background-color: var(--wa-bubble-them); color: var(--text-main); }
        .msg-bubble img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
        .chat-input-row { padding: 12px; background-color: var(--wa-card); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border-color); }
        .chat-input-row input[type="text"] { flex: 1; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-main); outline: none; }
        .chat-input-row button[type="submit"] { background: var(--wa-green); color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>منصة حكاية</h1>
        <div class="header-actions">
            <button class="btn-auth" id="themeToggle">🌙 المظهر</button>
            <div id="authBox">
                <button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            
            <!-- نموذج نشر القصة (ثابت في أحد الجوانب) -->
            <aside>
                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group"><input type="text" id="storyTitle" placeholder="عنوان القصة" required></div>
                        <div class="form-group"><input type="text" id="authorName" placeholder="اسم الكاتب" required></div>
                        <div class="form-group"><textarea id="storyContent" rows="6" placeholder="اكتب أو الصق نص القصة كاملاً هنا..." required></textarea></div>
                        <button type="submit" class="btn-primary">نشر القصة</button>
                    </form>
                </div>
            </aside>

            <!-- قسم عرض أحدث القصص (يأخذ المساحة الواسعة الكبرى Flex: 1) -->
            <main>
                <h2 class="section-title">أحدث القصص المنشورة</h2>
                <div id="stories-container"></div>
            </main>

        </div>
    </div>

    <div class="chat-float-btn" id="chatFloatBtn">💬</div>

    <div class="chat-modal" id="chatModal">
        <div class="modal-header">
            <h3>💬 المحادثات والأصدقاء</h3>
            <button class="back-btn" onclick="toggleChatModal()">✖</button>
        </div>
        <div class="chat-search-box">
            <input type="text" id="userSearchInput" placeholder="🔍 ابحث عن اسم مستخدم...">
        </div>
        <div class="modal-body">
            <div class="users-list" id="usersList"></div>
            <div class="active-chat" id="activeChat">
                <div class="chat-sub-header">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="back-btn" onclick="closeActiveChat()">➡️</button>
                        <span id="targetUserName">المحادثة</span>
                    </div>
                    <button style="background:none; border:none; color:var(--wa-green); font-size:1.3rem; cursor:pointer;" onclick="startRealCallLink()">📞</button>
                </div>
                <div class="messages-area" id="messagesArea"></div>
                <form class="chat-input-row" id="chatForm">
                    <label style="cursor:pointer; font-size:1.3rem; color:var(--text-muted);">
                        📷
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    </label>
                    <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                    <button type="submit">إرسال</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
          authDomain: "hikaya-5ff25.firebaseapp.com",
          databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
          projectId: "hikaya-5ff25",
          storageBucket: "hikaya-5ff25.firebasestorage.app",
          messagingSenderId: "1031922678593",
          appId: "1:1031922678593:web:c242a9e36ad40becc9bfc0",
          measurementId: "G-KR76L2WSZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null, selectedUser = null, currentChatId = null, allUsersData = [];

        function handleLogin() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => alert(err.message));
        }
        function handleLogout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authBox').innerHTML = `
                    <img src="${user.photoURL}" class="user-avatar" title="${user.displayName}">
                    <button class="btn-auth btn-logout" onclick="handleLogout()">خروج</button>
                `;
                document.getElementById('authorName').value = user.displayName;
                database.ref('users/' + user.uid).set({ uid: user.uid, name: user.displayName, photo: user.photoURL });
                loadUsers();
            } else {
                currentUser = null;
                document.getElementById('authBox').innerHTML = `<button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>`;
                document.getElementById('usersList').innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">سجّل الدخول للتواصل 📞</div>';
            }
        });

        const chatModal = document.getElementById('chatModal');
        document.getElementById('chatFloatBtn').onclick = () => chatModal.classList.toggle('open');
        function closeActiveChat() { document.getElementById('activeChat').classList.remove('open'); }

        function loadUsers() {
            database.ref('users').on('value', snapshot => {
                allUsersData = [];
                snapshot.forEach(child => {
                    const u = child.val();
                    if (currentUser && u.uid !== currentUser.uid) allUsersData.push(u);
                });
                renderUsersList(allUsersData);
            });
        }

        function renderUsersList(users) {
            const list = document.getElementById('usersList');
            list.innerHTML = users.length === 0 ? '<div style="padding:20px; text-align:center; color:var(--text-muted);">لا يوجد مستخدمون</div>' : '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<img src="${u.photo}"><div style="flex:1;"><div class="name">${u.name}</div><div class="sub">انقر للمراسلة</div></div>`;
                div.onclick = () => {
                    selectedUser = u;
                    document.getElementById('targetUserName').textContent = u.name;
                    document.getElementById('activeChat').classList.add('open');
                    currentChatId = currentUser.uid < u.uid ? `${currentUser.uid}_${u.uid}` : `${u.uid}_${currentUser.uid}`;
                    loadMessages();
                };
                list.appendChild(div);
            });
        }

        document.getElementById('userSearchInput').oninput = (e) => {
            const q = e.target.value.trim().toLowerCase();
            renderUsersList(allUsersData.filter(u => u.name.toLowerCase().includes(q)));
        };

        function loadMessages() {
            database.ref('private_chats/' + currentChatId).on('value', snapshot => {
                const area = document.getElementById('messagesArea');
                area.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const b = document.createElement('div');
                    b.className = `msg-bubble ${msg.senderId === currentUser.uid ? 'me' : 'them'}`;
                    b.innerHTML = msg.type === 'image' ? `<img src="${msg.text}">` : (msg.type === 'call_link' ? `🎥 رابط مكالمة:<br><a href="${msg.text}" target="_blank">انضمام</a>` : msg.text);
                    area.appendChild(b);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        document.getElementById('chatForm').onsubmit = (e) => {
            e.preventDefault();
            const text = document.getElementById('msgInput').value.trim();
            if (!currentChatId || !text) return;
            database.ref('private_chats/' + currentChatId).push({ senderId: currentUser.uid, text, type: 'text', timestamp: Date.now() });
            document.getElementById('msgInput').value = '';
        };

        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                database.ref('private_chats/' + currentChatId).push({ senderId: currentUser.uid, text: ev.target.result, type: 'image', timestamp: Date.now() });
            };
            reader.readAsDataURL(file);
        };

        function startRealCallLink() {
            if (!selectedUser || !currentChatId) return;
            const callUrl = `https://meet.jit.si/HikayaCall-${Math.random().toString(36).substring(2, 9)}`;
            database.ref('private_chats/' + currentChatId).push({ senderId: currentUser.uid, text: callUrl, type: 'call_link', timestamp: Date.now() });
            window.open(callUrl, '_blank');
        }

        document.getElementById("themeToggle").onclick = () => {
            const isLight = document.documentElement.getAttribute("data-theme") === "light";
            document.documentElement.setAttribute("data-theme", isLight ? "" : "light");
        };

        const storiesContainer = document.getElementById("stories-container");
        let stories = JSON.parse(localStorage.getItem("hikaya_stories_v5")) || [
            { id: 1, title: "رحلة غارلون", author: "غارلون", content: "قصة مشوقة عن المغامرات والقتال في عوالم خيالية واسعة...\n\nتم إعادة ضبط هيكل العرض بالكامل باستخدام Flexbox المطور لضمان أخذ النص مساحته الكاملة المريحة دون أي تقييد." }
        ];
        localStorage.setItem("hikaya_stories_v5", JSON.stringify(stories));

        function renderStories() {
            storiesContainer.innerHTML = "";
            stories.forEach(story => {
                const article = document.createElement("article");
                article.className = "story-card";
                article.innerHTML = `
                    <h3>${story.title}</h3>
                    <span class="story-author">الكاتب: ${story.author}</span>
                    <div class="story-text">${story.content}</div>
                `;
                storiesContainer.appendChild(article);
            });
        }
        renderStories();

        document.getElementById("storyForm").onsubmit = (e) => {
            e.preventDefault();
            const title = document.getElementById("storyTitle").value.trim();
            const author = document.getElementById("authorName").value.trim();
            const content = document.getElementById("storyContent").value.trim();
            if (!title || !author || !content) return;
            stories.unshift({ id: Date.now(), title, author, content });
            localStorage.setItem("hikaya_stories_v5", JSON.stringify(stories));
            renderStories();
            document.getElementById("storyForm").reset();
        };
    </script>
</body>
</html>
