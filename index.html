<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryCraft - منصة القصص والتفاعل</title>
    
    <!-- ResponsiveVoice لقراءة النصوص صوتياً -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    
    <!-- مكتبات Firebase (الإصدار 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* =========================================================
           1. المتغيرات والتصميم العام (CSS Variables & Global Styles)
           ========================================================= */
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --text-secondary: #666666;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --font-size-base: 17px;
        }

        /* Dark Mode Theme */
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            direction: rtl;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* =========================================================
           2. الرأس والقائمة العلوية (Header & Navigation)
           ========================================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .brand-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .nav-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* =========================================================
           3. أدوات التحكم بالبحث والخط والوضع الليلي (Utility Bar)
           ========================================================= */
        .utility-bar {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px var(--shadow-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle, .font-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .theme-toggle:hover, .font-btn:hover {
            background: var(--border-color);
        }

        /* =========================================================
           4. نموذج إضافة وتعديل القصة (Story Forms & Cards)
           ========================================================= */
        .story-form, .story-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        .form-header {
            margin-top: 0;
            color: var(--text-color);
            font-size: 20px;
            margin-bottom: 15px;
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        label {
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-top: 12px;
            font-size: 14px;
        }

        input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        .word-counter {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: left;
            margin-bottom: 10px;
        }

        /* =========================================================
           5. الأزرار وأنماط التفاعل (Buttons & Badges)
           ========================================================= */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.1s, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-add { background-color: var(--success-color); color: white; width: 100%; justify-content: center; font-size: 16px; padding: 12px; }
        .btn-edit { background-color: var(--warning-color); color: #000; }
        .btn-audio { background-color: var(--primary-color); color: white; }
        .btn-delete { background-color: var(--danger-color); color: white; }
        .btn-like { background-color: #e91e63; color: white; }
        .btn-share { background-color: #673ab7; color: white; }
        .btn-close { background-color: #6c757d; color: white; }
        
        .btn:hover { opacity: 0.9; }

        /* =========================================================
           6. عناصر بطاقة القصة (Story Card Details)
           ========================================================= */
        .story-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .story-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            align-items: center;
        }

        .meta-badge {
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .story-title {
            font-size: 24px;
            color: var(--text-color);
            margin: 5px 0 12px 0;
        }

        .story-content {
            font-size: var(--font-size-base);
            line-height: 1.85;
            color: var(--text-color);
            white-space: pre-line;
            word-wrap: break-word;
        }

        .actions {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* =========================================================
           7. النافذة المنبثقة للتعديل (Modal Popup)
           ========================================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-body {
            background: var(--card-bg);
            color: var(--text-color);
            width: 90%;
            max-width: 600px;
            padding: 25px;
            border-radius: 12px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin: 10px 0;
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="brand-title">📚 StoryCraft</div>
        <nav>
            <a href="#home" class="nav-btn">الرئيسية</a>
            <a href="#add-story-section" class="nav-btn">إضافة قصة</a>
        </nav>
    </header>

    <!-- Utility Controls -->
    <div class="utility-bar">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 ابحث في القصص..." oninput="filterStories()">
        </div>
        <div class="controls-group">
            <button class="font-btn" onclick="adjustFontSize(1)">A+</button>
            <button class="font-btn" onclick="adjustFontSize(-1)">A-</button>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙 الوضع الليلي</button>
        </div>
    </div>

    <!-- Home Display Section -->
    <div id="home">
        <div id="stories-list">
            <div class="empty-state">جاري تحميل القصص...</div>
        </div>
    </div>

    <!-- Add Story Section -->
    <div id="add-story-section" class="story-form">
        <h3 class="form-header">✍️ نشر قصة جديدة</h3>
        
        <label for="new-title">عنوان القصة:</label>
        <input type="text" id="new-title" placeholder="أدخل عنواناً جذاباً...">
        
        <label for="new-image-file">صورة غلاف القصة (اختياري من جهازك):</label>
        <input type="file" id="new-image-file" accept="image/*">
        
        <label for="new-content">محتوى القصة (شامل التشكيل لنطق صحيح):</label>
        <textarea id="new-content" rows="6" placeholder="اكتب القصة هنا..." oninput="updateWordCount()"></textarea>
        <div class="word-counter" id="word-count-display">عدد الكلمات: 0 | الحروف: 0</div>
        
        <button class="btn btn-add" id="submit-btn" onclick="addStory()">🚀 نشر القصة الآن</button>
    </div>
</div>

<!-- Edit Modal Window -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-body">
        <h3 class="form-header">✏️ تعديل بيانات القصة</h3>
        <input type="hidden" id="edit-id">
        
        <label for="edit-title">عنوان القصة:</label>
        <input type="text" id="edit-title">
        
        <label>الصورة الحالية / تغيير الصورة:</label>
        <img id="edit-preview" class="image-preview" alt="معاينة الغلاف">
        <input type="file" id="edit-image-file" accept="image/*">
        
        <label for="edit-content">محتوى القصة:</label>
        <textarea id="edit-content" rows="7"></textarea>
        
        <div style="text-align: left; margin-top: 15px;">
            <button class="btn btn-close" onclick="closeEditModal()">إلغاء</button>
            <button class="btn btn-add" id="save-edit-btn" style="width:auto;" onclick="saveStoryEdit()">حفظ التعديلات</button>
        </div>
    </div>
</div>

<!-- JavaScript Functionalities -->
<script>
    // =========================================================
    // 1. Firebase Configuration & Initialization
    // =========================================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let allStoriesCache = []; // لتخزين القصص برمجياً وتأمين البحث الفوري

    // =========================================================
    // 2. Core Story Operations (Fetch, Render, Add, Edit, Delete)
    // =========================================================
    
    // جلب القوائم لحظياً
    db.collection("stories").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        allStoriesCache = [];
        snapshot.forEach((doc) => {
            allStoriesCache.push({ id: doc.id, ...doc.data() });
        });
        renderStories(allStoriesCache);
    }, (error) => {
        console.error("Firebase Error:", error);
        document.getElementById("stories-list").innerHTML = `<div class="empty-state" style="color:red;">حدث خطأ أثناء تحميل القصص. تحقّق من إعدادات المفاتيح والقواعد.</div>`;
    });

    // رسم واجهة القصص
    function renderStories(stories) {
        const listDiv = document.getElementById("stories-list");
        listDiv.innerHTML = "";

        if (stories.length === 0) {
            listDiv.innerHTML = `<div class="empty-state">لا توجد قصص مطابقة للبحث حالياً.</div>`;
            return;
        }

        stories.forEach((story) => {
            const readTime = calculateReadingTime(story.content);
            const likesCount = story.likes || 0;

            const card = document.createElement("div");
            card.className = "story-card";
            card.innerHTML = `
                ${story.imageUrl ? `<img src="${story.imageUrl}" class="story-img" alt="غلاف القصة" onerror="this.style.display='none'">` : ''}
                <div class="story-meta">
                    <span class="meta-badge">⏱️ قراءة: ${readTime} دقيقة</span>
                    <span class="meta-badge">❤️ التفاعلات: <span id="like-count-${story.id}">${likesCount}</span></span>
                </div>
                <h2 class="story-title">${escapeHtml(story.title)}</h2>
                <div class="story-content" id="content-${story.id}">${escapeHtml(story.content)}</div>
                
                <div class="actions">
                    <button class="btn btn-audio" id="audio-btn-${story.id}" onclick="toggleAudio('${story.id}')">🔊 استمع</button>
                    <button class="btn btn-like" onclick="likeStory('${story.id}', ${likesCount})">❤️ إعجاب</button>
                    <button class="btn btn-share" onclick="shareStory('${story.id}', \`${escapeHtml(story.title)}\`)">🔗 مشاركة</button>
                    <button class="btn btn-edit" onclick="openEditModal('${story.id}', \`${escapeHtml(story.title)}\`, \`${escapeHtml(story.content)}\`, '${story.imageUrl || ''}')">✏️ تعديل</button>
                    <button class="btn btn-delete" onclick="deleteStory('${story.id}')">🗑️ حذف</button>
                </div>
            `;
            listDiv.appendChild(card);
        });
    }

    // إضافة قصة جديدة مع الضغط الأوتوماتيكي للصور
    async function addStory() {
        const titleInput = document.getElementById("new-title");
        const contentInput = document.getElementById("new-content");
        const fileInput = document.getElementById("new-image-file");
        const submitBtn = document.getElementById("submit-btn");

        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const file = fileInput.files[0];

        if (!title || !content) {
            alert("يرجى إدخال عنوان ومحتوى القصة أولاً.");
            return;
        }

        try {
            submitBtn.innerText = "جاري المعالجة والرفع...";
            submitBtn.disabled = true;

            let imageUrl = '';
            if (file) {
                imageUrl = await compressAndConvertImage(file);
            }

            await db.collection("stories").add({
                title: title,
                content: content,
                imageUrl: imageUrl,
                likes: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            titleInput.value = "";
            contentInput.value = "";
            fileInput.value = "";
            updateWordCount();
            alert("تم نشر قصتك بنجاح!");
            window.location.hash = "#home";
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء النشر: " + error.message);
        } finally {
            submitBtn.innerText = "🚀 نشر القصة الآن";
            submitBtn.disabled = false;
        }
    }

    // تعديل البيانات
    let currentEditImageUrl = '';
    function openEditModal(id, title, content, imageUrl) {
        document.getElementById("edit-id").value = id;
        document.getElementById("edit-title").value = title;
        document.getElementById("edit-content").value = content;
        
        currentEditImageUrl = imageUrl;
        const preview = document.getElementById("edit-preview");
        if (imageUrl) {
            preview.src = imageUrl;
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }

        document.getElementById("edit-modal").style.display = "flex";
    }

    function closeEditModal() {
        document.getElementById("edit-modal").style.display = "none";
    }

    async function saveStoryEdit() {
        const id = document.getElementById("edit-id").value;
        const newTitle = document.getElementById("edit-title").value.trim();
        const newContent = document.getElementById("edit-content").value.trim();
        const fileInput = document.getElementById("edit-image-file");
        const saveBtn = document.getElementById("save-edit-btn");

        if (!newTitle || !newContent) {
            alert("لا يمكن ترك العنوان أو المحتوى فارغاً.");
            return;
        }

        try {
            saveBtn.innerText = "جاري التحديث...";
            saveBtn.disabled = true;

            let finalImage = currentEditImageUrl;
            if (fileInput.files[0]) {
                finalImage = await compressAndConvertImage(fileInput.files[0]);
            }

            await db.collection("stories").doc(id).update({
                title: newTitle,
                content: newContent,
                imageUrl: finalImage,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeEditModal();
            alert("تم التعديل بنجاح!");
        } catch (error) {
            alert("حدث خطأ أثناء حفظ التعديل: " + error.message);
        } finally {
            saveBtn.innerText = "حفظ التعديلات";
            saveBtn.disabled = false;
        }
    }

    // حذف القصة
    async function deleteStory(id) {
        if (confirm("هل أنت تأكد تماماً من رغبتك في حذف هذه القصة؟")) {
            await db.collection("stories").doc(id).delete();
        }
    }

    // =========================================================
    // 3. Helper Functions & Utilities (Image Compressor, Audio, Search, Theme)
    // =========================================================

    // ضغط الصور لتجنب حدود Firestore
    function compressAndConvertImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 650;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = (maxWidth / width) * height;
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.65));
                };
            };
            reader.onerror = error => reject(error);
        });
    }

    // الإعجاب بالقصة
    async function likeStory(id, currentLikes) {
        try {
            await db.collection("stories").doc(id).update({
                likes: currentLikes + 1
            });
        } catch (e) {
            console.error(e);
        }
    }

    // مشاركة القصة
    function shareStory(id, title) {
        if (navigator.share) {
            navigator.share({
                title: title,
                url: window.location.href
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert("تم نسخ رابط المنصة إلى الحافظة!");
        }
    }

    // القراءة الصوتية
    let currentAudioId = null;
    function toggleAudio(id) {
        const text = document.getElementById(`content-${id}`).innerText;
        const btn = document.getElementById(`audio-btn-${id}`);

        if (typeof responsiveVoice === 'undefined') {
            alert("جاري تجهيز محرك الصوت، يرجى المحاولة بعد قليل.");
            return;
        }

        if (currentAudioId === id) {
            responsiveVoice.cancel();
            btn.innerText = "🔊 استمع";
            currentAudioId = null;
        } else {
            responsiveVoice.cancel();
            if (currentAudioId) {
                const oldBtn = document.getElementById(`audio-btn-${currentAudioId}`);
                if (oldBtn) oldBtn.innerText = "🔊 استمع";
            }

            responsiveVoice.speak(text, "Arabic Male", {
                rate: 0.85,
                onstart: () => {
                    currentAudioId = id;
                    btn.innerText = "⏹️ إيقاف";
                },
                onend: () => {
                    btn.innerText = "🔊 استمع";
                    currentAudioId = null;
                }
            });
        }
    }

    // فلترة البحث
    function filterStories() {
        const query = document.getElementById("search-input").value.toLowerCase();
        const filtered = allStoriesCache.filter(story => 
            story.title.toLowerCase().includes(query) || 
            story.content.toLowerCase().includes(query)
        );
        renderStories(filtered);
    }

    // حساب زمن القراءة
    function calculateReadingTime(text) {
        const words = text.trim().split(/\s+/).length;
        const minutes = Math.ceil(words / 150); // المعدل 150 كلمة/دقيقة
        return minutes;
    }

    // عداد الكلمات
    function updateWordCount() {
        const text = document.getElementById("new-content").value;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        document.getElementById("word-count-display").innerText = `عدد الكلمات: ${words} | الحروف: ${chars}`;
    }

    // الوضع الليلي
    function toggleTheme() {
        document.body.classList.toggle("dark-theme");
        const isDark = document.body.classList.contains("dark-theme");
        document.getElementById("theme-btn").innerText = isDark ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي";
    }

    // التحكم بحجم الخط
    let currentFontSize = 17;
    function adjustFontSize(delta) {
        currentFontSize += delta;
        if (currentFontSize < 13) currentFontSize = 13;
        if (currentFontSize > 25) currentFontSize = 25;
        document.documentElement.style.setProperty('--font-size-base', currentFontSize + 'px');
    }

    // منع حقن الأكواد الخبيثة HTML Escape
    function escapeHtml(text) {
        return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
