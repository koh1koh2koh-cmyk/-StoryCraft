<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي للقصص والروايات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #e2b714; text-decoration: none; }
        .btn-primary { background-color: #e2b714; color: #0f172a; padding: 10px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; }
        
        .controls-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        
        .filter-tags { display: flex; gap: 10px; }
        .tag-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .tag-btn.active { background: #e2b714; color: #0f172a; font-weight: bold; }

        .story-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .story-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .story-title { font-size: 1.4rem; color: #f8fafc; font-weight: bold; }
        .category-badge { background: #0f172a; border: 1px solid #e2b714; color: #e2b714; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; }
        
        .story-meta { display: flex; gap: 15px; font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
        .story-content { color: #cbd5e1; line-height: 1.7; margin-bottom: 20px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .story-content.expanded { -webkit-line-clamp: unset; }

        .story-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 15px; flex-wrap: wrap; gap: 10px; }
        .action-btns { display: flex; gap: 15px; }
        .action-btn { background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 5px; text-decoration: none; font-size: 0.9rem; }
        .action-btn:hover { color: #e2b714; }
        
        footer { background: #1e293b; border-top: 1px solid #334155; text-align: center; padding: 20px; color: #94a3b8; font-size: 0.85rem; margin-top: 40px; }
        footer a { color: #e2b714; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-book-open"></i> حكاية</a>
        <a href="submit.html" class="btn-primary"><i class="fa-solid fa-pen-nib"></i> شارك قصتك</a>
    </header>

    <div class="container">
        <div class="controls-card">
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="renderStories()" placeholder="ابحث عن قصة...">
            </div>
            <div class="filter-tags">
                <button class="tag-btn active" onclick="filterCategory('الكل', this)">الكل</button>
                <button class="tag-btn" onclick="filterCategory('واقعية', this)">واقعية</button>
                <button class="tag-btn" onclick="filterCategory('خيالية', this)">خيالية</button>
                <button class="tag-btn" onclick="filterCategory('رعب', this)">رعب</button>
            </div>
        </div>

        <div id="storiesGrid">جاري التحميل...</div>
    </div>

    <footer>
        <p>© 2026 منصة حكاية - جميع الحقوق محفوظة</p>

        <p><a href="privacy.html">سياسة الخصوصية والاستخدام</a></p>
    </footer>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
        authDomain: "hikaya-5ff25.firebaseapp.com",
        projectId: "hikaya-5ff25"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStories = [];
    let currentCategory = 'الكل';

    db.collection("stories").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        allStories = [];
        snapshot.forEach(doc => allStories.push({ id: doc.id, ...doc.data() }));
        renderStories();
    });

    function renderStories() {
        const grid = document.getElementById("storiesGrid");
        const query = document.getElementById("searchInput").value.toLowerCase();
        grid.innerHTML = "";

        const filtered = allStories.filter(s => {
            const matchCat = currentCategory === 'الكل' || s.category === currentCategory;
            const matchSearch = s.title.toLowerCase().includes(query) || s.content.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });

        filtered.forEach(story => {
            const pageLink = encodeURIComponent(`${window.location.origin}/story.html?id=${story.id}`);
            const card = document.createElement("div");
            card.className = "story-card";
            card.innerHTML = `
                <div class="story-header">
                    <a href="story.html?id=${story.id}" class="story-title" style="text-decoration:none;">${story.title}</a>
                    <span class="category-badge">${story.category}</span>
                </div>
                <div class="story-meta">
                    <span>✍️ ${story.author}</span>
                    <span>🔗 ${story.relation || 'غير محدد'}</span>
                </div>
                <div class="story-content" id="c-${story.id}">${story.content}</div>
                
                <div class="story-footer">
                    <div class="action-btns">
                        <button class="action-btn" onclick="likeStory('${story.id}', ${story.likes || 0})"><i class="fa-solid fa-heart"></i> ${story.likes || 0}</button>
                        <a href="https://api.whatsapp.com/send?text=${pageLink}" target="_blank" class="action-btn"><i class="fa-brands fa-whatsapp"></i></a>
                        <a href="https://t.me/share/url?url=${pageLink}" target="_blank" class="action-btn"><i class="fa-brands fa-telegram"></i></a>
                        <button class="action-btn" onclick="reportStory('${story.id}')" style="color:#ef4444;"><i class="fa-solid fa-flag"></i> إبلاغ</button>
                    </div>
                    <a href="story.html?id=${story.id}" style="color:#e2b714; font-weight:bold; text-decoration:none;">قراءة كاملة ⬅️</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderStories();
    }

    async function likeStory(id, current) {
        await db.collection("stories").doc(id).update({ likes: current + 1 });
    }

    async function reportStory(id) {
        const reason = prompt("يرجى كتابة سبب الإبلاغ عن هذه القصة:");
        if (reason) {
            await db.collection("reports").add({ storyId: id, reason: reason, createdAt: new Date() });
            alert("تم إرسال بلاغك للإدارة للمراجعة.");
        }
    }
</script>
</body>
</html>
