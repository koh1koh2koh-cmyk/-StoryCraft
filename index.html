<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <!-- خطوط جوجل العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. متغيرات التصميم ونظام الألوان (Variables)
           ================================---------- */
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --border-color: #334155;
            --font-main: 'Cairo', sans-serif;
            --wa-bg: #111b21;
            --wa-card: #202c33;
            --wa-green: #00a884;
            --wa-bubble-me: #005c4b;
            --wa-bubble-them: #202c33;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --border-color: #e2e8f0;
            --wa-bg: #efeae2;
            --wa-card: #ffffff;
            --wa-bubble-me: #d9fdd3;
            --wa-bubble-them: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* ==========================================
           2. التنسيقات الأساسية وإعادة الضبط (Reset)
           ================================---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================
           3. شريط التنقل العلوي (Header)
           ================================---------- */
        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: var(--shadow-sm);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }

        .btn-auth {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-auth:hover {
            background-color: var(--accent-hover);
        }

        .btn-logout {
            background-color: #ef4444;
        }
        .btn-logout:hover {
            background-color: #dc2626;
        }

        /* ==========================================
           4. الهيكل الرئيسي للصفحة (Grid & Layout)
           ================================---------- */
        .container {
            max-width: 1440px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* الحل الجذري للتخطيط: مرن وموزع بدقة لمنع التداخل وقص النصوص */
        .main-layout {
            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
        }

        /* لوحة نشر القصة الجانبية الثابتة */
        aside {
            width: 380px;
            flex-shrink: 0;
            position: sticky;
            top: 5.5rem;
        }

        /* منطقة عرض القصص الكبرى (تأخذ باقي مساحة الشاشة بالكامل) */
        main {
            flex: 1;
            min-width: 0; /* عنصر أساسي لمنع تمدد العناصر المرنة بشكل خاطئ */
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }
            aside {
                width: 100%;
                position: relative;
                top: 0;
            }
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            border-right: 5px solid var(--accent-color);
            padding-right: 12px;
            margin-bottom: 1.2rem;
            color: var(--text-main);
        }

        /* ==========================================
           5. صندوق نموذج النشر (Publish Box)
           ================================---------- */
        .publish-box {
            background-color: var(--bg-card);
            padding: 1.8rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 160px;
            line-height: 1.6;
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* ==========================================
           6. بطاقات عرض القصص (Story Cards)
           ================================---------- */
        .story-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.8rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            width: 100%;
        }

        .story-card h3 {
            color: var(--accent-color);
            margin-bottom: 0.4rem;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .story-author {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 1.2rem;
            display: inline-block;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.1);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        /* التنسيق الجذري لمنع قص النص أو تداخله بأي شكل */
        .story-text {
            font-size: 1.1rem;
            line-height: 2.2;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            width: 100%;
        }

        /* ==========================================
           7. نظام المحادثات الفورية (WhatsApp Style Chat)
           ================================---------- */
        .chat-float-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            background-color: var(--wa-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 1000;
            border: none;
        }

        .chat-modal {
            position: fixed;
            bottom: 105px;
            left: 30px;
            width: 400px;
            height: 580px;
            background-color: var(--wa-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .chat-modal.open {
            display: flex;
        }

        @media (max-width: 480px) {
            .chat-modal {
                bottom: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 0;
            }
        }

        .modal-header {
            background-color: var(--wa-card);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .chat-search-box {
            padding: 12px;
            background-color: var(--wa-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-search-box input {
            width: 100%;
            padding: 9px 14px;
            background: var(--wa-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .user-item:hover {
            background-color: var(--wa-card);
        }

        .user-item img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-item .name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .user-item .sub {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .active-chat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--wa-bg);
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .active-chat.open {
            display: flex;
        }

        .chat-sub-header {
            padding: 12px 18px;
            background-color: var(--wa-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .messages-area {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.92rem;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
        }

        .msg-bubble.me {
            align-self: flex-start;
            background-color: var(--wa-bubble-me);
            color: #fff;
        }

        .msg-bubble.them {
            align-self: flex-end;
            background-color: var(--wa-bubble-them);
            color: var(--text-main);
        }

        .msg-bubble img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }

        .chat-input-row {
            padding: 12px 16px;
            background-color: var(--wa-card);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .chat-input-row input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-row button[type="submit"] {
            background: var(--wa-green);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <h1>منصة حكاية</h1>
        <div class="header-actions">
            <button class="btn-auth" id="themeToggle" title="تغيير المظهر">🌙 المظهر</button>
            <div id="authBox">
                <button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <div class="main-layout">
            
            <!-- نموذج نشر القصة (الجانب الأيمن) -->
            <aside>
                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group">
                            <input type="text" id="storyTitle" placeholder="عنوان القصة" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="authorName" placeholder="اسم الكاتب" required>
                        </div>
                        <div class="form-group">
                            <textarea id="storyContent" placeholder="اكتب أو الصق نص القصة كاملاً هنا بدون أي قيود..." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">نشر القصة الآن</button>
                    </form>
                </div>
            </aside>

            <!-- قسم عرض أحدث القصص (المساحة الكبرى الواسعة) -->
            <main>
                <h2 class="section-title">أحدث القصص المنشورة</h2>
                <div id="stories-container"></div>
            </main>

        </div>
    </div>

    <!-- زر المحادثات العائم -->
    <button class="chat-float-btn" id="chatFloatBtn" title="المحادثات والأصدقاء">💬</button>

    <!-- نافذة الدردشة والرسائل -->
    <div class="chat-modal" id="chatModal">
        <div class="modal-header">
            <h3>💬 المحادثات والأصدقاء</h3>
            <button class="back-btn" onclick="toggleChatModal()">✖</button>
        </div>
        <div class="chat-search-box">
            <input type="text" id="userSearchInput" placeholder="🔍 ابحث عن اسم مستخدم...">
        </div>
        <div class="modal-body">
            <div class="users-list" id="usersList"></div>
            <div class="active-chat" id="activeChat">
                <div class="chat-sub-header">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="back-btn" onclick="closeActiveChat()">➡️</button>
                        <span id="targetUserName" style="font-weight: 700; color: var(--text-main);">المحادثة</span>
                    </div>
                    <button style="background:none; border:none; color:var(--wa-green); font-size:1.3rem; cursor:pointer;" onclick="startRealCallLink()" title="بدء مكالمة فيديو">📞</button>
                </div>
                <div class="messages-area" id="messagesArea"></div>
                <form class="chat-input-row" id="chatForm">
                    <label style="cursor:pointer; font-size:1.3rem; color:var(--text-muted);" title="إرسال صورة">
                        📷
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    </label>
                    <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                    <button type="submit">إرسال</button>
                </form>
            </div>
        </div>
    </div>

    <!-- مكتبات فايربيس (Firebase SDKs النسخة المتوافقة) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- سكريبت البرمجة وإدارة المنصة بالكامل -->
    <script>
        // إعدادات مشروع فايربيس الخاص بك
        const firebaseConfig = {
          apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
          authDomain: "hikaya-5ff25.firebaseapp.com",
          databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
          projectId: "hikaya-5ff25",
          storageBucket: "hikaya-5ff25.firebasestorage.app",
          messagingSenderId: "1031922678593",
          appId: "1:1031922678593:web:c242a9e36ad40becc9bfc0",
          measurementId: "G-KR76L2WSZ7"
        };

        // تهيئة فايربيس
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null, selectedUser = null, currentChatId = null, allUsersData = [];

        // إدارة المصادقة وتسجيل الدخول بحساب جوجل
        function handleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert(err.message));
        }
        function handleLogout() {
            auth.signOut();
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authBox').innerHTML = `
                    <img src="${user.photoURL}" class="user-avatar" title="${user.displayName}">
                    <button class="btn-auth btn-logout" onclick="handleLogout()">خروج</button>
                `;
                document.getElementById('authorName').value = user.displayName;
                database.ref('users/' + user.uid).set({
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL
                });
                loadUsers();
            } else {
                currentUser = null;
                document.getElementById('authBox').innerHTML = `<button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>`;
                document.getElementById('usersList').innerHTML = '<div style="padding:25px; text-align:center; color:var(--text-muted);">سجّل الدخول للتواصل مع المستخدمين 📞</div>';
            }
        });

        // نافذة المحادثات المنبثقة
        const chatModal = document.getElementById('chatModal');
        document.getElementById('chatFloatBtn').onclick = () => chatModal.classList.toggle('open');
        function toggleChatModal() { chatModal.classList.remove('open'); }
        function closeActiveChat() { document.getElementById('activeChat').classList.remove('open'); }

        // تحميل قائمة المستخدمين
        function loadUsers() {
            database.ref('users').on('value', snapshot => {
                allUsersData = [];
                snapshot.forEach(child => {
                    const u = child.val();
                    if (currentUser && u.uid !== currentUser.uid) {
                        allUsersData.push(u);
                    }
                });
                renderUsersList(allUsersData);
            });
        }

        function renderUsersList(users) {
            const list = document.getElementById('usersList');
            list.innerHTML = users.length === 0 ? '<div style="padding:25px; text-align:center; color:var(--text-muted);">لا يوجد مستخدمون نشطون حالياً</div>' : '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `
                    <img src="${u.photo}">
                    <div style="flex:1;">
                        <div class="name">${u.name}</div>
                        <div class="sub">انقر لبدء المحادثة</div>
                    </div>
                `;
                div.onclick = () => {
                    selectedUser = u;
                    document.getElementById('targetUserName').textContent = u.name;
                    document.getElementById('activeChat').classList.add('open');
                    currentChatId = currentUser.uid < u.uid ? `${currentUser.uid}_${u.uid}` : `${u.uid}_${currentUser.uid}`;
                    loadMessages();
                };
                list.appendChild(div);
            });
        }

        document.getElementById('userSearchInput').oninput = (e) => {
            const q = e.target.value.trim().toLowerCase();
            renderUsersList(allUsersData.filter(u => u.name.toLowerCase().includes(q)));
        };

        // جلب الرسائل الفورية
        function loadMessages() {
            database.ref('private_chats/' + currentChatId).on('value', snapshot => {
                const area = document.getElementById('messagesArea');
                area.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const b = document.createElement('div');
                    b.className = `msg-bubble ${msg.senderId === currentUser.uid ? 'me' : 'them'}`;
                    if (msg.type === 'image') {
                        b.innerHTML = `<img src="${msg.text}">`;
                    } else if (msg.type === 'call_link') {
                        b.innerHTML = `🎥 رابط مكالمة فيديو:<br><a href="${msg.text}" target="_blank" style="color: #60a5fa; text-decoration: underline;">انضم للمكالمة هنا</a>`;
                    } else {
                        b.textContent = msg.text;
                    }
                    area.appendChild(b);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        // إرسال رسالة نصية
        document.getElementById('chatForm').onsubmit = (e) => {
            e.preventDefault();
            const text = document.getElementById('msgInput').value.trim();
            if (!currentChatId || !text) return;
            database.ref('private_chats/' + currentChatId).push({
                senderId: currentUser.uid,
                text: text,
                type: 'text',
                timestamp: Date.now()
            });
            document.getElementById('msgInput').value = '';
        };

        // إرسال صورة في الدردشة
        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                database.ref('private_chats/' + currentChatId).push({
                    senderId: currentUser.uid,
                    text: ev.target.result,
                    type: 'image',
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
        };

        // إنشاء رابط مكالمة فيديو فورية
        function startRealCallLink() {
            if (!selectedUser || !currentChatId) return;
            const callUrl = `https://meet.jit.si/HikayaCall-${Math.random().toString(36).substring(2, 9)}`;
            database.ref('private_chats/' + currentChatId).push({
                senderId: currentUser.uid,
                text: callUrl,
                type: 'call_link',
                timestamp: Date.now()
            });
            window.open(callUrl, '_blank');
        }

        // تبديل المظهر (ليلي / نهاري)
        document.getElementById("themeToggle").onclick = () => {
            const isLight = document.documentElement.getAttribute("data-theme") === "light";
            document.documentElement.setAttribute("data-theme", isLight ? "" : "light");
            localStorage.setItem("hikaya_theme", isLight ? "dark" : "light");
        };
        if (localStorage.getItem("hikaya_theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
        }

        // إدارة نظام نشر وعرض القصص محلياً ومع قاعدة البيانات
        const storiesContainer = document.getElementById("stories-container");
        let stories = JSON.parse(localStorage.getItem("hikaya_stories_v6")) || [
            { 
                id: 1, 
                title: "رحلة غارلون", 
                author: "غارلون", 
                content: "قصة مشوقة عن المغامرات والقتال في عوالم خيالية واسعة...\n\nتم ضبط مساحة العرض بالكامل لتظهر القصص بكامل راحتها وبدون أي اقتطاع للنصوص أو تداخل في العناصر نهائياً." 
            }
        ];
        localStorage.setItem("hikaya_stories_v6", JSON.stringify(stories));

        function renderStories() {
            storiesContainer.innerHTML = "";
            stories.forEach(story => {
                const article = document.createElement("article");
                article.className = "story-card";
                article.innerHTML = `
                    <h3>${story.title}</h3>
                    <span class="story-author">الكاتب: ${story.author}</span>
                    <div class="story-text">${story.content}</div>
                `;
                storiesContainer.appendChild(article);
            });
        }
        renderStories();

        document.getElementById("storyForm").onsubmit = (e) => {
            e.preventDefault();
            const title = document.getElementById("storyTitle").value.trim();
            const author = document.getElementById("authorName").value.trim();
            const content = document.getElementById("storyContent").value.trim();
            if (!title || !author || !content) return;

            const newStory = { id: Date.now(), title, author, content };
            stories.unshift(newStory);
            localStorage.setItem("hikaya_stories_v6", JSON.stringify(stories));
            renderStories();
            document.getElementById("storyForm").reset();
            if(currentUser) {
                document.getElementById('authorName').value = currentUser.displayName;
            }
        };
    </script>
</body>
</html>
