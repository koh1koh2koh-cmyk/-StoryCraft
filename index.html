<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- وسم إثبات الملكية لشبكة HilltopAds -->
    <meta name="831eddb738b5b1ae28a10a41fe1da8ac2df6a058" content="831eddb738b5b1ae28a10a41fe1da8ac2df6a058" />
    
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    <meta name="description" content="اقرأ وانشر أحدث القصص والروايات العربية وتواصَل مع الكُتّاب والقرّاء في محادثات مباشرة.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --border-color: #334155;
            --danger-color: #ef4444;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --font-main: 'Cairo', sans-serif;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.8;
            direction: rtl;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
        }

        .btn-auth {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .container {
            max-width: 1150px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .hero {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background-color: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow);
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
            font-weight: 800;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 850px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.5rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
            margin-bottom: 1.5rem;
        }

        .story-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .story-card h3 {
            color: var(--accent-color);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .story-card .meta-info {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .publish-box, .chat-box-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        /* تصميم غرفة المحادثة */
        .chat-messages {
            height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            background: var(--bg-card);
            padding: 8px 12px;
            border-radius: 8px;
            border-right: 3px solid var(--accent-color);
            font-size: 0.9rem;
        }

        .chat-msg .sender {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 0.8rem;
            display: block;
        }

        .chat-input-area {
            display: flex;
            gap: 5px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
        }

        .chat-input-area button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            margin-top: 4rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة حكاية</h1>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle">
                <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
            </button>
            <div class="auth-box" id="authBox">
                <button class="btn-auth" id="loginBtn">تسجيل الدخول بـ Google</button>
            </div>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h2>التجمع العربي الأكبر للقصص والروايات</h2>
            <p>اقرأ، شارك، وتواصل مع الكُتّاب والقرّاء في بيئة تفاعلية ومميزة.</p>
        </section>

        <div class="main-layout">
            <main>
                <h2 class="section-title">أحدث القصص المنشورة</h2>
                <div id="stories-container"></div>
            </main>

            <aside>
                <!-- غرفة الدردشة الجماعية -->
                <div class="chat-box-container">
                    <h2 class="section-title">شات القرّاء 💬</h2>
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-msg">
                            <span class="sender">النظام</span>
                            مرحباً بك! سجل دخولك وابدأ الدردشة مع القرّاء وتكوين صداقات جديدة.
                        </div>
                    </div>
                    <form id="chatForm" class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="اكتب رسالة..." required disabled>
                        <button type="submit" id="sendChatBtn" disabled>إرسال</button>
                    </form>
                </div>

                <!-- صندوق نشر القصص -->
                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group">
                            <label for="storyTitle">عنوان القصة</label>
                            <input type="text" id="storyTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="authorName">اسم الكاتب</label>
                            <input type="text" id="authorName" required>
                        </div>
                        <div class="form-group">
                            <label for="storyCategory">التصنيف</label>
                            <select id="storyCategory">
                                <option value="أكشن وغموض">أكشن وغموض</option>
                                <option value="خيال وفنتازيا">خيال وفنتازيا</option>
                                <option value="دراما ومغامرات">دراما ومغامرات</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="storyContent">نص القصة</label>
                            <textarea id="storyContent" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">نشر الآن</button>
                    </form>
                </div>
            </aside>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 منصة حكاية - جميع الحقوق محفوظة</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
          apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
          authDomain: "hikaya-5ff25.firebaseapp.com",
          databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
          projectId: "hikaya-5ff25",
          storageBucket: "hikaya-5ff25.firebasestorage.app",
          messagingSenderId: "1031922678593",
          appId: "1:1031922678593:web:c242a9e36ad40becc9bfc0",
          measurementId: "G-KR76L2WSZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;

        // إدارة تسجيل الدخول
        const loginBtn = document.getElementById('loginBtn');
        const authBox = document.getElementById('authBox');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        loginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert(error.message));
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                authBox.innerHTML = `
                    <img src="${user.photoURL}" class="user-avatar" title="${user.displayName}">
                    <button class="btn-auth" style="background:#ef4444" id="logoutBtn">خروج</button>
                `;
                document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
                document.getElementById('authorName').value = user.displayName;
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
                chatInput.placeholder = "اكتب رسالة...";
            } else {
                currentUser = null;
                authBox.innerHTML = `<button class="btn-auth" id="loginBtn">تسجيل الدخول بـ Google</button>`;
                document.getElementById('loginBtn').addEventListener('click', () => {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider);
                });
                chatInput.disabled = true;
                sendChatBtn.disabled = true;
                chatInput.placeholder = "سجل الدخول للمشاركة في المحادثة...";
            }
        });

        // إدارة الشات المباشر
        const chatForm = document.getElementById('chatForm');
        const chatMessages = document.getElementById('chatMessages');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!currentUser || !chatInput.value.trim()) return;

            database.ref('chats').push({
                name: currentUser.displayName,
                text: chatInput.value.trim(),
                timestamp: Date.now()
            });

            chatInput.value = '';
        });

        database.ref('chats').limitToLast(20).on('child_added', (snapshot) => {
            const msg = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span class="sender">${escapeHtml(msg.name)}</span> ${escapeHtml(msg.text)}`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // إدارة المظهر والنصوص
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // إدارة المظهر (Dark / Light)
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        const themeText = document.getElementById("themeText");
        
        themeToggle.addEventListener("click", () => {
            const isLight = document.documentElement.getAttribute("data-theme") === "light";
            if (isLight) {
                document.documentElement.removeAttribute("data-theme");
                themeIcon.textContent = "🌙";
                themeText.textContent = "الوضع الداكن";
            } else {
                document.documentElement.setAttribute("data-theme", "light");
                themeIcon.textContent = "☀️";
                themeText.textContent = "الوضع المضيء";
            }
        });

        // إدارة نشر وسحب القصص محلياً
        const storyForm = document.getElementById("storyForm");
        const storiesContainer = document.getElementById("stories-container");
        let stories = JSON.parse(localStorage.getItem("hikaya_stories")) || [
            { id: 1, title: "رحلة غارلون", author: "غارلون", category: "أكشن", content: "قصة مشوقة عن المغامرات والقتال..." }
        ];

        function renderStories() {
            storiesContainer.innerHTML = "";
            stories.forEach(story => {
                const article = document.createElement("article");
                article.className = "story-card";
                article.innerHTML = `
                    <h3>${escapeHtml(story.title)}</h3>
                    <div class="meta-info"><span>بواسطة: ${escapeHtml(story.author)}</span></div>
                    <p>${escapeHtml(story.content)}</p>
                `;
                storiesContainer.appendChild(article);
            });
        }
        renderStories();

        storyForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const title = document.getElementById("storyTitle").value;
            const author = document.getElementById("authorName").value;
            const content = document.getElementById("storyContent").value;
            stories.unshift({ id: Date.now(), title, author, content });
            localStorage.setItem("hikaya_stories", JSON.stringify(stories));
            renderStories();
            storyForm.reset();
        });
    </script>

    <!-- Monetag Direct Link Script (1/7 Clicks) -->
    <script>
        let clickCount = 0;
        document.addEventListener('click', function() {
            clickCount++;
            if (clickCount % 7 === 1) {
                window.open('https://omg10.com/4/11651127', '_blank');
            }
        });
    </script>
</body>
</html>
