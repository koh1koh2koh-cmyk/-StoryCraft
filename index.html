<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية - قراءة ونشر القصص</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e2e8f0;
            --danger-color: #dc2626;
            --success-color: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        #readingProgressBar {
            position: fixed;
            top: 0;
            right: 0;
            height: 4px;
            background: var(--accent-color);
            width: 0%;
            z-index: 1000;
            transition: width 0.1s;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            background: var(--border-color);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .panel-title {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-family: inherit;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            text-align: center;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .story-bundle-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .bundle-header {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .bundle-cover {
            width: 90px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
        }

        .bundle-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .story-badge {
            background: var(--bg-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .story-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.25rem;
            margin-top: 1rem;
        }

        .story-card h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .story-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .reading-toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .tool-btn:hover {
            border-color: var(--accent-color);
        }

        .story-text {
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-line;
            margin-bottom: 1rem;
        }

        .card-actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
        }

        .interaction-group {
            display: flex;
            gap: 0.5rem;
        }

        .like-btn, .fav-btn, .share-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .like-btn.liked { color: var(--danger-color); border-color: var(--danger-color); }
        .fav-btn.faved { color: #f59e0b; border-color: #f59e0b; }

        .btn-delete-card {
            background: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2000;
        }

        .toast {
            background: var(--panel-bg);
            color: var(--text-color);
            border-right: 4px solid var(--accent-color);
            padding: 0.75rem 1.25rem;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease;
        }

        .toast.success { border-color: var(--success-color); }
        .toast.danger { border-color: var(--danger-color); }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        body.focus-mode header,
        body.focus-mode .sidebar,
        body.focus-mode .reading-toolbar,
        body.focus-mode .card-actions-bar {
            display: none !important;
        }

        body.focus-mode .main-layout {
            grid-template-columns: 1fr;
            max-width: 800px;
        }

        .folder-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .folder-item:hover {
            background: var(--bg-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1500;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div id="readingProgressBar"></div>

    <header>
        <div class="logo">📖 حكاية</div>
        <div class="header-actions">
            <button class="btn btn-outline" id="themeToggleBtn">☀️ Light Mode</button>
            <button class="btn btn-outline" onclick="openBackupModal()">💾 Backup</button>
            <button class="btn" onclick="scrollToPublish()">✍️ نشر قصة</button>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="panel-box" id="resumeReadingBox" style="display: none;">
                <h3 class="panel-title">📍 متابعة القراءة</h3>
                <p id="resumeStoryText" style="font-size:0.85rem; margin-bottom:0.5rem; color:var(--text-muted);"></p>
                <button class="btn btn-outline" style="width:100%" id="resumeStoryBtn">الانتقال للنقطة الحالية</button>
            </div>

            <div class="panel-box">
                <h3 class="panel-title">📊 الإحصائيات</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statTotalStories">0</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">الفصول</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statTotalAuthors">0</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">المؤلفون</div>
                    </div>
                </div>
            </div>

            <div class="panel-box">
                <h3 class="panel-title">🔍 البحث والتصفية</h3>
                <div class="form-group">
                    <input type="text" id="globalSearchInput" class="form-control" placeholder="بحث في عناوين القصص والمحتوى...">
                </div>
                <div class="form-group">
                    <input type="text" id="folderSearchInput" class="form-control" placeholder="تصفية حسب اسم الكاتب...">
                </div>
                <div id="authorFolderList"></div>
                <button class="btn btn-outline" style="width:100%; margin-top:0.5rem;" onclick="resetFilters()">إعادة ضبط البحث</button>
            </div>

            <div class="panel-box" id="publishPanel">
                <h3 class="panel-title">✍️ نشر فصل جديد</h3>
                <form id="storyForm">
                    <div class="form-group">
                        <label>عنوان القصة الرئيسي</label>
                        <input type="text" id="storyTitle" class="form-control" required placeholder="رحلة نحو معرفة الذات">
                    </div>
                    <div class="form-group">
                        <label>اسم الكاتب</label>
                        <input type="text" id="authorName" class="form-control" required placeholder="اسم المؤلف">
                    </div>
                    <div class="form-group">
                        <label>رقم أو اسم الفصل</label>
                        <input type="text" id="storyPartNumber" class="form-control" required placeholder="مثال: الفصل الأول">
                    </div>
                    <div class="form-group">
                        <label>رابط صورة الغلاف (اختياري)</label>
                        <input type="url" id="coverUrl" class="form-control" placeholder="https://example.com/cover.jpg">
                    </div>
                    <div class="form-group">
                        <label>محتوى الفصل</label>
                        <textarea id="storyContent" class="form-control" required placeholder="اكتب نص الفصل هنا..."></textarea>
                    </div>
                    <button type="submit" class="btn" style="width:100%;">نشر الفصل</button>
                </form>
            </div>
        </aside>

        <main id="stories-container">
            <!-- Rendered stories dynamically -->
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div class="modal" id="backupModal">
        <div class="modal-content">
            <h3 class="panel-title">إدارة النسخ الاحتياطي</h3>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;">يمكنك تصدير كافة البيانات كملف JSON أو استعادتها من ملف سابق.</p>
            <div style="display:flex; flex-direction:column; gap:0.75rem;">
                <button class="btn" onclick="exportDataJSON()">تصدير البيانات (JSON)</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importDataJSON()">
                <button class="btn btn-outline" onclick="document.getElementById('importFileInput').click()">استعادة من ملف JSON</button>
                <button class="btn btn-outline" style="color:var(--danger-color); border-color:var(--danger-color);" onclick="closeBackupModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. CONSTANTS & INITIAL DATA
           ========================================================================== */
        const STORAGE_KEY = 'hikaya_stories_db';
        const LIKES_KEY = 'hikaya_likes_db';
        const FAVORITES_KEY = 'hikaya_favorites_db';
        const BOOKMARK_KEY = 'hikaya_bookmark_db';
        const USER_TOKEN_KEY = 'hikaya_user_token';

        function getCurrentUserToken() {
            let token = localStorage.getItem(USER_TOKEN_KEY);
            if (!token) {
                token = 'usr_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem(USER_TOKEN_KEY, token);
            }
            return token;
        }

        const defaultStoryDatabase = [
            {
                id: 'story_self_1',
                title: 'رحلة نحو معرفة الذات',
                author: 'مؤلف حكاية',
                ownerToken: 'system_default',
                part: 'الفصل الأول: النداء الداخلي',
                cover: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300',
                content: `في قلب الضوضاء التي تغمر العالم، وجد بطلنا نفسه يتساءل عن المعنى الحقيقي لوجوده. لم تكن الأسئلة عابرة، بل كانت تشبه صداءً يتردد في أعماق روحه كل ليلة.

بدأت الرحلة بقرار بسيط: الابتعاد عن صخب الحياة اليومية والبحث عن الإجابات في الصمت. لم تكن الطريق مفروشة بالورد، بل كانت مليئة بالتحديات والمواجهات مع المخاوف القديمة التي دفنها الزمن.`,
                createdAt: new Date('2026-08-01T10:00:00').getTime()
            },
            {
                id: 'story_self_2',
                title: 'رحلة نحو معرفة الذات',
                author: 'مؤلف حكاية',
                ownerToken: 'system_default',
                part: 'الفصل الثاني: مواجهة الظلال',
                cover: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300',
                content: `عندما قرر بطلنا التوقف عن الهرب من ماضيه، بدأت الحقائق بالظهور. التعرف على الذات لا يعني فقط رؤية الإيجابيات، بل يتطلب تقبل العيوب والانكسارات التي صنعت شخصيته الحالية.

في هذه المرحلة من الرحلة، أدرك أن القوة الحقيقية تكمن في التقُّبل والتصالح مع الذات، وأن كل تجربة مر بها كانت خطوة خطوة نحو إعادة اكتشاف شغفه الحقيقي.`,
                createdAt: new Date('2026-08-02T10:00:00').getTime()
            },
            {
                id: 'story_self_3',
                title: 'رحلة نحو معرفة الذات',
                author: 'مؤلف حكاية',
                ownerToken: 'system_default',
                part: 'الفصل الثالث: الإشراق والسلام',
                cover: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300',
                content: `مع انقشاع ضباب الشكوك، انفتحت آفاق جديدة أمام المسافر. لم يكتفِ بفهم ذاته فحسب، بل أدرك كيفية التواصل مع العالم من حوله بصدق وشفافية أكبر.

وصلت الرحلة إلى غايتها الأولى، ليس بفوزٍ في معركة خارجية، بل بتحقيق السلام الداخلي وتأكيد أن رحلة البحث عن الذات هي أغلى وأسمى ما يخوضه الإنسان.`,
                createdAt: new Date('2026-08-03T10:00:00').getTime()
            }
        ];

        /* ==========================================================================
           2. STATE MANAGEMENT & UTILS
           ========================================================================== */
        let stories = [];
        let likes = {};
        let favorites = [];

        function initApp() {
            loadData();
            setupTheme();
            setupEventListeners();
            renderStories();
            updateStats();
            checkResumeReading();
        }

        function loadData() {
            const storedStories = localStorage.getItem(STORAGE_KEY);
            stories = storedStories ? JSON.parse(storedStories) : defaultStoryDatabase;
            if (!storedStories) saveData();

            likes = JSON.parse(localStorage.getItem(LIKES_KEY)) || {};
            favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY)) || [];
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
            localStorage.setItem(LIKES_KEY, JSON.stringify(likes));
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
            updateStats();
        }

        function showToast(message, type = 'accent') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function calculateReadTime(text) {
            const words = text.trim().split(/\s+/).length;
            const minutes = Math.ceil(words / 150);
            return `${minutes} دقائق قراءة`;
        }

        /* ==========================================================================
           3. THEME & INTERFACE CONTROLS
           ========================================================================== */
        function setupTheme() {
            const savedTheme = localStorage.getItem('hikaya_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);
        }

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('hikaya_theme', newTheme);
            updateThemeButtonText(newTheme);
        });

        function updateThemeButtonText(theme) {
            document.getElementById('themeToggleBtn').innerHTML = theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
        }

        function toggleFocusMode() {
            document.body.classList.toggle('focus-mode');
        }

        function changeFontSize(storyId, delta) {
            const el = document.getElementById(`text-${storyId}`);
            if (!el) return;
            const style = window.getComputedStyle(el);
            const currentSize = parseFloat(style.fontSize);
            el.style.fontSize = `${Math.max(14, Math.min(32, currentSize + delta))}px`;
        }

        /* ==========================================================================
           4. RENDER & FILTER ENGINE
           ========================================================================== */
        function groupStoriesByTitle(storyList) {
            return storyList.reduce((acc, story) => {
                if (!acc[story.title]) acc[story.title] = [];
                acc[story.title].push(story);
                return acc;
            }, {});
        }

        function renderStories(filterAuthor = '', searchQuery = '') {
            const container = document.getElementById('stories-container');
            container.innerHTML = '';

            let filtered = [...stories];
            if (filterAuthor) {
                filtered = filtered.filter(s => s.author.toLowerCase() === filterAuthor.toLowerCase());
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(s => s.title.toLowerCase().includes(q) || s.content.toLowerCase().includes(q) || s.author.toLowerCase().includes(q));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="panel-box" style="text-align:center; color:var(--text-muted); padding:3rem;">لم يتم العثور على أي قصص.</div>`;
                return;
            }

            const grouped = groupStoriesByTitle(filtered);
            const currentToken = getCurrentUserToken();

            Object.keys(grouped).forEach(title => {
                const bundle = grouped[title];
                const first = bundle[0];

                const bundleBox = document.createElement('div');
                bundleBox.className = 'story-bundle-box';

                let bundleHTML = `
                    <div class="bundle-header">
                        <img src="${first.cover || 'https://via.placeholder.com/90x120?text=Hikaya'}" class="bundle-cover" alt="Cover" onerror="this.src='https://via.placeholder.com/90x120?text=Hikaya'">
                        <div class="bundle-info">
                            <h2 class="bundle-title">${first.title}</h2>
                            <span class="story-badge">الكاتب: ${first.author}</span>
                        </div>
                    </div>
                `;

                bundle.forEach(story => {
                    const isOwner = story.ownerToken === currentToken;
                    const isLiked = likes[story.id] || false;
                    const isFav = favorites.includes(story.id);

                    bundleHTML += `
                        <div class="story-card" id="story-card-${story.id}">
                            <h3>
                                <span>${story.part}</span>
                                ${isOwner ? `<button class="btn-delete-card" onclick="deleteStory('${story.id}')">حذف الفصل</button>` : ''}
                            </h3>
                            <div class="story-meta">
                                <span class="read-time-badge">⏱️ ${calculateReadTime(story.content)}</span>
                            </div>
                            <div class="reading-toolbar">
                                <button class="tool-btn" onclick="changeFontSize('${story.id}', 2)">A+</button>
                                <button class="tool-btn" onclick="changeFontSize('${story.id}', -2)">A-</button>
                                <button class="tool-btn" onclick="toggleFocusMode()">👁️ وضع التركيز</button>
                                <button class="tool-btn" onclick="setBookmark('${story.id}', '${story.title}', '${story.part}')">🔖 حفظ نقطة التوقف</button>
                            </div>
                            <div class="story-text" id="text-${story.id}">${story.content}</div>
                            <div class="card-actions-bar">
                                <div class="interaction-group">
                                    <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${story.id}')">
                                        ❤️ <span>${isLiked ? 'أعجبني' : 'إعجاب'}</span>
                                    </button>
                                    <button class="fav-btn ${isFav ? 'faved' : ''}" onclick="toggleFavorite('${story.id}')">
                                        ⭐ <span>${isFav ? 'مفضلة' : 'حفظ'}</span>
                                    </button>
                                </div>
                                <button class="share-btn" onclick="shareStory('${story.title}', '${story.part}')">🔗 مشاركة</button>
                            </div>
                        </div>
                    `;
                });

                bundleBox.innerHTML = bundleHTML;
                container.appendChild(bundleBox);
            });
        }

        /* ==========================================================================
           5. EVENT HANDLERS & ACTIONS
           ========================================================================== */
        function setupEventListeners() {
            document.getElementById('storyForm').addEventListener('submit', handlePublish);
            
            document.getElementById('globalSearchInput').addEventListener('input', (e) => {
                renderStories('', e.target.value);
            });

            document.getElementById('folderSearchInput').addEventListener('input', (e) => {
                renderAuthorFolder(e.target.value);
            });

            window.addEventListener('scroll', updateProgressBar);
        }

        function handlePublish(e) {
            e.preventDefault();
            const title = document.getElementById('storyTitle').value.trim();
            const author = document.getElementById('authorName').value.trim();
            const part = document.getElementById('storyPartNumber').value;
            const cover = document.getElementById('coverUrl').value.trim();
            const content = document.getElementById('storyContent').value.trim();

            const newStory = {
                id: 'story_' + Date.now(),
                title,
                author,
                ownerToken: getCurrentUserToken(),
                part,
                cover,
                content,
                createdAt: Date.now()
            };

            stories.unshift(newStory);
            saveData();
            renderStories();
            document.getElementById('storyForm').reset();
            showToast('تم نشر الفصل بنجاح!', 'success');
        }

        function deleteStory(id) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا الفصل؟')) {
                stories = stories.filter(s => s.id !== id);
                saveData();
                renderStories();
                showToast('تم حذف الفصل.', 'danger');
            }
        }

        function toggleLike(id) {
            likes[id] = !likes[id];
            saveData();
            renderStories();
        }

        function toggleFavorite(id) {
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            saveData();
            renderStories();
        }

        function shareStory(title, part) {
            if (navigator.share) {
                navigator.share({ title: `${title} - ${part}`, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast('تم نسخ الرابط إلى الحافظة!', 'success');
            }
        }

        /* ==========================================================================
           6. BOOKMARK & PROGRESS TRACKING
           ========================================================================== */
        function setBookmark(id, title, part) {
            const bookmark = { id, title, part, timestamp: Date.now() };
            localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmark));
            checkResumeReading();
            showToast('تم حفظ موضع القراءة بنجاح!', 'success');
        }

        function checkResumeReading() {
            const saved = localStorage.getItem(BOOKMARK_KEY);
            const box = document.getElementById('resumeReadingBox');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('resumeStoryText').textContent = `توقفت عند: ${data.title} (${data.part})`;
                document.getElementById('resumeStoryBtn').onclick = () => {
                    const el = document.getElementById(`story-card-${data.id}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                    else showToast('لم يتم العثور على الفصل.', 'danger');
                };
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        function updateProgressBar() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('readingProgressBar').style.width = scrolled + '%';
        }

        /* ==========================================================================
           7. ARCHIVE, STATS & BACKUP
           ========================================================================== */
        function renderAuthorFolder(query = '') {
            const container = document.getElementById('authorFolderList');
            if (!query.trim()) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding: 10px;">اكتب اسم الكاتب لعرض أعماله</div>`;
                return;
            }

            const authors = [...new Set(stories.map(s => s.author))].filter(a => a.toLowerCase().includes(query.toLowerCase()));
            container.innerHTML = '';

            if (authors.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding: 10px;">لم يتم العثور على الكاتب</div>`;
                return;
            }

            authors.forEach(author => {
                const count = stories.filter(s => s.author === author).length;
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = `<span>👤 ${author}</span><strong>${count} فصول</strong>`;
                div.onclick = () => renderStories(author);
                container.appendChild(div);
            });
        }

        function updateStats() {
            document.getElementById('statTotalStories').textContent = stories.length;
            const uniqueAuthors = new Set(stories.map(s => s.author)).size;
            document.getElementById('statTotalAuthors').textContent = uniqueAuthors;
        }

        function resetFilters() {
            document.getElementById('globalSearchInput').value = '';
            document.getElementById('folderSearchInput').value = '';
            renderStories();
        }

        function openBackupModal() {
            document.getElementById('backupModal').classList.add('active');
        }

        function closeBackupModal() {
            document.getElementById('backupModal').classList.remove('active');
        }

        function scrollToPublish() {
            document.getElementById('publishPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function exportDataJSON() {
            const blob = new Blob([JSON.stringify(stories, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hikaya_backup_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير البيانات بنجاح!', 'success');
        }

        function importDataJSON() {
            const input = document.getElementById('importFileInput');
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedStories = JSON.parse(e.target.result);
                    if (Array.isArray(importedStories)) {
                        stories = importedStories;
                        saveData();
                        renderStories();
                        closeBackupModal();
                        showToast('تمت استعادة البيانات بنجاح!', 'success');
                    } else {
                        showToast('الملف غير صالِح.', 'danger');
                    }
                } catch (err) {
                    showToast('خطأ في قراءة الملف.', 'danger');
                }
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
