<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حكاية — قراءة ونشر القصص</title>

<style>
:root{
--bg:#0b1120;--panel:#111827;--panel2:#172033;--text:#f8fafc;
--muted:#94a3b8;--accent:#6366f1;--accent2:#818cf8;--border:#263247;
--danger:#ef4444;--ok:#10b981;--warning:#f59e0b;--shadow:0 12px 35px #0004
}
[data-theme="light"]{
--bg:#f1f5f9;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;
--muted:#64748b;--accent:#4f46e5;--accent2:#6366f1;--border:#e2e8f0;
--shadow:0 12px 30px #0f172a12
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;background:radial-gradient(circle at 15% 0,#6366f11a,transparent 35%),var(--bg);
color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
line-height:1.8
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#progress{
position:fixed;top:0;right:0;height:4px;width:0;z-index:9999;
background:linear-gradient(90deg,var(--accent),var(--accent2))
}

header{
position:sticky;top:0;z-index:1000;backdrop-filter:blur(14px);
background:color-mix(in srgb,var(--panel) 90%,transparent);
border-bottom:1px solid var(--border);padding:10px 4vw;
display:flex;align-items:center;justify-content:space-between;gap:15px
}

.logo img{
display:block;width:165px;height:68px;object-fit:contain
}

.actions{display:flex;gap:7px;flex-wrap:wrap}

.btn,.tool{
border:1px solid var(--border);background:var(--panel2);color:var(--text);
border-radius:10px;padding:8px 11px;transition:.2s
}

.btn:hover,.tool:hover{transform:translateY(-1px);border-color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.layout{
width:min(1450px,94vw);margin:22px auto;
display:grid;grid-template-columns:290px 1fr;gap:18px
}

.sidebar{
display:flex;flex-direction:column;gap:14px;
position:sticky;top:90px;align-self:start
}

.box,.bundle{
background:var(--panel);border:1px solid var(--border);
border-radius:14px;box-shadow:var(--shadow)
}

.box{padding:15px}
.box h3{margin:0 0 10px}

.field{
width:100%;background:var(--bg);color:var(--text);
border:1px solid var(--border);border-radius:9px;
padding:9px;margin:0 0 9px;outline:0
}

.field:focus{
border-color:var(--accent);
box-shadow:0 0 0 3px #6366f122
}

textarea.field{min-height:150px;resize:vertical}

.stats{
display:grid;grid-template-columns:1fr 1fr;gap:7px
}

.stat{
background:var(--panel2);padding:9px;border-radius:9px;text-align:center
}

.stat b{
display:block;color:var(--accent2);font-size:1.3rem
}

.muted{color:var(--muted);font-size:.86rem}

.authors{
max-height:220px;overflow:auto
}

.author{
padding:7px;border-radius:7px;
display:flex;justify-content:space-between;cursor:pointer
}

.author:hover,.author.active{
background:var(--panel2);color:var(--accent2)
}

#resume{
display:none
}

#resume.show{
display:block
}

.bundle{
padding:15px;margin-bottom:16px
}

.bundle-head{
display:flex;gap:13px;align-items:center;
padding-bottom:13px;border-bottom:1px solid var(--border)
}

.cover{
width:82px;height:110px;object-fit:cover;
border-radius:9px;background:var(--panel2)
}

.bundle h2{margin:0 0 3px;font-size:1.35rem}

.card{
background:var(--panel2);border:1px solid var(--border);
border-radius:12px;padding:14px;margin-top:13px
}

.card-head{
display:flex;justify-content:space-between;
gap:8px;align-items:center
}

.card h3{margin:0;font-size:1.05rem}

.toolbar,.actionsbar{
display:flex;gap:6px;flex-wrap:wrap;margin:11px 0
}

.tool{padding:6px 9px;font-size:.8rem}

.story-text{
font-size:1.05rem;line-height:2;
white-space:pre-wrap;overflow-wrap:anywhere
}

.actionsbar{
border-top:1px solid var(--border);
padding-top:10px;margin-bottom:0
}

.danger{color:var(--danger)!important;border-color:var(--danger)!important}
.liked{color:#ef4444!important;border-color:#ef4444!important}
.faved{color:#f59e0b!important;border-color:#f59e0b!important}

.empty{
text-align:center;padding:50px;color:var(--muted)
}

.toast-wrap{
position:fixed;left:15px;bottom:15px;z-index:5000;
display:flex;flex-direction:column;gap:6px
}

.toast{
background:var(--panel);border:1px solid var(--border);
border-right:4px solid var(--accent);
padding:9px 12px;border-radius:9px;box-shadow:var(--shadow)
}

.toast.ok{border-right-color:var(--ok)}
.toast.bad{border-right-color:var(--danger)}

.modal{
position:fixed;inset:0;background:#0008;
display:none;place-items:center;z-index:3000;padding:15px
}

.modal.open{display:grid}

.modal-card{
width:min(500px,100%);background:var(--panel);
border:1px solid var(--border);border-radius:15px;
padding:16px;box-shadow:var(--shadow)
}

.focus header,
.focus .sidebar,
.focus .toolbar,
.focus .actionsbar{
display:none!important
}

.focus .layout{
display:block;width:min(820px,94vw)
}

.focus .story-text{
font-size:1.15rem;line-height:2.15
}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
.sidebar{position:static;order:2}
.logo img{width:145px;height:58px}
}

@media(max-width:560px){
.logo img{width:120px;height:52px}
.actions .btn{font-size:.75rem;padding:7px}
.bundle,.box{border-radius:11px}
.cover{width:65px;height:88px}
}
</style>
</head>

title:"رحلة نحو معرفة الذات",
author:"غير محدد",
part:"الفصل الأول",
cover:"",
ownerToken:"system",
createdAt:1,
content:`في غابة مظلمة، كان هناك صوت رفرفة الأشجار الهادئة وأصوات الرياح. فجأة، ظهر نمر يركض خلف رجل غريب، وكانت أصوات خطوات الرجل هادئة ومخفية مثل القتلة المستأجرين.
​
تسلق الرجل الشجرة فلاحظه النمر، لكن الرجل لم يتوتر بل انقض عليه بسيفه وقتله، ثم أكمل طريقه.
​
في اليوم التالي، جاء رجلان من قرية قريبة من تلك الغابة لجمع فطر عش الغراب. رأى أحد الرجلين منظر جثة النمر فصُدم، ونادى على زميله وقال له وهو فرح ومبتسم:
— "هذا رائع! يمكننا بيعه في القرية".
​
فاستغرب زميله وقال:
— "لكن النمور لا تُباع في قريتنا، أين ستبيعها وكيف؟"
​
فقال له الآخر:
— "إن هذه قُطعت بواسطة رجل مشهور، وبالتأكيد الأغنياء سيشترونها".
​
فقال رجل القرية:
— "ومن قتل النمر؟"
​
أجابه زميله:
— "إنه سياف مشهور يدعى غارلون".
​
صُدم الرجل مما سمعه، وقررا بيعه في مدينة "كوراساوا" التي تبعد عنهم 7 كيلومترات، فأخذوا النمر معهم على عربة تجرها الأحصنة وانطلقا في رحلتهما.
​
قضى الرجلان 4 ساعات للوصول إلى كوراساوا؛ إذ كان الطريق مليئاً بالمطبات، وكانا متعبين بسبب الحرارة الحارقة، فقررا أن يرتاحا قليلاً. أثناء راحتهما، ظهر ظل لشخص ما في الغابة، فذهب أحد الرجلين ليرى من هذا الشخص بدافع الفضول. وما إن وصل حتى ملأت الصدمة وجهه؛ إذ كان أمامه السياف غارلون وهو يتدرب في الغابة.
​
لمحه السياف وكان سيقتله ظناً منه أنه خطر يهدده، لكن الرجل قال له ليهدئه:
— "اهدأ، فأنا لن أؤذيك".
​
تفهم غارلون الكلام وهدأ، وقرر أن يتركه. ولكن قبل أن يبتعد، سمع غارلون صوت حركة خلف رجل القرية، فركض وفوجئ بسياف آخر يقتل زميل رجل القرية!
​
فحزن عليه صديقه كثيراً. انقض غارلون على السياف المعتدي، وظلا يتقاتلان ويتبادلان الضربات بالسيف، وكان غارلون متفوقاً عليه في القتال بشكل ملحوظ.
​
أثناء القتال، ذهب الرجل إلى زميله الذي كان يحتضر وقال له:
— "أين أصبت؟"
​
فقال بصوت مليء بالألم:
— "أصابني في بطني".
​
فسأله:
— "أين بالضبط؟"
​
أجاب بصوت متألم:
— "لا أعرف..."
​
حاول زميله أن يعالجه لكنه فشل، فقال له المحتضر:
— "هذه نهايتي، لا تتعب نفسك. اذهب مع غارلون فهو سيحميك بدلاً مني، فالقرية بعيدة جداً ولن تستطيع الوصول إليها بمفردك. أريد أن أقول شيئاً كنت أود قوله عند مماتي..."
​
فسأله زميله:
— "ما هو؟"
​
قال الرجل:
— "ليت الواقع حلم، وليت مماتي لم يكن واقعاً".
​
ثم فاضت روحه وتوفى.
​
بكى عليه زميله كثيراً، وعندما نظر إلى غارلون اندهش؛ فقد كان غارلون قد أنهى حياة السياف الآخر بمهارة متقنة. جاء غارلون إليه بخطوات هادئة وقال له:
— "هل أنت بخير؟"
​
أجاب الرجل:
— "نعم، لكن زميلي توفى، وقال لي أن أذهب معك".
​
رد غارلون:
— "حسناً، ولكن هل يمكنك أن تشارك معي في رحلتي؟"
​
فقال رجل القرية:
— "نعم، بكل سرور".
​
مشى غارلون مع رجل القرية وقال له:
— "عرّفني عن نفسك".
​
قال الرجل:
— "اسمي محمد، وأنا من قرية 'هيوكامارا' التي تبعد عن هنا مسافة 7 كم".
​
فقال له غارلون إنه من مدينة "ميكارليس"، وهي مدينة بعيدة جداً.
​
سأل محمد:
— "ما هو الهدف الذي تسعى إليه يا غارلون؟"
​
أجابه غارلون:
— "أريد أن أجمع المال وأسعى لتسديد ديوني".
​
فقال محمد مستغرباً:
— "ولماذا أنت مديون؟"
​
رد غارلون:
— "في الماضي، كان والدي يلعب القمار ويستلف النقود من العصابات. وعندما لم يسدد ديونه، قتله رجال العصابة وأصبحت الديون على عاتقي. ويبلغ قيمة هذا الدين 500 مليون ين".
​
انصدم محمد من الرقم وقال بصوت مهزوز من الصدمة:
— "إلى أين سنذهب الآن يا غارلون؟"
​
قال غارلون:
— "سنذهب إلى رجال العصابة للانتقام منهم".
​
في اليوم التالي، واصل غارلون ومحمد طريقهما نحو مدينة كوراساوا لبيع النمر. وفي الطريق مواجها العدو اللدود لأي مسافر: الجوع.
​
طلب غارلون من محمد أن ينتظر لكي يصطاد غزالاً أو أرنباً برياً. توغل غارلون في الغابة، وبعد 20 دقيقة من البحث وجد أرنباً برياً. حبس أنفاسه وركز جيدا، ثم سحب سيفه ببطء وانقض عليه مسرعاً بدون صوت وقضى عليه قتلاً رحيماً.
​
عاد غارلون، واندهش محمد مما جلبه وقال:
— "كيف اصطدت هذا الأرنب؟ إنه أمر مذهل!"
​
أجابه غارلون ببرود:
— "ليس من شأنك أن تعرف، اجمع الحطب وأنت صامت".
​
قال محمد:
— "حاضر".
​
أثناء تجميع الحطب، قال محمد في نفسه إنه لن يجعل برود غارلون عائقاً، ولن يجعله شخصاً بارداً بل سيعامله بلطف دائماً. جمع الحطب وأشعل النار لشوي الأرنب وأكلا معا.
​
بعد ساعة، وصلوا إلى مدينة كوراساوا، وذهبوا إلى تاجر لجلود الحيوانات وباعوا له جلد النمر بثمن باهظ بلغ 100 ألف ين. ولكن أثناء سيرهما، كان غارلون ينضب غضباً من شيء ما.
​
لاحظ محمد غضب غارلون المكبوت، فقال له غارلون بصوت هادئ:
— "أتلاحظ من كان التاجر الذي بعنا له النمر؟"
​
قال محمد باستغراب:
— "لا، من يكون؟"
​
قال غارلون بصوت يتسرب منه الغضب:
— "إنه فرد من العصابة التي قتلت والدي وأنا مديون لها".
​
انصدم محمد وغضب وقال:
— "لماذا لم تقل لي؟!"
​
أجابه غارلون:
— "لأن قتلك لهم الآن لن يفيدك، وأيضاً لا أريدك أن تتدخل في انتقامي منهم".
​
هدأ محمد، وقررا التفكير في طريقة للقضاء عليه. فكر غارلون في خطة وقال:
— "سأراقبه في الليل وأنتظر الفرصة المناسبة للقضاء عليه. سيغضب قائد العصابة عندما يعلم بخبر موته وسيحاول القضاء عليّ، وحينها سننسحب وننسق سفرنا إلى الدولة التي يعيش فيها مدربي. سيكون الوقت المقدر لبحثهم عني تقريباً شهراً كاملاً، وهو ما يكفي لكي أستعد لهم. وأنت يا محمد ستتدرب معي، فقوتك ضعيفة. إن أردت أن تتطور فتعال معي، وإلا فلن تكون معي في رحلتي".
​
فكر محمد في خطة غارلون وقرر الموافقة، ثم سأله:
— "أين تقع دولة مدربك؟"
​
أجابه غارلون:
— "في مصر".
​
بالفعل، انطلقا نحو التاجر في الليل وراقبه غارلون. كان التاجر يُدعى "بوراينو"، وهو الفرد السابع من عصابة تُدعى "عصابة المونيراف"؛ أشهر عصابة في البلاد والمعروفة بأساليبها الخطيرة للغاية. ورغم أن عدد أعضائها قليل (15 فرداً فقط)، إلا أنهم من بين أقوى 100 سياف عرفهم التاريخ.
​
فهل سينتصر عليهم غارلون؟ هذا ما سنعرفه في الجزء القادم...`
};

let stories=[];
let likes={};
let favorites=[];
let authorFilter="";
let searchQuery="";

const $=id=>document.getElementById(id);

function getToken(){
    let token=localStorage.getItem(TOKEN_KEY);
    if(!token){
        token="usr_"+Math.random().toString(36).slice(2)+Date.now().toString(36);
        localStorage.setItem(TOKEN_KEY,token);
    }
    return token;
}

function showToast(message,type=""){
    const toast=document.createElement("div");
    toast.className="toast "+type;
    toast.textContent=message;
    $("toastWrap").appendChild(toast);
    setTimeout(()=>toast.remove(),2800);
}

function saveData(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify(stories));
        localStorage.setItem(LIKES_KEY,JSON.stringify(likes));
        localStorage.setItem(FAVS_KEY,JSON.stringify(favorites));
    }catch{
        showToast("تعذر حفظ البيانات","bad");
    }
    updateStats();
}

function loadData(){
    try{
        stories=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
        likes=JSON.parse(localStorage.getItem(LIKES_KEY)||"{}")||{};
        favorites=JSON.parse(localStorage.getItem(FAVS_KEY)||"[]")||[];

        if(!Array.isArray(stories))stories=[];
        if(!Array.isArray(favorites))favorites=[];

    }catch{
        stories=[];
        likes={};
        favorites=[];
    }

    if(!stories.some(s=>s.id===INITIAL_STORY.id)){
        stories.unshift(INITIAL_STORY);
    }

    saveData();
}

function readTime(text){
    const words=String(text).trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1,Math.ceil(words/150))+" دقائق قراءة";
}

function updateStats(){
    $("totalStories").textContent=stories.length;
    $("totalAuthors").textContent=new Set(stories.map(s=>s.author).filter(Boolean)).size;
    $("totalFavs").textContent=favorites.length;
    $("totalLikes").textContent=Object.values(likes).filter(Boolean).length;
}

function renderAuthors(){
    const q=$("authorSearch").value.trim().toLowerCase();
    const counts={};

    stories.forEach(s=>{
        counts[s.author]=(counts[s.author]||0)+1;
    });

    const names=Object.keys(counts)
        .filter(name=>name.toLowerCase().includes(q))
        .sort((a,b)=>a.localeCompare(b,"ar"));

    $("authors").innerHTML="";

    if(!names.length){
        $("authors").innerHTML=
            '<div class="muted" style="padding:8px">لا يوجد كاتب مطابق.</div>';
        return;
    }

    names.forEach(name=>{
        const item=document.createElement("div");
        item.className="author "+(authorFilter===name?"active":"");
        item.dataset.author=name;

        const n=document.createElement("span");
        n.textContent="👤 "+name;

        const c=document.createElement("b");
        c.textContent=counts[name];

        item.append(n,c);
        $("authors").appendChild(item);
    });
}

function updateBookmark(){
    const raw=localStorage.getItem(BOOKMARK_KEY);

    if(!raw){
        $("resume").classList.remove("show");
        return;
    }

    try{
        const bookmark=JSON.parse(raw);

        $("resume").classList.add("show");

        $("resumeText").textContent=
            "توقفت عند: "+
            bookmark.title+
            " — "+
            bookmark.part;

        $("resumeBtn").onclick=()=>{
            const element=document.getElementById(
                "story-"+bookmark.id
            );

            if(element){
                element.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });
            }else{
                showToast("لم يتم العثور على الفصل","bad");
            }
        };

    }catch{
        $("resume").classList.remove("show");
    }
}

function renderStories(){

    const container=$("storiesContainer");

    let list=stories.filter(story=>{
        const authorOK=
            !authorFilter||
            String(story.author).toLowerCase()===
            authorFilter.toLowerCase();

        const query=searchQuery.trim().toLowerCase();

        const searchOK=
            !query||
            [
                story.title,
                story.author,
                story.part,
                story.content
            ].some(value=>
                String(value||"")
                .toLowerCase()
                .includes(query)
            );

        return authorOK&&searchOK;
    });

    container.innerHTML="";

    if(!list.length){
        container.innerHTML=
            '<div class="box empty">لم يتم العثور على قصص مطابقة.</div>';

        updateStats();
        renderAuthors();
        return;
    }

    const groups={};

    list.forEach(story=>{
        if(!groups[story.title]){
            groups[story.title]=[];
        }
        groups[story.title].push(story);
    });

    Object.values(groups).forEach(bundle=>{

        const first=bundle[0];

        const bundleElement=document.createElement("section");
        bundleElement.className="bundle";

        const header=document.createElement("div");
        header.className="bundle-head";

        if(first.cover){

            const image=document.createElement("img");
            image.className="cover";
            image.src=first.cover;
            image.alt="غلاف القصة";

            image.onerror=()=>{
                image.remove();
            };

            header.appendChild(image);

        }else{

            const placeholder=document.createElement("div");
            placeholder.className="cover";
            placeholder.style.display="grid";
            placeholder.style.placeItems="center";
            placeholder.style.fontSize="2rem";
            placeholder.textContent="📖";

            header.appendChild(placeholder);
        }

        const info=document.createElement("div");

        const title=document.createElement("h2");
        title.textContent=first.title;

        const meta=document.createElement("div");
        meta.className="muted";
        meta.textContent=
            "👤 "+
            (first.author||"غير محدد")+
            " · "+
            bundle.length+
            " فصل";

        info.append(title,meta);
        header.appendChild(info);
        bundleElement.appendChild(header);

        bundle.forEach(story=>{
            bundleElement.appendChild(
                createStoryCard(story)
            );
        });

        container.appendChild(bundleElement);
    });

    updateStats();
    renderAuthors();
    updateBookmark();
}

function createStoryCard(story){

    const card=document.createElement("article");
    card.className="card";
    card.id="story-"+story.id;

    const head=document.createElement("div");
    head.className="card-head";

    const part=document.createElement("h3");
    part.textContent=story.part;

    head.appendChild(part);

    if(story.ownerToken===getToken()){

        const deleteButton=document.createElement("button");
        deleteButton.className="tool danger";
        deleteButton.textContent="حذف الفصل";
        deleteButton.dataset.action="delete";
        deleteButton.dataset.id=story.id;

        head.appendChild(deleteButton);
    }

    card.appendChild(head);

    const time=document.createElement("div");
    time.className="muted";
    time.textContent="⏱️ "+readTime(story.content);
    card.appendChild(time);

    const toolbar=document.createElement("div");
    toolbar.className="toolbar";

    toolbar.appendChild(
        toolButton("A+",()=>changeFont(story.id,2))
    );

    toolbar.appendChild(
        toolButton("A-",()=>changeFont(story.id,-2))
    );

    toolbar.appendChild(
        toolButton("👁️ وضع التركيز",toggleFocus)
    );

    toolbar.appendChild(
        toolButton("🔖 حفظ الموضع",()=>saveBookmark(story))
    );

    card.appendChild(toolbar);

    const text=document.createElement("div");
    text.className="story-text";
    text.id="text-"+story.id;
    text.textContent=story.content;

    card.appendChild(text);

    const actions=document.createElement("div");
    actions.className="actionsbar";

    const like=document.createElement("button");
    like.className="tool "+(likes[story.id]?"liked":"");
    like.textContent=likes[story.id]?"❤️ أعجبني":"🤍 إعجاب";
    like.onclick=()=>toggleLike(story.id);

    const favorite=document.createElement("button");
    const isFavorite=favorites.includes(story.id);

    favorite.className="tool "+(isFavorite?"faved":"");
    favorite.textContent=isFavorite?"⭐ مفضلة":"☆ حفظ";
    favorite.onclick=()=>toggleFavorite(story.id);

    const share=document.createElement("button");
    share.className="tool";
    share.textContent="🔗 مشاركة";
    share.onclick=()=>shareStory(story);

    actions.append(like,favorite,share);
    card.appendChild(actions);

    return card;
}

function toolButton(text,callback){
    const button=document.createElement("button");
    button.className="tool";
    button.type="button";
    button.textContent=text;
    button.onclick=callback;
    return button;
}

function changeFont(id,delta){
    const element=$("text-"+id);
    if(!element)return;

    const current=parseFloat(
        getComputedStyle(element).fontSize
    );

    const next=Math.max(
        14,
        Math.min(
            32,
            current+delta
        )
    );

    element.style.fontSize=next+"px";
}

function toggleFocus(){
    document.body.classList.toggle("focus");
}

function toggleLike(id){
    likes[id]=!likes[id];
    saveData();
    renderStories();
}

function toggleFavorite(id){

    const index=favorites.indexOf(id);

    if(index>=0){
        favorites.splice(index,1);
        showToast("تمت إزالة الفصل من المفضلة");
    }else{
        favorites.push(id);
        showToast("تم حفظ الفصل في المفضلة","ok");
    }

    saveData();
    renderStories();
}

function saveBookmark(story){

    localStorage.setItem(
        BOOKMARK_KEY,
        JSON.stringify({
            id:story.id,
            title:story.title,
            part:story.part
        })
    );

    updateBookmark();
    showToast("تم حفظ موضع القراءة","ok");
}

async function shareStory(story){

    const url=
        location.href.split("#")[0]+
        "#story-"+encodeURIComponent(story.id);

    const data={
        title:story.title+" — "+story.part,
        text:story.title+" — "+story.part,
        url
    };

    try{

        if(navigator.share){

            await navigator.share(data);

        }else{

            await navigator.clipboard.writeText(url);

            showToast("تم نسخ رابط القصة","ok");
        }

    }catch(error){

        if(error.name!=="AbortError"){
            showToast("تعذر مشاركة القصة","bad");
        }
    }
}

function deleteStory(id){

    const story=stories.find(item=>item.id===id);

    if(!story)return;

    if(story.ownerToken!==getToken()){
        showToast("لا يمكنك حذف هذا الفصل","bad");
        return;
    }

    if(!confirm("هل تريد حذف هذا الفصل؟"))return;

    stories=stories.filter(
        item=>item.id!==id
    );

    delete likes[id];

    favorites=favorites.filter(
        item=>item!==id
    );

    saveData();
    renderStories();

    showToast("تم حذف الفصل","ok");
}

function publishStory(event){

    event.preventDefault();

    const story={
        id:
            "story_"+
            Date.now()+
            "_"+
            Math.random().toString(36).slice(2),

        title:$("storyTitle").value.trim(),
        author:$("authorName").value.trim(),
        part:$("storyPart").value.trim(),
        cover:$("coverUrl").value.trim(),
        content:$("storyContent").value.trim(),

        ownerToken:getToken(),
        createdAt:Date.now()
    };

    if(
        !story.title||
        !story.author||
        !story.part||
        !story.content
    ){
        showToast("يرجى تعبئة الحقول المطلوبة","bad");
        return;
    }

    stories.unshift(story);

    saveData();

    event.target.reset();

    renderStories();

    showToast("تم نشر الفصل بنجاح","ok");
}

function exportData(){

    const data={
        version:1,
        exportedAt:new Date().toISOString(),
        stories,
        likes,
        favorites
    };

    const blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");

    link.href=url;
    link.download=
        "hikaya_backup_"+
        Date.now()+
        ".json";

    link.click();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

    showToast("تم تصدير النسخة الاحتياطية","ok");
}

function importData(file){

    if(!file)return;

    const reader=new FileReader();

    reader.onload=event=>{

        try{

            const data=
                JSON.parse(event.target.result);

            const importedStories=
                Array.isArray(data)
                    ?data
                    :data.stories;

            if(!Array.isArray(importedStories)){
                throw new Error();
            }

            stories=importedStories;
            likes=
                Array.isArray(data)
                    ?{}
                    :(data.likes||{});

            favorites=
                Array.isArray(data)
                    ?[]
                    :(data.favorites||[]);

            saveData();
            renderStories();

            $("backupModal").classList.remove("open");

            showToast("تمت استعادة البيانات بنجاح","ok");

        }catch{

            showToast(
                "ملف JSON غير صالح",
                "bad"
            );
        }
    };

    reader.readAsText(file,"utf-8");
}

function setupTheme(){

    const theme=
        localStorage.getItem(THEME_KEY)||"dark";

    document.documentElement.dataset.theme=theme;

    updateThemeButton(theme);
}

function updateThemeButton(theme){

    $("themeBtn").textContent=
        theme==="light"
            ?"🌙 الوضع الداكن"
            :"☀️ الوضع الفاتح";
}

function toggleTheme(){

    const current=
        document.documentElement.dataset.theme;

    const next=
        current==="light"
            ?"dark"
            :"light";

    document.documentElement.dataset.theme=next;

    localStorage.setItem(
        THEME_KEY,
        next
    );

    updateThemeButton(next);
}

function resetFilters(){

    authorFilter="";
    searchQuery="";

    $("searchInput").value="";
    $("authorSearch").value="";

    renderStories();
}

function updateProgress(){

    const max=
        document.documentElement.scrollHeight-
        window.innerHeight;

    const percent=
        max>0
            ?(window.scrollY/max)*100
            :0;

    $("progress").style.width=
        percent+"%";
}

function init(){

    getToken();
    loadData();
    setupTheme();

    $("themeBtn").onclick=toggleTheme;

    $("publishBtn").onclick=()=>{
        $("publishBox").scrollIntoView({
            behavior:"smooth"
        });
    };

    $("storyForm").onsubmit=publishStory;

    $("searchInput").oninput=event=>{
        searchQuery=event.target.value;
        renderStories();
    };

    $("authorSearch").oninput=()=>{
        renderAuthors();
    };

    $("authors").onclick=event=>{

        const item=
            event.target.closest("[data-author]");

        if(!item)return;

        authorFilter=
            item.dataset.author;

        renderStories();
    };

    $("resetBtn").onclick=
        resetFilters;

    $("backupBtn").onclick=()=>{
        $("backupModal").classList.add("open");
    };

    $("closeBackup").onclick=()=>{
        $("backupModal").classList.remove("open");
    };

    $("exportBtn").onclick=
        exportData;

    $("importBtn").onclick=()=>{
        $("importFile").click();
    };

    $("importFile").onchange=
        event=>{
            importData(event.target.files[0]);
            event.target.value="";
        };

    $("backupModal").onclick=event=>{
        if(event.target.id==="backupModal"){
            $("backupModal").classList.remove("open");
        }
    };

    document.addEventListener(
        "keydown",
        event=>{
            if(event.key==="Escape"){
                $("backupModal").classList.remove("open");
                document.body.classList.remove("focus");
            }
        }
    );

    renderStories();
    updateProgress();
}

window.addEventListener(
    "scroll",
    updateProgress,
    {passive:true}
);

document.addEventListener(
    "DOMContentLoaded",
    init
);

</script>
