<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="منصة حكاية - قراءة ونشر القصص">
    <title>حكاية - قراءة ونشر القصص</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-bg-2: #172033;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --accent-2: #8b5cf6;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.20);
            --radius: 14px;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --panel-bg-2: #f8fafc;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --accent-2: #7c3aed;
            --border-color: #cbd5e1;
            --danger-color: #dc2626;
            --success-color: #059669;
            --warning-color: #d97706;
            --shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.10), transparent 32%),
                var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            line-height: 1.8;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        #readingProgressBar {
            position: fixed;
            top: 0;
            right: 0;
            width: 0%;
            height: 4px;
            z-index: 9999;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-2));
            transition: width 0.1s linear;
        }

        /* =========================
           Header
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: color-mix(in srgb, var(--panel-bg) 92%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-inner {
            max-width: 1450px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 900;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-2));
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.22);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* =========================
           Buttons
        ========================= */

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-2));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-hover), var(--accent-2));
        }

        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: var(--panel-bg-2);
        }

        /* =========================
           Layout
        ========================= */

        .main-layout {
            width: min(1450px, calc(100% - 32px));
            margin: 25px auto 50px;
            display: grid;
            grid-template-columns: 310px minmax(0, 1fr);
            gap: 22px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 82px;
            align-self: start;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .panel-box {
            background: linear-gradient(180deg, var(--panel-bg), var(--panel-bg-2));
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-size: 1.03rem;
            margin-bottom: 14px;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--border-color);
        }

        /* =========================
           Hero
        ========================= */

        .hero {
            padding: 22px;
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background:
                linear-gradient(135deg, rgba(99, 102, 241, 0.15), transparent 58%),
                var(--panel-bg);
            box-shadow: var(--shadow);
        }

        .hero h1 {
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            margin-bottom: 4px;
        }

        .hero p {
            color: var(--text-muted);
        }

        /* =========================
           Form
        ========================= */

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.86rem;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 11px 12px;
            color: var(--text-color);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.14);
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        /* =========================
           Stats
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-number {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 900;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.77rem;
        }

        /* =========================
           Author list
        ========================= */

        .author-results {
            margin-top: 8px;
        }

        .author-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .author-item:hover {
            background: var(--bg-color);
        }

        .author-empty {
            color: var(--text-muted);
            font-size: 0.82rem;
            padding: 8px;
            text-align: center;
        }

        /* =========================
           Resume
        ========================= */

        #resumeReadingBox {
            display: none;
        }

        #resumeReadingBox.active {
            display: block;
        }

        #resumeStoryText {
            color: var(--text-muted);
            font-size: 0.84rem;
            margin-bottom: 10px;
        }

        /* =========================
           Story Bundle
        ========================= */

        .story-bundle-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .bundle-header {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 16px;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .bundle-cover {
            width: 90px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-2));
        }

        .fallback-cover {
            width: 90px;
            height: 120px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-2));
        }

        .bundle-title {
            font-size: clamp(1.3rem, 2.5vw, 1.75rem);
            line-height: 1.4;
            margin-bottom: 7px;
        }

        .bundle-meta {
            color: var(--text-muted);
            font-size: 0.87rem;
        }

        /* =========================
           Story Card
        ========================= */

        .story-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-top: 16px;
        }

        .story-card h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .story-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 0.78rem;
        }

        .reading-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 14px;
        }

        .tool-btn {
            color: var(--text-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .tool-btn:hover {
            border-color: var(--accent-color);
        }

        .story-text {
            font-size: 1.06rem;
            line-height: 2;
            white-space: pre-line;
            overflow-wrap: anywhere;
            margin-bottom: 16px;
        }

        .story-text::first-letter {
            font-weight: 900;
            font-size: 1.3em;
        }

        .actions-bar {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .interaction-group {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .action-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
        }

        .action-btn:hover {
            border-color: var(--accent-color);
        }

        .action-btn.liked {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .action-btn.faved {
            color: var(--warning-color);
            border-color: var(--warning-color);
        }

        .btn-delete-card {
            background: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* =========================
           Focus Mode
        ========================= */

        body.focus-mode header,
        body.focus-mode .sidebar,
        body.focus-mode .reading-toolbar,
        body.focus-mode .actions-bar,
        body.focus-mode .hero {
            display: none !important;
        }

        body.focus-mode .main-layout {
            grid-template-columns: 1fr;
            max-width: 900px;
        }

        body.focus-mode .story-text {
            font-size: 1.2rem;
            line-height: 2.15;
        }

        /* =========================
           Empty
        ========================= */

        .empty-state {
            padding: 55px 20px;
            text-align: center;
            color: var(--text-muted);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
        }

        .empty-icon {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        /* =========================
           Toast
        ========================= */

        .toast-container {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 5000;
            width: min(360px, calc(100% - 36px));
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .toast {
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--accent-color);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            animation: toastIn 0.25s ease;
        }

        .toast.success {
            border-right-color: var(--success-color);
        }

        .toast.danger {
            border-right-color: var(--danger-color);
        }

        .toast.warning {
            border-right-color: var(--warning-color);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           Modal
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: min(520px, 100%);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: grid;
            gap: 9px;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 980px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                max-height: none;
                overflow: visible;
            }
        }

        @media (max-width: 600px) {
            .main-layout {
                width: calc(100% - 16px);
                margin-top: 12px;
            }

            .header-inner {
                padding: 11px 10px;
                align-items: flex-start;
            }

            .header-actions .btn {
                padding: 8px 9px;
                font-size: 0.76rem;
            }

            .logo-text {
                display: none;
            }

            .bundle-header {
                grid-template-columns: 70px 1fr;
            }

            .bundle-cover,
            .fallback-cover {
                width: 70px;
                height: 95px;
            }

            .story-bundle-box,
            .story-card,
            .panel-box,
            .hero {
                padding: 13px;
            }

            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

    <div id="readingProgressBar"></div>

    <!-- =========================
         Header
    ========================== -->

    <header>
        <div class="header-inner">

            <div class="logo">
                <div class="logo-icon">📖</div>
                <span class="logo-text">حكاية</span>
            </div>

            <div class="header-actions">
                <button class="btn btn-outline" id="themeToggleBtn">
                    ☀️ الوضع الفاتح
                </button>

                <button class="btn btn-outline" id="backupBtn">
                    💾 النسخ الاحتياطي
                </button>

                <button class="btn btn-primary" id="publishScrollBtn">
                    ✍️ نشر قصة
                </button>
            </div>

        </div>
    </header>

    <!-- =========================
         Main Layout
    ========================== -->

    <div class="main-layout">

        <!-- =========================
             Sidebar
        ========================== -->

        <aside class="sidebar">

            <!-- Resume -->
            <div class="panel-box" id="resumeReadingBox">

                <h3 class="panel-title">
                    📍 متابعة القراءة
                </h3>

                <p id="resumeStoryText"></p>

                <button
                    class="btn btn-outline"
                    style="width:100%;"
                    id="resumeStoryBtn">
                    الانتقال للنقطة الحالية
                </button>

            </div>

            <!-- Stats -->
            <div class="panel-box">

                <h3 class="panel-title">
                    📊 الإحصائيات
                </h3>

                <div class="stats-grid">

                    <div class="stat-card">
                        <div class="stat-number" id="statTotalStories">0</div>
                        <div class="stat-label">الفصول</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-number" id="statTotalAuthors">0</div>
                        <div class="stat-label">المؤلفون</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-number" id="statTotalFavorites">0</div>
                        <div class="stat-label">المفضلة</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-number" id="statTotalLikes">0</div>
                        <div class="stat-label">الإعجابات</div>
                    </div>

                </div>
            </div>

            <!-- Search -->
            <div class="panel-box">

                <h3 class="panel-title">
                    🔍 البحث والتصفية
                </h3>

                <div class="form-group">
                    <label for="globalSearchInput">
                        بحث في القصص
                    </label>

                    <input
                        type="search"
                        id="globalSearchInput"
                        class="form-control"
                        placeholder="العنوان، الكاتب، الفصل، المحتوى..."
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="folderSearchInput">
                        البحث حسب الكاتب
                    </label>

                    <input
                        type="search"
                        id="folderSearchInput"
                        class="form-control"
                        placeholder="اكتب اسم الكاتب..."
                        autocomplete="off">
                </div>

                <div
                    id="authorFolderList"
                    class="author-results">
                </div>

                <button
                    class="btn btn-outline"
                    style="width:100%; margin-top:10px;"
                    id="resetFiltersBtn">
                    إعادة ضبط البحث
                </button>

            </div>

            <!-- Publish -->
            <div class="panel-box" id="publishPanel">

                <h3 class="panel-title">
                    ✍️ نشر فصل جديد
                </h3>

                <form id="storyForm">

                    <div class="form-group">
                        <label for="storyTitle">
                            عنوان القصة الرئيسي
                        </label>

                        <input
                            type="text"
                            id="storyTitle"
                            class="form-control"
                            required
                            placeholder="عنوان القصة">
                    </div>

                    <div class="form-group">
                        <label for="authorName">
                            اسم الكاتب
                        </label>

                        <input
                            type="text"
                            id="authorName"
                            class="form-control"
                            required
                            placeholder="اسم المؤلف">
                    </div>

                    <div class="form-group">
                        <label for="storyPartNumber">
                            رقم أو اسم الفصل
                        </label>

                        <input
                            type="text"
                            id="storyPartNumber"
                            class="form-control"
                            required
                            placeholder="الفصل الأول">
                    </div>

                    <div class="form-group">
                        <label for="coverUrl">
                            رابط صورة الغلاف - اختياري
                        </label>

                        <input
                            type="url"
                            id="coverUrl"
                            class="form-control"
                            placeholder="https://example.com/cover.jpg">
                    </div>

                    <div class="form-group">
                        <label for="storyContent">
                            محتوى الفصل
                        </label>

                        <textarea
                            id="storyContent"
                            class="form-control"
                            required
                            placeholder="اكتب نص الفصل هنا..."></textarea>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        style="width:100%;">
                        نشر الفصل
                    </button>

                </form>
            </div>

        </aside>

        <!-- =========================
             Main Content
        ========================== -->

        <main>

            <section class="hero">

                <h1>
                    📚 منصة حكاية
                </h1>

                <p>
                    اقرأ القصص، تابع الفصول، احفظ موضع القراءة، وانشر قصصك في مكان واحد.
                </p>

            </section>

            <div id="storiesContainer"></div>

        </main>

    </div>

    <!-- Toast -->
    <div
        class="toast-container"
        id="toastContainer">
    </div>

    <!-- =========================
         Backup Modal
    ========================== -->

    <div
        class="modal"
        id="backupModal">

        <div class="modal-content">

            <h3 class="panel-title">
                💾 إدارة النسخ الاحتياطي
            </h3>

            <p>
                يمكنك تصدير جميع القصص أو استعادتها من ملف JSON.
            </p>

            <div class="modal-buttons">

                <button
                    class="btn btn-primary"
                    id="exportDataBtn">
                    📤 تصدير البيانات
                </button>

                <button
                    class="btn btn-outline"
                    id="importDataBtn">
                    📥 استعادة البيانات
                </button>

                <input
                    type="file"
                    id="importFileInput"
                    accept=".json,application/json"
                    style="display:none;">

                <button
                    class="btn btn-outline"
                    id="closeBackupBtn">
                    إغلاق
                </button>

            </div>

        </div>
    </div>

    <!-- =========================================================
         JavaScript
    ========================================================== -->

    <script>
        "use strict";

        /* =========================================================
           Storage Keys
        ========================================================== */

        const STORAGE_KEY = "hikaya_stories_single_file_v1";
        const LIKES_KEY = "hikaya_likes_single_file_v1";
        const FAVORITES_KEY = "hikaya_favorites_single_file_v1";
        const BOOKMARK_KEY = "hikaya_bookmark_single_file_v1";
        const USER_TOKEN_KEY = "hikaya_user_token_single_file_v1";
        const THEME_KEY = "hikaya_theme_single_file_v1";

        /* =========================================================
           Variables
        ========================================================== */

        let stories = [];
        let likes = {};
        let favorites = [];

        let selectedAuthor = "";
        let searchQuery = "";

        /* =========================================================
           القصة المطلوبة
        ========================================================== */

        const initialStory = {

        /* =========================================================
           User Token
        ========================================================== */

        function getCurrentUserToken() {
            let token = localStorage.getItem(USER_TOKEN_KEY);

            if (!token) {
                token =
                    "usr_" +
                    Math.random().toString(36).slice(2) +
                    Date.now().toString(36);

                localStorage.setItem(USER_TOKEN_KEY, token);
            }

            return token;
        }

        /* =========================================================
           Storage
        ========================================================== */

        function loadData() {
            try {
                const storedStories =
                    localStorage.getItem(STORAGE_KEY);

                if (storedStories) {
                    const parsed = JSON.parse(storedStories);
                    stories = Array.isArray(parsed) ? parsed : [];
                } else {
                    stories = [];
                }

                likes =
                    JSON.parse(
                        localStorage.getItem(LIKES_KEY) || "{}"
                    ) || {};

                favorites =
                    JSON.parse(
                        localStorage.getItem(FAVORITES_KEY) || "[]"
                    ) || [];

                /*
                 * إضافة القصة المطلوبة تلقائياً إن لم تكن موجودة.
                 * لا يتم حذف أي قصص موجودة بالفعل.
                 */
                const exists = stories.some(
                    story => story.id === initialStory.id
                );

                if (!exists) {
                    stories.unshift(initialStory);
                }

                saveData(false);

            } catch (error) {
                console.error(error);

                stories = [initialStory];
                likes = {};
                favorites = [];

                saveData(false);
            }
        }

        function saveData(showErrorToast = true) {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(stories)
                );

                localStorage.setItem(
                    LIKES_KEY,
                    JSON.stringify(likes)
                );

                localStorage.setItem(
                    FAVORITES_KEY,
                    JSON.stringify(favorites)
                );
            } catch (error) {
                console.error(error);

                if (showErrorToast) {
                    showToast(
                        "تعذر حفظ البيانات في المتصفح.",
                        "danger"
                    );
                }
            }

            updateStats();
        }

        /* =========================================================
           Helpers
        ========================================================== */

        function calculateReadTime(text) {
            const words =
                String(text || "")
                    .trim()
                    .split(/\s+/)
                    .filter(Boolean)
                    .length;

            return Math.max(1, Math.ceil(words / 150));
        }

        function groupStoriesByTitle(storyList) {
            return storyList.reduce((groups, story) => {

                const title =
                    story.title || "بدون عنوان";

                if (!groups[title]) {
                    groups[title] = [];
                }

                groups[title].push(story);

                return groups;

            }, {});
        }

        function showToast(message, type = "") {

            const container =
                document.getElementById("toastContainer");

            const toast =
                document.createElement("div");

            toast.className =
                "toast" + (type ? " " + type : "");

            toast.textContent = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3200);
        }

        /* =========================================================
           Render Stories
        ========================================================== */

        function renderStories() {

            const container =
                document.getElementById("storiesContainer");

            container.innerHTML = "";

            const query =
                searchQuery
                    .trim()
                    .toLowerCase();

            const author =
                selectedAuthor
                    .trim()
                    .toLowerCase();

            let filtered =
                stories.filter(story => {

                    const storyAuthor =
                        String(story.author || "")
                            .toLowerCase();

                    const matchesAuthor =
                        !author ||
                        storyAuthor === author;

                    const searchable =
                        [
                            story.title,
                            story.author,
                            story.part,
                            story.content
                        ]
                            .map(
                                value =>
                                    String(value || "")
                                        .toLowerCase()
                            )
                            .join(" ");

                    const matchesSearch =
                        !query ||
                        searchable.includes(query);

                    return (
                        matchesAuthor &&
                        matchesSearch
                    );
                });

            if (!filtered.length) {

                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        لم يتم العثور على أي قصص مطابقة.
                    </div>
                `;

                return;
            }

            const grouped =
                groupStoriesByTitle(filtered);

            const currentToken =
                getCurrentUserToken();

            Object.values(grouped).forEach(bundle => {

                bundle.sort(
                    (a, b) =>
                        Number(a.createdAt || 0) -
                        Number(b.createdAt || 0)
                );

                const first = bundle[0];

                const bundleBox =
                    document.createElement("section");

                bundleBox.className =
                    "story-bundle-box";

                /* ---------- Header ---------- */

                const bundleHeader =
                    document.createElement("div");

                bundleHeader.className =
                    "bundle-header";

                if (first.cover) {

                    const img =
                        document.createElement("img");

                    img.className =
                        "bundle-cover";

                    img.alt = "غلاف القصة";

                    img.src = first.cover;

                    img.onerror = () => {

                        img.remove();

                        const fallback =
                            createFallbackCover();

                        bundleHeader.prepend(
                            fallback
                        );
                    };

                    bundleHeader.appendChild(img);

                } else {

                    bundleHeader.appendChild(
                        createFallbackCover()
                    );
                }

                const info =
                    document.createElement("div");

                const title =
                    document.createElement("h2");

                title.className =
                    "bundle-title";

                title.textContent =
                    first.title;

                const meta =
                    document.createElement("div");

                meta.className =
                    "bundle-meta";

                meta.textContent =
                    "👤 الكاتب: " +
                    (first.author || "غير محدد") +
                    " • 📚 " +
                    bundle.length +
                    " فصل";

                info.appendChild(title);
                info.appendChild(meta);

                bundleHeader.appendChild(info);

                bundleBox.appendChild(
                    bundleHeader
                );

                /* ---------- Chapters ---------- */

                bundle.forEach(story => {

                    const card =
                        createStoryCard(
                            story,
                            currentToken
                        );

                    bundleBox.appendChild(card);
                });

                container.appendChild(
                    bundleBox
                );
            });
        }

        function createFallbackCover() {

            const cover =
                document.createElement("div");

            cover.className =
                "fallback-cover";

            cover.textContent = "📖";

            return cover;
        }

        /* =========================================================
           Story Card
        ========================================================== */

        function createStoryCard(
            story,
            currentToken
        ) {

            const card =
                document.createElement("article");

            card.className =
                "story-card";

            card.id =
                "story-card-" + story.id;

            /* ---------- Head ---------- */

            const head =
                document.createElement("h3");

            const part =
                document.createElement("span");

            part.textContent =
                story.part || "الفصل";

            head.appendChild(part);

            if (
                story.ownerToken ===
                currentToken
            ) {

                const deleteBtn =
                    document.createElement("button");

                deleteBtn.className =
                    "btn-delete-card";

                deleteBtn.type = "button";

                deleteBtn.textContent =
                    "حذف الفصل";

                deleteBtn.addEventListener(
                    "click",
                    () => deleteStory(story.id)
                );

                head.appendChild(
                    deleteBtn
                );
            }

            card.appendChild(head);

            /* ---------- Meta ---------- */

            const meta =
                document.createElement("div");

            meta.className =
                "story-meta";

            const timeBadge =
                document.createElement("span");

            timeBadge.className =
                "badge";

            timeBadge.textContent =
                "⏱️ " +
                calculateReadTime(
                    story.content
                ) +
                " دقائق قراءة";

            meta.appendChild(
                timeBadge
            );

            const authorBadge =
                document.createElement("span");

            authorBadge.className =
                "badge";

            authorBadge.textContent =
                "👤 " +
                (story.author || "غير محدد");

            meta.appendChild(
                authorBadge
            );

            card.appendChild(meta);

            /* ---------- Toolbar ---------- */

            const toolbar =
                document.createElement("div");

            toolbar.className =
                "reading-toolbar";

            toolbar.appendChild(
                createToolButton(
                    "A+",
                    () =>
                        changeFontSize(
                            story.id,
                            2
                        )
                )
            );

            toolbar.appendChild(
                createToolButton(
                    "A-",
                    () =>
                        changeFontSize(
                            story.id,
                            -2
                        )
                )
            );

            toolbar.appendChild(
                createToolButton(
                    "👁️ وضع التركيز",
                    toggleFocusMode
                )
            );

            toolbar.appendChild(
                createToolButton(
                    "🔖 حفظ نقطة التوقف",
                    () =>
                        saveBookmark(
                            story.id,
                            story.title,
                            story.part
                        )
                )
            );

            card.appendChild(
                toolbar
            );

            /* ---------- Text ---------- */

            const text =
                document.createElement("div");

            text.className =
                "story-text";

            text.id =
                "text-" + story.id;

            /*
             * textContent يحافظ على النص كنص عادي
             * ويمنع تحويل محتوى القصة إلى HTML.
             */
            text.textContent =
                story.content;

            card.appendChild(text);

            /* ---------- Actions ---------- */

            const actions =
                document.createElement("div");

            actions.className =
                "actions-bar";

            const interactionGroup =
                document.createElement("div");

            interactionGroup.className =
                "interaction-group";

            const liked =
                Boolean(
                    likes[story.id]
                );

            const faved =
                favorites.includes(
                    story.id
                );

            const likeBtn =
                document.createElement("button");

            likeBtn.type = "button";

            likeBtn.className =
                "action-btn" +
                (liked ? " liked" : "");

            likeBtn.textContent =
                liked
                    ? "❤️ أعجبني"
                    : "🤍 إعجاب";

            likeBtn.addEventListener(
                "click",
                () =>
                    toggleLike(
                        story.id
                    )
            );

            const favBtn =
                document.createElement("button");

            favBtn.type = "button";

            favBtn.className =
                "action-btn" +
                (faved ? " faved" : "");

            favBtn.textContent =
                faved
                    ? "⭐ محفوظة"
                    : "☆ حفظ";

            favBtn.addEventListener(
                "click",
                () =>
                    toggleFavorite(
                        story.id
                    )
            );

            interactionGroup.appendChild(
                likeBtn
            );

            interactionGroup.appendChild(
                favBtn
            );

            const shareBtn =
                document.createElement("button");

            shareBtn.type = "button";

            shareBtn.className =
                "action-btn";

            shareBtn.textContent =
                "🔗 مشاركة";

            shareBtn.addEventListener(
                "click",
                () =>
                    shareStory(story)
            );

            actions.appendChild(
                interactionGroup
            );

            actions.appendChild(
                shareBtn
            );

            card.appendChild(actions);

            return card;
        }

        function createToolButton(
            text,
            callback
        ) {

            const btn =
                document.createElement("button");

            btn.type = "button";

            btn.className =
                "tool-btn";

            btn.textContent =
                text;

            btn.addEventListener(
                "click",
                callback
            );

            return btn;
        }

        /* =========================================================
           Publish
        ========================================================== */

        function handlePublish(event) {

                document
                    .getElementById("storyTitle")
                    .value
                    .trim();

                document
                    .getElementById("authorName")
                    .value

                document
                    .getElementById("storyPartNumber")
                    .value
                    .trim();

                document
                    .getElementById("coverUrl")
                    .value
                    .trim();

                document
                    .getElementById("storyContent")
                    .value
                    .trim();

            if (
                !title ||
                !author ||
                !part ||
                !content
            ) {

                showToast(
                    "يرجى تعبئة جميع الحقول المطلوبة.",
                    "danger"
                );

                return;
            }

            const newStory = {

                id:
                    "story_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2, 8),

                title,
                author,
                part,
                cover,
                content,

                ownerToken:
                    getCurrentUserToken(),

                createdAt:
                    Date.now()
            };

            stories.push(
                newStory
            );

            saveData();

            document
                .getElementById("storyForm")
                .reset();

            renderAll();

            showToast(
                "تم نشر الفصل بنجاح! ✅",
                "success"
            );
        }

        /* =========================================================
           Delete
        ========================================================== */

        function deleteStory(id) {

            const story =
                stories.find(
                    item =>
                        item.id === id
                );

            if (!story) {
                return;
            }

            if (
                story.ownerToken !==
                getCurrentUserToken()
            ) {

                showToast(
                    "لا يمكنك حذف هذا الفصل.",
                    "danger"
                );

                return;
            }

            const confirmed =
                confirm(
                    "هل أنت متأكد من حذف هذا الفصل؟"
                );

            if (!confirmed) {
                return;
            }

            stories =
                stories.filter(
                    item =>
                        item.id !== id
                );

            delete likes[id];

            favorites =
                favorites.filter(
                    item =>
                        item !== id
                );

            saveData();
            renderAll();

            showToast(
                "تم حذف الفصل.",
                "danger"
            );
        }

        /* =========================================================
           Like
        ========================================================== */

        function toggleLike(id) {

            likes[id] =
                !likes[id];

            saveData();
            renderAll();
        }

        /* =========================================================
           Favorites
        ========================================================== */

        function toggleFavorite(id) {

            const index =
                favorites.indexOf(id);

            if (index !== -1) {

                favorites.splice(
                    index,
                    1
                );

                showToast(
                    "تمت إزالة الفصل من المفضلة."
                );

            } else {

                favorites.push(id);

                showToast(
                    "تم حفظ الفصل في المفضلة ⭐",
                    "success"
                );
            }

            saveData();
            renderAll();
        }

        /* =========================================================
           Share
        ========================================================== */

        async function shareStory(
            story
        ) {

            const url =
                window.location.href
                    .split("#")[0] +
                "#" +
                story.id;

            try {

                if (
                    navigator.share
                ) {

                    await navigator.share({
                        title:
                            story.title +
                            " - " +
                            story.part,

                        text:
                            "قراءة قصة " +
                            story.title +
                            " - " +
                            story.part,

                        url
                    });

                    return;
                }

                if (
                    navigator.clipboard
                ) {

                    await navigator.clipboard.writeText(
                        url
                    );

                    showToast(
                        "تم نسخ رابط القصة! 🔗",
                        "success"
                    );

                    return;
                }

                prompt(
                    "انسخ الرابط:",
                    url
                );

            } catch (error) {

                if (
                    error &&
                    error.name ===
                        "AbortError"
                ) {

                    return;
                }

                showToast(
                    "تعذر مشاركة القصة.",
                    "warning"
                );
            }
        }

        /* =========================================================
           Font Size
        ========================================================== */

        function changeFontSize(
            storyId,
            delta
        ) {

            const element =
                document.getElementById(
                    "text-" + storyId
                );

            if (!element) {
                return;
            }

            const current =
                parseFloat(
                    getComputedStyle(
                        element
                    ).fontSize
                ) || 16;

            const next =
                Math.max(
                    14,
                    Math.min(
                        32,
                        current + delta
                    )
                );

            element.style.fontSize =
                next + "px";
        }

        /* =========================================================
           Focus Mode
        ========================================================== */

        function toggleFocusMode() {

            document.body.classList.toggle(
                "focus-mode"
            );
        }

        /* =========================================================
           Bookmark
        ========================================================== */

        function saveBookmark(
            id,
            title,
            part
        ) {

            const bookmark = {
                id,
                title,
                part,
                savedAt: Date.now()
            };

            localStorage.setItem(
                BOOKMARK_KEY,
                JSON.stringify(
                    bookmark
                )
            );

            updateResumeReading();

            showToast(
                "تم حفظ موضع القراءة 🔖",
                "success"
            );
        }

        function updateResumeReading() {

            const box =
                document.getElementById(
                    "resumeReadingBox"
                );

            const text =
                document.getElementById(
                    "resumeStoryText"
                );

            const btn =
                document.getElementById(
                    "resumeStoryBtn"
                );

            const raw =
                localStorage.getItem(
                    BOOKMARK_KEY
                );

            if (!raw) {

                box.classList.remove(
                    "active"
                );

                return;
            }

            let data;

            try {
                data =
                    JSON.parse(raw);
            } catch {

                box.classList.remove(
                    "active"
                );

                return;
            }

            if (!data || !data.id) {

                box.classList.remove(
                    "active"
                );

                return;
            }

            text.textContent =
                "توقفت عند: " +
                (data.title || "قصة") +
                " (" +
                (data.part || "فصل") +
                ")";

            box.classList.add(
                "active"
            );

            btn.onclick = () => {

                const target =
                    document.getElementById(
                        "story-card-" +
                        data.id
                    );

                if (!target) {

                    showToast(
                        "لم يتم العثور على الفصل المحفوظ.",
                        "danger"
                    );

                    return;
                }

                target.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            };
        }

        /* =========================================================
           Author Search
        ========================================================== */

        function renderAuthorFolder(
            query = ""
        ) {

            const container =
                document.getElementById(
                    "authorFolderList"
                );

            container.innerHTML = "";

            query =
                query
                    .trim()
                    .toLowerCase();

            if (!query) {
                return;
            }

            const authors =
                [
                    ...new Set(
                        stories
                            .map(
                                story =>
                                    String(
                                        story.author || ""
                                    ).trim()
                            )
                            .filter(Boolean)
                    )
                ].filter(
                    author =>
                        author
                            .toLowerCase()
                            .includes(query)
                );

            if (!authors.length) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "author-empty";

                empty.textContent =
                    "لم يتم العثور على الكاتب.";

                container.appendChild(
                    empty
                );

                return;
            }

            authors.forEach(
                author => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "author-item";

                    const name =
                        document.createElement(
                            "span"
                        );

                    name.textContent =
                        "👤 " + author;

                    const count =
                        document.createElement(
                            "strong"
                        );

                    count.textContent =
                        stories.filter(
                            story =>
                                story.author ===
                                author
                        ).length +
                        " فصل";

                    item.appendChild(
                        name
                    );

                    item.appendChild(
                        count
                    );

                    item.addEventListener(
                        "click",
                        () => {

                            selectedAuthor =
                                author;

                            renderAll();

                            showToast(
                                "تم عرض أعمال " +
                                author
                            );
                        }
                    );

                    container.appendChild(
                        item
                    );
                }
            );
        }

        /* =========================================================
           Stats
        ========================================================== */

        function updateStats() {

            document.getElementById(
                "statTotalStories"
            ).textContent =
                stories.length;

            document.getElementById(
                "statTotalAuthors"
            ).textContent =
                new Set(
                    stories
                        .map(
                            story =>
                                story.author
                        )
                        .filter(Boolean)
                ).size;

            document.getElementById(
                "statTotalFavorites"
            ).textContent =
                favorites.length;

            document.getElementById(
                "statTotalLikes"
            ).textContent =
                Object.values(
                    likes
                ).filter(Boolean).length;
        }

        /* =========================================================
           Reset Filters
        ========================================================== */

        function resetFilters() {

            searchQuery = "";
            selectedAuthor = "";

            document.getElementById(
                "globalSearchInput"
            ).value = "";

            document.getElementById(
                "folderSearchInput"
            ).value = "";

            renderAll();
        }

        /* =========================================================
           Theme
        ========================================================== */

        function setupTheme() {

            const savedTheme =
                localStorage.getItem(
                    THEME_KEY
                ) || "dark";

            document.documentElement
                .setAttribute(
                    "data-theme",
                    savedTheme
                );

            updateThemeButton(
                savedTheme
            );
        }

        function toggleTheme() {

            const current =
                document.documentElement
                    .getAttribute(
                        "data-theme"
                    );

            const next =
                current === "light"
                    ? "dark"
                    : "light";

            document.documentElement
                .setAttribute(
                    "data-theme",
                    next
                );

            localStorage.setItem(
                THEME_KEY,
                next
            );

            updateThemeButton(
                next
            );
        }

        function updateThemeButton(
            theme
        ) {

            document.getElementById(
                "themeToggleBtn"
            ).textContent =
                theme === "light"
                    ? "🌙 الوضع الداكن"
                    : "☀️ الوضع الفاتح";
        }

        /* =========================================================
           Progress Bar
        ========================================================== */

        function updateProgressBar() {

            const scrollTop =
                window.scrollY || 0;

            const height =
                document.documentElement
                    .scrollHeight -
                document.documentElement
                    .clientHeight;

            const percent =
                height > 0
                    ? (scrollTop / height) *
                      100
                    : 0;

            document.getElementById(
                "readingProgressBar"
            ).style.width =
                percent + "%";
        }

        /* =========================================================
           Backup Modal
        ========================================================== */

        function openBackupModal() {

            document.getElementById(
                "backupModal"
            ).classList.add(
                "active"
            );
        }

        function closeBackupModal() {

            document.getElementById(
                "backupModal"
            ).classList.remove(
                "active"
            );
        }

        /* =========================================================
           Export
        ========================================================== */

        function exportData() {

            const backup = {

                version: 1,

                exportedAt:
                    new Date().toISOString(),

                stories,

                likes,

                favorites
            };

            const blob =
                new Blob(
                    [
                        JSON.stringify(
                            backup,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            "application/json;charset=utf-8"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href = url;

            link.download =
                "hikaya_backup_" +
                Date.now() +
                ".json";

            document.body.appendChild(
                link
            );

            link.click();

            link.remove();

            setTimeout(
                () =>
                    URL.revokeObjectURL(
                        url
                    ),
                1000
            );

            showToast(
                "تم تصدير النسخة الاحتياطية ✅",
                "success"
            );
        }

        /* =========================================================
           Import
        ========================================================== */

        function importData(
            file
        ) {

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    try {

                        const data =
                            JSON.parse(
                                event.target.result
                            );

                        /*
                         * دعم:
                         * 1. النسخ الاحتياطية الجديدة
                         * 2. ملفات JSON القديمة التي تحتوي على Array مباشر
                         */

                        let importedStories;

                        if (
                            Array.isArray(
                                data
                            )
                        ) {

                            importedStories =
                                data;

                            likes = {};
                            favorites = [];

                        } else if (
                            data &&
                            Array.isArray(
                                data.stories
                            )
                        ) {

                            importedStories =
                                data.stories;

                            likes =
                                data.likes &&
                                typeof data.likes ===
                                    "object"
                                    ? data.likes
                                    : {};

                            favorites =
                                Array.isArray(
                                    data.favorites
                                )
                                    ? data.favorites
                                    : [];

                        } else {

                            throw new Error(
                                "INVALID_FILE"
                            );
                        }

                        stories =
                            importedStories
                                .filter(
                                    story =>
                                        story &&
                                        typeof story ===
                                            "object" &&
                                        story.id &&
                                        story.title &&
                                        story.content
                                )
                                .map(
                                    story => ({
                                        id:
                                            String(
                                                story.id
                                            ),

                                        title:
                                            String(
                                                story.title
                                            ),

                                        author:
                                            String(
                                                story.author ||
                                                "غير محدد"
                                            ),

                                        part:
                                            String(
                                                story.part ||
                                                "الفصل"
                                            ),

                                        cover:
                                            String(
                                                story.cover ||
                                                ""
                                            ),

                                        ownerToken:
                                            String(
                                                story.ownerToken ||
                                                "imported"
                                            ),

                                        content:
                                            String(
                                                story.content
                                            ),

                                        createdAt:
                                            Number(
                                                story.createdAt ||
                                                Date.now()
                                            )
                                    })
                                );

                        saveData();
                        renderAll();
                        closeBackupModal();

                        showToast(
                            "تمت استعادة البيانات بنجاح ✅",
                            "success"
                        );

                    } catch (error) {

                        console.error(
                            error
                        );

                        showToast(
                            "ملف JSON غير صالح.",
                            "danger"
                        );
                    }
                };

            reader.readAsText(
                file,
                "utf-8"
            );
        }

        /* =========================================================
           Render All
        ========================================================== */

        function renderAll() {

            renderStories();

            renderAuthorFolder(
                document.getElementById(
                    "folderSearchInput"
                ).value
            );

            updateStats();

            updateResumeReading();
        }

        /* =========================================================
           Events
        ========================================================== */

        function setupEventListeners() {

            /* Form */
            document
                .getElementById(
                    "storyForm"
                )
                .addEventListener(
                    "submit",
                    handlePublish
                );

            /* Theme */
            document
                .getElementById(
                    "themeToggleBtn"
                )
                .addEventListener(
                    "click",
                    toggleTheme
                );

            /* Publish scroll */
            document
                .getElementById(
                    "publishScrollBtn"
                )
                .addEventListener(
                    "click",
                    () => {

                        document
                            .getElementById(
                                "publishPanel"
                            )
                            .scrollIntoView({
                                behavior:
                                    "smooth",
                                block:
                                    "start"
                            });
                    }
                );

            /* Search */
            document
                .getElementById(
                    "globalSearchInput"
                )
                .addEventListener(
                    "input",
                    event => {

                        searchQuery =
                            event.target.value;

                        renderStories();
                    }
                );

            /* Author search */
            document
                .getElementById(
                    "folderSearchInput"
                )
                .addEventListener(
                    "input",
                    event => {

                        renderAuthorFolder(
                            event.target.value
                        );
                    }
                );

            /* Reset */
            document
                .getElementById(
                    "resetFiltersBtn"
                )
                .addEventListener(
                    "click",
                    resetFilters
                );

            /* Backup */
            document
                .getElementById(
                    "backupBtn"
                )
                .addEventListener(
                    "click",
                    openBackupModal
                );

            document
                .getElementById(
                    "closeBackupBtn"
                )
                .addEventListener(
                    "click",
                    closeBackupModal
                );

            document
                .getElementById(
                    "exportDataBtn"
                )
                .addEventListener(
                    "click",
                    exportData
                );

            document
                .getElementById(
                    "importDataBtn"
                )
                .addEventListener(
                    "click",
                    () => {

                        document
                            .getElementById(
                                "importFileInput"
                            )
                            .click();
                    }
                );

            document
                .getElementById(
                    "importFileInput"
                )
                .addEventListener(
                    "change",
                    event => {

                        importData(
                            event.target
                                .files[0]
                        );

                        event.target.value =
                            "";
                    }
                );

            /* Close modal */
            document
                .getElementById(
                    "backupModal"
                )
                .addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.id ===
                            "backupModal"
                        ) {
                            closeBackupModal();
                        }
                    }
                );

            /* Escape */
            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeBackupModal();

                        document.body.classList.remove(
                            "focus-mode"
                        );
                    }
                }
            );

            /* Scroll */
            window.addEventListener(
                "scroll",
                updateProgressBar,
                {
                    passive: true
                }
            );
        }

        /* =========================================================
           Start
        ========================================================== */

        function initApp() {

            getCurrentUserToken();

            loadData();

            setupTheme();

            setupEventListeners();

            renderAll();

            updateProgressBar();
        }

        document.addEventListener(
            "DOMContentLoaded",
            initApp
        );
    </script>

</body>
</html>
