<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="منصة حكاية - قراءة ونشر القصص والفصول">
    <title>حكاية — قراءة ونشر القصص</title>

    <style>
        :root {
            --bg: #0b1120;
            --bg-soft: #111827;
            --panel: #172033;
            --panel-2: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 20px 50px rgba(0, 0, 0, .22);
            --radius: 16px;
            --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --bg-soft: #e2e8f0;
            --panel: #ffffff;
            --panel-2: #f8fafc;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --accent: #4f46e5;
            --accent-2: #7c3aed;
            --accent-hover: #4338ca;
            --shadow: 0 20px 50px rgba(15, 23, 42, .12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, .12), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.8;
            min-height: 100vh;
            transition: background .3s, color .3s;
        }

        body.focus-mode .site-header,
        body.focus-mode .sidebar,
        body.focus-mode .reading-toolbar,
        body.focus-mode .actions-bar {
            display: none !important;
        }

        body.focus-mode .layout {
            grid-template-columns: 1fr;
            max-width: 900px;
        }

        body.focus-mode .story-text {
            font-size: 1.2rem;
            line-height: 2.15;
        }

        #progressBar {
            position: fixed;
            top: 0;
            right: 0;
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            z-index: 9999;
            transition: width .12s linear;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(14px);
            background: color-mix(in srgb, var(--panel) 90%, transparent);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1450px;
            margin: auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-size: 1.4rem;
            font-weight: 900;
            text-decoration: none;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(99, 102, 241, .25);
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        .btn {
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform .15s, background .2s, border-color .2s;
            font-weight: 700;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-hover), var(--accent-2));
        }

        .btn-outline {
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--panel-2);
        }

        .layout {
            width: min(1450px, calc(100% - 32px));
            margin: 26px auto 50px;
            display: grid;
            grid-template-columns: 310px minmax(0, 1fr);
            gap: 22px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-self: start;
            position: sticky;
            top: 82px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding-left: 2px;
        }

        .panel {
            background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 92%, var(--bg)));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-size: 1rem;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .field {
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            color: var(--muted);
            font-size: .86rem;
            margin-bottom: 6px;
        }

        .control {
            width: 100%;
            color: var(--text);
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            padding: 11px 12px;
            transition: border-color .2s, box-shadow .2s;
        }

        .control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .14);
        }

        textarea.control {
            min-height: 150px;
            resize: vertical;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px;
            text-align: center;
        }

        .stat-number {
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 900;
        }

        .stat-label {
            font-size: .78rem;
            color: var(--muted);
        }

        .author-results {
            margin-top: 10px;
        }

        .author-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            border-radius: 8px;
        }

        .author-item:hover {
            background: var(--bg-soft);
        }

        .main {
            min-width: 0;
        }

        .hero {
            padding: 22px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            border: 1px solid var(--border);
            background:
                linear-gradient(135deg, rgba(99, 102, 241, .16), transparent 55%),
                var(--panel);
        }

        .hero h1 {
            font-size: clamp(1.55rem, 3vw, 2.3rem);
            margin-bottom: 5px;
        }

        .hero p {
            color: var(--muted);
            max-width: 800px;
        }

        .story-bundle {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .bundle-header {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 16px;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .cover {
            width: 90px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .bundle-title {
            font-size: clamp(1.25rem, 2.3vw, 1.7rem);
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .meta-line {
            color: var(--muted);
            font-size: .86rem;
        }

        .story-card {
            margin-top: 16px;
            padding: 18px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .story-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .part-title {
            font-size: 1.08rem;
            font-weight: 800;
        }

        .delete-btn {
            color: var(--danger);
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: .78rem;
        }

        .story-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 13px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 5px 9px;
            font-size: .78rem;
        }

        .reading-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 15px;
        }

        .tool {
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: .8rem;
        }

        .tool:hover {
            border-color: var(--accent);
        }

        .story-text {
            font-size: 1.04rem;
            line-height: 2;
            white-space: pre-line;
            overflow-wrap: anywhere;
            margin-bottom: 15px;
        }

        .story-text::first-letter {
            font-size: 1.25em;
            font-weight: 800;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-top: 13px;
            border-top: 1px solid var(--border);
        }

        .actions-left {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .action {
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: .82rem;
        }

        .action.liked {
            color: var(--danger);
            border-color: var(--danger);
        }

        .action.faved {
            color: var(--warning);
            border-color: var(--warning);
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .resume-box {
            display: none;
        }

        .resume-box.active {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: min(520px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
        }

        .modal-content p {
            color: var(--muted);
            margin-bottom: 15px;
            font-size: .9rem;
        }

        .modal-buttons {
            display: grid;
            gap: 9px;
        }

        .toast-container {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: min(360px, calc(100% - 36px));
        }

        .toast {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-right: 4px solid var(--accent);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            animation: toastIn .25s ease;
        }

        .toast.success {
            border-right-color: var(--success);
        }

        .toast.danger {
            border-right-color: var(--danger);
        }

        .toast.warning {
            border-right-color: var(--warning);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                max-height: none;
                overflow: visible;
            }

            .publish-panel {
                order: 2;
            }
        }

        @media (max-width: 600px) {
            .layout {
                width: min(100% - 18px, 1450px);
                margin-top: 12px;
            }

            .header-inner {
                padding: 11px 10px;
                align-items: flex-start;
            }

            .logo span:last-child {
                display: none;
            }

            .header-actions {
                justify-content: flex-end;
            }

            .header-actions .btn {
                padding: 8px 9px;
                font-size: .76rem;
            }

            .bundle-header {
                grid-template-columns: 70px 1fr;
            }

            .cover {
                width: 70px;
                height: 95px;
            }

            .story-card,
            .story-bundle,
            .panel,
            .hero {
                padding: 13px;
            }

            .actions-bar {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="progressBar"></div>

    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="#">
                <span class="logo-mark">📖</span>
                <span>حكاية</span>
            </a>

            <div class="header-actions">
                <button class="btn btn-outline" id="themeBtn">☀️ الوضع الفاتح</button>
                <button class="btn btn-outline" id="backupBtn">💾 النسخ الاحتياطي</button>
                <button class="btn btn-primary" id="publishBtn">✍️ نشر فصل</button>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">

            <section class="panel resume-box" id="resumeBox">
                <h3 class="panel-title">📍 متابعة القراءة</h3>
                <p id="resumeText" style="color:var(--muted);font-size:.86rem;margin-bottom:10px;"></p>
                <button class="btn btn-outline" style="width:100%;" id="resumeBtn">
                    الانتقال إلى آخر موضع
                </button>
            </section>

            <section class="panel">
                <h3 class="panel-title">📊 الإحصائيات</h3>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="totalStories">0</div>
                        <div class="stat-label">الفصول</div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="totalAuthors">0</div>
                        <div class="stat-label">المؤلفون</div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="totalFavorites">0</div>
                        <div class="stat-label">المفضلة</div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="totalLikes">0</div>
                        <div class="stat-label">الإعجابات</div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <h3 class="panel-title">🔎 البحث والتصفية</h3>

                <div class="field">
                    <label for="searchInput">بحث داخل المنصة</label>
                    <input
                        id="searchInput"
                        class="control"
                        type="search"
                        placeholder="العنوان، الكاتب، الفصل، المحتوى..."
                        autocomplete="off">
                </div>

                <div class="field">
                    <label for="authorInput">البحث عن كاتب</label>
                    <input
                        id="authorInput"
                        class="control"
                        type="search"
                        placeholder="اكتب اسم الكاتب..."
                        autocomplete="off">
                </div>

                <div class="author-results" id="authorResults"></div>

                <button class="btn btn-outline" style="width:100%;margin-top:10px;" id="resetBtn">
                    إعادة ضبط البحث
                </button>
            </section>

            <section class="panel publish-panel" id="publishPanel">
                <h3 class="panel-title">✍️ نشر فصل جديد</h3>

                <form id="storyForm">
                    <div class="field">
                        <label for="storyTitle">عنوان القصة الرئيسي</label>
                        <input
                            class="control"
                            id="storyTitle"
                            required
                            value="رحلة نحو معرفة الذات">
                    </div>

                    <div class="field">
                        <label for="authorName">اسم الكاتب</label>
                        <input
                            class="control"
                            id="authorName"
                            required
                            placeholder="اسم المؤلف">
                    </div>

                    <div class="field">
                        <label for="storyPart">رقم أو اسم الفصل</label>
                        <input
                            class="control"
                            id="storyPart"
                            required
                            placeholder="الفصل الأول">
                    </div>

                    <div class="field">
                        <label for="coverUrl">رابط صورة الغلاف — اختياري</label>
                        <input
                            class="control"
                            id="coverUrl"
                            placeholder="https://example.com/cover.jpg">
                    </div>

                    <div class="field">
                        <label for="storyContent">محتوى الفصل</label>
                        <textarea
                            class="control"
                            id="storyContent"
                            required
                            placeholder="اكتب الفصل هنا..."></textarea>
                    </div>

                    <button class="btn btn-primary" type="submit" style="width:100%;">
                        نشر الفصل
                    </button>
                </form>
            </section>
        </aside>

        <main class="main">
            <section class="hero">
                <h1>📚 منصة حكاية</h1>
                <p>
                    اقرأ القصص، تابع الفصول، احفظ موضعك، وأضف أعمالك الخاصة في مكان واحد.
                </p>
            </section>

            <div id="storiesContainer"></div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal" id="backupModal">
        <div class="modal-content">
            <h3 class="panel-title">💾 إدارة النسخ الاحتياطي</h3>

            <p>
                يمكنك حفظ قصصك في ملف JSON واستعادتها لاحقاً على نفس المنصة.
            </p>

            <div class="modal-buttons">
                <button class="btn btn-primary" id="exportBtn">
                    📤 تصدير البيانات
                </button>

                <button class="btn btn-outline" id="importBtn">
                    📥 استعادة البيانات
                </button>

                <input
                    type="file"
                    id="importInput"
                    accept=".json,application/json"
                    class="hidden">

                <button class="btn btn-outline" id="closeBackupBtn">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        /* =========================================================
           إعدادات التخزين
        ========================================================= */

        const STORAGE_KEY = "hikaya_stories_v2";
        const LIKES_KEY = "hikaya_likes_v2";
        const FAVORITES_KEY = "hikaya_favorites_v2";
        const BOOKMARK_KEY = "hikaya_bookmark_v2";
        const USER_TOKEN_KEY = "hikaya_user_token_v2";
        const THEME_KEY = "hikaya_theme_v2";

        /* =========================================================
           القصة الافتراضية المطلوبة
        ========================================================= */

        const defaultStories = [
            {
                id: "story_001",
                title: "رحلة نحو معرفة الذات",
                author: "الكاتب المعجزة",
                part: "الفصل الأول — في الغابة",
                cover: "",
                createdAt: Date.now(),
                ownerToken: "system",
                content: `في غابة مظلمة، كان هناك صوت رفرفة الأشجار الهادئة وأصوات الرياح.

فجأة، ظهر نمر يركض خلف رجل غريب، وكانت أصوات خطوات الرجل هادئة ومخفية مثل القتلة المستأجرين.

تسلق الرجل الشجرة فلاحظه النمر، لكن الرجل لم يتوتر بل انقض عليه بسيفه وقتله، ثم أكمل طريقه.

في اليوم التالي، جاء رجلان من قرية قريبة من تلك الغابة لجمع فطر عش الغراب.

رأى أحد الرجلين منظر جثة النمر فُصدم، ونادى على زميله وقال له وهو فرح ومبتسم:
— "هذا رائع! يمكننا بيعه في القرية".

فاستغرب زميله وقال:
— "لكن النمور لا تُباع في قريتنا، أين ستبيعها وكيف؟"

فقال له الآخر:
— "إن هذه قُطعت بواسطة رجل مشهور، وبالتأكيد الأغنياء سيشترونها".

فقال رجل القرية:
— "ومن قتل النمر؟"

أجابه زميله:
— "إنه سياف مشهور يدعى غارلون".

صُدم الرجل مما سمعه، وقررا بيع جلد النمر في مدينة "كوراساوا" التي تبعد عنهما 7 كيلومترات، فأخذا النمر معهما على عربة تجرها الأحصنة وانطلقا في رحلتهما.

قضى الرجلان 4 ساعات للوصول إلى كوراساوا؛ إذ كان الطريق مليئاً بالمطبات، وكانا متعبين بسبب الحرارة الحارقة، فقررا أن يرتاحا قليلاً.

أثناء راحتهما، ظهر ظل لشخص ما في الغابة، فذهب أحد الرجلين ليرى من هذا الشخص بدافع الفضول.

وما إن وصل حتى ملأت الصدمة وجهه؛ إذ كان أمامه السياف غارلون وهو يتدرب في الغابة.

لمحه السياف وكان سيهاجمه ظناً منه أنه خطر يهدده، لكن الرجل قال له ليهدئه:

تفهم غارلون الكلام وهدأ، وقرر أن يتركه.

ولكن قبل أن يبتعد، سمع غارلون صوت حركة خلف رجل القرية، فركض وفوجئ بسياف آخر يهاجم زميل رجل القرية.

فحزن عليه صديقه كثيراً.

انقض غارلون على السياف المعتدي، وظلا يتقاتلان ويتبادلان الضربات بالسيف، وكان غارلون متفوقاً عليه في القتال بشكل ملحوظ.

أثناء القتال، ذهب الرجل إلى زميله الذي كان يحتضر وقال له:

فقال بصوت مليء بالألم:

فسأله:

فسأله زميله:
— "ما هو؟"

قال الرجل:

جاء غارلون إليه بخطوات هادئة وقال له:

أجاب الرجل:

رد غارلون:

فقال رجل القرية:
— "نعم، بكل سرور".

مشى غارلون مع رجل القرية وقال له:

قال الرجل:

فقال له غارلون إنه من مدينة "ميكارليس"، وهي مدينة بعيدة جداً.

سأل محمد:
— "ما هو الهدف الذي تسعى إليه يا غارلون؟"

أجابه غارلون:
— "أريد أن أجمع المال وأسعى لتسديد ديوني".

فقال محمد مستغرباً:
— "ولماذا أنت مديون؟"

رد غارلون:
— "في الماضي، كان والدي يلعب القمار ويستلف النقود من العصابات. وعندما لم يسدد ديونه، قتله رجال العصابة وأصبحت الديون على عاتقي. ويبلغ قيمة هذا الدين 500 مليون ين".

انصدم محمد من الرقم وقال بصوت مهزوز من الصدمة:
— "إلى أين سنذهب الآن يا غارلون؟"

قال غارلون:
— "سنذهب إلى رجال العصابة للانتقام منهم".

في اليوم التالي، واصل غارلون ومحمد طريقهما نحو مدينة كوراساوا لبيع النمر.

وفي الطريق واجها العدو اللدود لأي مسافر: الجوع.

طلب غارلون من محمد أن ينتظر لكي يصطاد غزالاً أو أرنباً برياً.

توغل غارلون في الغابة، وبعد 20 دقيقة من البحث وجد أرنباً برياً.

حبس أنفاسه وركز جيداً، ثم سحب سيفه ببطء وانقض عليه مسرعاً بدون صوت، ثم عاد بالصيد.

عاد غارلون، واندهش محمد مما جلبه وقال:
— "كيف اصطدت هذا الأرنب؟ إنه أمر مذهل!"

أجابه غارلون ببرود:

قال محمد:

أثناء تجميع الحطب، قال محمد في نفسه إنه لن يجعل برود غارلون عائقاً، ولن يجعله شخصاً بارداً بل سيعامله بلطف دائماً.

جمع الحطب وأشعل النار لشوي الأرنب وأكلا معاً.

بعد ساعة، وصلا إلى مدينة كوراساوا، وذهبا إلى تاجر لجلود الحيوانات وباعا له جلد النمر بثمن باهظ بلغ 100 ألف ين.

ولكن أثناء سيرهما، كان غارلون ينضب غضباً من شيء ما.

لاحظ محمد غضب غارلون المكبوت، فقال له غارلون بصوت هادئ:
— "أتلاحظ من كان التاجر الذي بعنا له النمر؟"

قال محمد باستغراب:
— "لا، من يكون؟"

قال غارلون بصوت يتسرب منه الغضب:
— "إنه فرد من العصابة التي قتلت والدي وأنا مديون لها".

انصدم محمد وغضب وقال:
— "لماذا لم تقل لي؟!"

أجابه غارلون:

هدأ محمد، وقررا التفكير في طريقة لمواجهة العصابة.

فكر غارلون في خطة وقال:

فكر محمد في خطة غارلون وقرر الموافقة، ثم سأله:

أجابه غارلون:
— "في مصر".

بالفعل، انطلقا نحو التاجر في الليل وراقبه غارلون.

كان التاجر يُدعى "بوراينو"، وهو الفرد السابع من عصابة تُدعى "عصابة المونيراف"؛ أشهر عصابة في البلاد والمعروفة بأساليبها الخطيرة للغاية.

ورغم أن عدد أعضائها قليل، 15 فرداً فقط، إلا أنهم من بين أقوى 100 سياف عرفهم التاريخ.

فهل سينتصر عليهم غارلون؟

هذا ما سنعرفه في الجزء القادم...`
            }

        /* =========================================================
           حالة التطبيق
        ========================================================= */

        let stories = [];
        let likes = {};
        let favorites = [];
        let activeAuthor = "";
        let currentSearch = "";

        /* =========================================================
           أدوات عامة
        ========================================================= */

        function getUserToken() {
            let token = localStorage.getItem(USER_TOKEN_KEY);

            if (!token) {
                token = "usr_" + cryptoRandom();
                localStorage.setItem(USER_TOKEN_KEY, token);
            }

            return token;
        }

        function cryptoRandom() {
            if (window.crypto && crypto.getRandomValues) {
                const bytes = new Uint8Array(12);
                crypto.getRandomValues(bytes);
                return [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
            }

            return Math.random().toString(36).slice(2) + Date.now().toString(36);
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
                localStorage.setItem(LIKES_KEY, JSON.stringify(likes));
                localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
            } catch {
                showToast("تعذر حفظ البيانات محلياً.", "danger");
            }

            updateStats();
        }

        function loadState() {
            try {
                const savedStories = localStorage.getItem(STORAGE_KEY);

                if (savedStories) {
                    const parsed = JSON.parse(savedStories);
                    stories = Array.isArray(parsed) ? parsed : [...defaultStories];
                } else {
                    stories = [...defaultStories];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
                }

                likes = JSON.parse(localStorage.getItem(LIKES_KEY) || "{}") || {};
                favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]") || [];
            } catch {
                stories = [...defaultStories];
                likes = {};
                favorites = [];
                showToast("تم تحميل نسخة آمنة من البيانات.", "warning");
            }
        }

        function escapeText(value) {
            return String(value ?? "");
        }

        function calculateReadTime(text) {
            const count = String(text || "")
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .length;

            return Math.max(1, Math.ceil(count / 150));
        }

        function groupByTitle(list) {
            return list.reduce((groups, story) => {
                const key = story.title || "بدون عنوان";
                if (!groups[key]) groups[key] = [];
                groups[key].push(story);
                return groups;
            }, {});
        }

        function showToast(message, type = "") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");

            toast.className = "toast" + (type ? " " + type : "");
            toast.textContent = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3200);
        }

        /* =========================================================
           العرض
        ========================================================= */

        function renderStories() {
            const container = document.getElementById("storiesContainer");

            const query = currentSearch.trim().toLowerCase();
            const author = activeAuthor.trim().toLowerCase();

            const filtered = stories.filter(story => {
                const matchesAuthor =
                    !author ||
                    String(story.author || "").toLowerCase() === author;

                const searchable = [
                    story.title,
                    story.author,
                    story.part,
                    story.content
                ]
                    .map(value => String(value || "").toLowerCase())
                    .join(" ");

                const matchesSearch =
                    !query || searchable.includes(query);

                return matchesAuthor && matchesSearch;
            });

            container.innerHTML = "";

            if (!filtered.length) {
                container.innerHTML = `
                    <div class="empty">
                        <div style="font-size:2rem;margin-bottom:8px;">📭</div>
                        لا توجد قصص مطابقة للبحث الحالي.
                    </div>
                `;
                return;
            }

            const grouped = groupByTitle(filtered);
            const currentToken = getUserToken();

            Object.values(grouped).forEach(bundle => {
                const first = bundle[0];

                const bundleEl = document.createElement("section");
                bundleEl.className = "story-bundle";

                const header = document.createElement("div");
                header.className = "bundle-header";

                const cover = document.createElement("img");
                cover.className = "cover";
                cover.alt = "غلاف القصة";

                if (first.cover) {
                    cover.src = first.cover;
                    cover.onerror = () => {
                        cover.removeAttribute("src");
                        cover.classList.add("hidden");
                        header.prepend(createFallbackCover());
                    };
                } else {
                    cover.replaceWith(createFallbackCover());
                }

                const info = document.createElement("div");

                const title = document.createElement("h2");
                title.className = "bundle-title";
                title.textContent = first.title;

                const meta = document.createElement("div");
                meta.className = "meta-line";
                meta.textContent =
                    "👤 الكاتب: " + (first.author || "غير معروف") +
                    " • 📚 " + bundle.length + " فصل";

                info.appendChild(title);
                info.appendChild(meta);

                header.appendChild(cover);
                header.appendChild(info);
                bundleEl.appendChild(header);

                bundle
                    .sort((a, b) => Number(a.createdAt || 0) - Number(b.createdAt || 0))
                    .forEach(story => {
                        bundleEl.appendChild(
                            createStoryCard(story, currentToken)
                        );
                    });

                container.appendChild(bundleEl);
            });
        }

        function createFallbackCover() {
            const div = document.createElement("div");

            div.style.width = "90px";
            div.style.height = "120px";
            div.style.borderRadius = "12px";
            div.style.display = "grid";
            div.style.placeItems = "center";
            div.style.fontSize = "2rem";
            div.style.background =
                "linear-gradient(135deg, var(--accent), var(--accent-2))";

            div.textContent = "📖";

            return div;
        }

        function createStoryCard(story, currentToken) {
            const card = document.createElement("article");
            card.className = "story-card";
            card.id = "story-card-" + story.id;

            const head = document.createElement("div");
            head.className = "story-head";

            const part = document.createElement("div");
            part.className = "part-title";
            part.textContent = story.part || "فصل";

            head.appendChild(part);

            if (story.ownerToken === currentToken) {
                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "حذف الفصل";

                deleteBtn.addEventListener("click", () => {
                    deleteStory(story.id);
                });

                head.appendChild(deleteBtn);
            }

            card.appendChild(head);

            const meta = document.createElement("div");
            meta.className = "story-meta";

            const timeBadge = document.createElement("span");
            timeBadge.className = "badge";
            timeBadge.textContent =
                "⏱️ " + calculateReadTime(story.content) + " دقيقة قراءة";

            meta.appendChild(timeBadge);

            const authorBadge = document.createElement("span");
            authorBadge.className = "badge";
            authorBadge.textContent = "👤 " + (story.author || "غير معروف");

            meta.appendChild(authorBadge);

            card.appendChild(meta);

            const toolbar = document.createElement("div");
            toolbar.className = "reading-toolbar";

            toolbar.appendChild(
                makeTool("A+", () => changeFontSize(story.id, 2))
            );

            toolbar.appendChild(
                makeTool("A−", () => changeFontSize(story.id, -2))
            );

            toolbar.appendChild(
                makeTool("👁️ وضع التركيز", toggleFocusMode)
            );

            toolbar.appendChild(
                makeTool("🔖 حفظ موضع القراءة", () => {
                    saveBookmark(story.id, story.title, story.part);
                })
            );

            card.appendChild(toolbar);

            const storyText = document.createElement("div");
            storyText.className = "story-text";
            storyText.id = "text-" + story.id;
            storyText.textContent = story.content;

            card.appendChild(storyText);

            const actionsBar = document.createElement("div");
            actionsBar.className = "actions-bar";

            const left = document.createElement("div");
            left.className = "actions-left";

            const liked = Boolean(likes[story.id]);
            const faved = favorites.includes(story.id);

            const likeBtn = document.createElement("button");
            likeBtn.className = "action" + (liked ? " liked" : "");
            likeBtn.textContent = liked ? "❤️ أعجبني" : "🤍 إعجاب";

            likeBtn.addEventListener("click", () => {
                toggleLike(story.id);
            });

            const favoriteBtn = document.createElement("button");
            favoriteBtn.className = "action" + (faved ? " faved" : "");
            favoriteBtn.textContent = faved ? "⭐ محفوظة" : "☆ حفظ";

            favoriteBtn.addEventListener("click", () => {
                toggleFavorite(story.id);
            });

            left.appendChild(likeBtn);
            left.appendChild(favoriteBtn);

            const shareBtn = document.createElement("button");
            shareBtn.className = "action";
            shareBtn.textContent = "🔗 مشاركة";

            shareBtn.addEventListener("click", () => {
                shareStory(story);
            });

            actionsBar.appendChild(left);
            actionsBar.appendChild(shareBtn);

            card.appendChild(actionsBar);

            return card;
        }

        function makeTool(text, callback) {
            const btn = document.createElement("button");
            btn.className = "tool";
            btn.type = "button";
            btn.textContent = text;
            btn.addEventListener("click", callback);
            return btn;
        }

        /* =========================================================
           النشر
        ========================================================= */

        function publishStory(event) {
            event.preventDefault();

            const title = document.getElementById("storyTitle").value.trim();
            const author = document.getElementById("authorName").value.trim();
            const part = document.getElementById("storyPart").value.trim();
            const cover = document.getElementById("coverUrl").value.trim();
            const content = document.getElementById("storyContent").value.trim();

            if (!title || !author || !part || !content) {
                showToast("يرجى تعبئة الحقول المطلوبة.", "danger");
                return;
            }

            const newStory = {
                id: "story_" + Date.now() + "_" + cryptoRandom().slice(0, 8),
                title,
                author,
                part,
                cover,
                content,
                ownerToken: getUserToken(),
                createdAt: Date.now()
            };

            stories.push(newStory);
            saveState();

            document.getElementById("storyForm").reset();
            document.getElementById("storyTitle").value = "رحلة نحو معرفة الذات";

            renderAll();
            showToast("تم نشر الفصل بنجاح! ✅", "success");
        }

        function deleteStory(id) {
            const story = stories.find(item => item.id === id);

            if (!story) return;

            if (story.ownerToken !== getUserToken()) {
                showToast("لا يمكنك حذف هذا الفصل.", "danger");
                return;
            }

            const confirmed = confirm("هل أنت متأكد من حذف هذا الفصل؟");

            if (!confirmed) return;

            stories = stories.filter(item => item.id !== id);

            delete likes[id];
            favorites = favorites.filter(item => item !== id);

            saveState();
            renderAll();

            showToast("تم حذف الفصل.", "danger");
        }

        /* =========================================================
           الإعجاب والمفضلة والمشاركة
        ========================================================= */

        function toggleLike(id) {
            likes[id] = !likes[id];
            saveState();
            renderAll();
        }

        function toggleFavorite(id) {
            const index = favorites.indexOf(id);

            if (index >= 0) {
                favorites.splice(index, 1);
                showToast("تمت إزالة الفصل من المفضلة.");
            } else {
                favorites.push(id);
                showToast("تم حفظ الفصل في المفضلة ⭐", "success");
            }

            saveState();
            renderAll();
        }

        async function shareStory(story) {
            const shareData = {
                title: story.title + " — " + story.part,
                text: "قراءة: " + story.title + " — " + story.part,
                url: window.location.href.split("#")[0] + "#" + story.id
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                    return;
                }

                await navigator.clipboard.writeText(
                    window.location.href.split("#")[0] + "#" + story.id
                );

                showToast("تم نسخ رابط القصة. 🔗", "success");
            } catch {
                showToast("تعذر مشاركة القصة حالياً.", "warning");
            }
        }

        /* =========================================================
           وضع القراءة
        ========================================================= */

        function changeFontSize(storyId, delta) {
            const element = document.getElementById("text-" + storyId);

            if (!element) return;

            const current = parseFloat(
                getComputedStyle(element).fontSize
            ) || 16;

            const next = Math.min(
                32,
                Math.max(14, current + delta)
            );

            element.style.fontSize = next + "px";
        }

        function toggleFocusMode() {
            document.body.classList.toggle("focus-mode");
        }

        /* =========================================================
           حفظ موضع القراءة
        ========================================================= */

        function saveBookmark(id, title, part) {
            const card = document.getElementById("story-card-" + id);

            const bookmark = {
                id,
                title,
                part,
                scroll:
                    card
                        ? Math.max(
                            0,
                            window.scrollY -
                            card.getBoundingClientRect().top -
                            window.scrollY
                        )
                        : 0,
                time: Date.now()
            };

            localStorage.setItem(
                BOOKMARK_KEY,
                JSON.stringify(bookmark)
            );

            updateResumeBox();
            showToast("تم حفظ موضع القراءة. 🔖", "success");
        }

        function updateResumeBox() {
            const box = document.getElementById("resumeBox");
            const text = document.getElementById("resumeText");
            const btn = document.getElementById("resumeBtn");

            const raw = localStorage.getItem(BOOKMARK_KEY);

            if (!raw) {
                box.classList.remove("active");
                return;
            }

            let bookmark;

            try {
                bookmark = JSON.parse(raw);
            } catch {
                box.classList.remove("active");
                return;
            }

            if (!bookmark || !bookmark.id) {
                box.classList.remove("active");
                return;
            }

            text.textContent =
                "توقفت عند: " +
                (bookmark.title || "قصة") +
                " — " +
                (bookmark.part || "فصل");

            box.classList.add("active");

            btn.onclick = () => {
                const target = document.getElementById(
                    "story-card-" + bookmark.id
                );

                if (!target) {
                    showToast("الفصل المحفوظ غير موجود.", "danger");
                    return;
                }

                target.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            };
        }

        /* =========================================================
           البحث والكتاب
        ========================================================= */

        function renderAuthorResults() {
            const container = document.getElementById("authorResults");
            const query =
                document.getElementById("authorInput").value
                    .trim()
                    .toLowerCase();

            container.innerHTML = "";

            if (!query) {
                return;
            }

            const authors = [
                ...new Set(
                    stories
                        .map(story => String(story.author || "").trim())
                        .filter(Boolean)
                )
            ].filter(author =>
                author.toLowerCase().includes(query)
            );

            if (!authors.length) {
                const empty = document.createElement("div");
                empty.style.color = "var(--muted)";
                empty.style.fontSize = ".82rem";
                empty.style.padding = "8px";
                empty.textContent = "لم يتم العثور على الكاتب.";
                container.appendChild(empty);
                return;
            }

            authors.forEach(author => {
                const item = document.createElement("div");
                item.className = "author-item";

                const name = document.createElement("span");
                name.textContent = "👤 " + author;

                const count = document.createElement("strong");
                count.textContent =
                    stories.filter(s => s.author === author).length +
                    " فصل";

                item.appendChild(name);
                item.appendChild(count);

                item.addEventListener("click", () => {
                    activeAuthor = author;
                    renderAll();
                    showToast("تم عرض أعمال " + author);
                });

                container.appendChild(item);
            });
        }

        function resetFilters() {
            currentSearch = "";
            activeAuthor = "";

            document.getElementById("searchInput").value = "";
            document.getElementById("authorInput").value = "";

            renderAll();
        }

        /* =========================================================
           الإحصائيات
        ========================================================= */

        function updateStats() {
            document.getElementById("totalStories").textContent =
                stories.length;

            document.getElementById("totalAuthors").textContent =
                new Set(
                    stories.map(story => story.author).filter(Boolean)
                ).size;

            document.getElementById("totalFavorites").textContent =
                favorites.length;

            document.getElementById("totalLikes").textContent =
                Object.values(likes).filter(Boolean).length;
        }

        /* =========================================================
           النسخ الاحتياطي
        ========================================================= */

        function exportData() {
            const data = {
                version: 2,
                exportedAt: new Date().toISOString(),
                stories,
                likes,
                favorites
            };

            const blob = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: "application/json;charset=utf-8" }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download =
                "hikaya_backup_" +
                new Date().toISOString().replace(/[:.]/g, "-") +
                ".json";

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            showToast("تم تصدير النسخة الاحتياطية. 💾", "success");
        }

        function importData(file) {
            if (!file) return;

            const reader = new FileReader();

            reader.onload = event => {
                try {
                    const parsed = JSON.parse(event.target.result);

                    if (
                        !parsed ||
                        typeof parsed !== "object" ||
                        !Array.isArray(parsed.stories)
                    ) {
                        throw new Error("INVALID_BACKUP");
                    }

                    stories = parsed.stories
                        .filter(story =>
                            story &&
                            typeof story === "object" &&
                            story.id &&
                            story.title &&
                            story.content
                        )
                        .map(story => ({
                            id: String(story.id),
                            title: String(story.title),
                            author: String(story.author || "غير معروف"),
                            part: String(story.part || "فصل"),
                            cover: String(story.cover || ""),
                            content: String(story.content),
                            ownerToken: String(story.ownerToken || "imported"),
                            createdAt: Number(story.createdAt || Date.now())
                        }));

                    likes =
                        parsed.likes &&
                        typeof parsed.likes === "object"
                            ? parsed.likes
                            : {};

                    favorites =
                        Array.isArray(parsed.favorites)
                            ? parsed.favorites
                            : [];

                    saveState();
                    renderAll();
                    closeBackupModal();

                    showToast(
                        "تمت استعادة البيانات بنجاح. ✅",
                        "success"
                    );
                } catch {
                    showToast(
                        "ملف النسخة الاحتياطية غير صالح.",
                        "danger"
                    );
                }
            };

            reader.readAsText(file, "utf-8");
        }

        /* =========================================================
           المظهر
        ========================================================= */

        function setupTheme() {
            const saved =
                localStorage.getItem(THEME_KEY) || "dark";

            document.documentElement.dataset.theme = saved;
            updateThemeButton(saved);
        }

        function toggleTheme() {
            const current =
                document.documentElement.dataset.theme;

            const next =
                current === "light" ? "dark" : "light";

            document.documentElement.dataset.theme = next;
            localStorage.setItem(THEME_KEY, next);

            updateThemeButton(next);
        }

        function updateThemeButton(theme) {
            document.getElementById("themeBtn").textContent =
                theme === "light"
                    ? "🌙 الوضع الداكن"
                    : "☀️ الوضع الفاتح";
        }

        /* =========================================================
           شريط تقدم القراءة
        ========================================================= */

        function updateProgress() {
            const scrollTop = window.scrollY || 0;
            const max =
                document.documentElement.scrollHeight -
                window.innerHeight;

            const percent =
                max > 0
                    ? Math.min(100, (scrollTop / max) * 100)
                    : 0;

            document.getElementById("progressBar").style.width =
                percent + "%";
        }

        /* =========================================================
           النسخ الاحتياطي — نافذة
        ========================================================= */

        function openBackupModal() {
            document.getElementById("backupModal")
                .classList.add("active");
        }

        function closeBackupModal() {
            document.getElementById("backupModal")
                .classList.remove("active");
        }

        /* =========================================================
           التصيير الكامل
        ========================================================= */

        function renderAll() {
            renderStories();
            renderAuthorResults();
            updateStats();
            updateResumeBox();
        }

        /* =========================================================
           الأحداث
        ========================================================= */

        function setupEvents() {
            document
                .getElementById("storyForm")
                .addEventListener("submit", publishStory);

            document
                .getElementById("themeBtn")
                .addEventListener("click", toggleTheme);

            document
                .getElementById("publishBtn")
                .addEventListener("click", () => {
                    document
                        .getElementById("publishPanel")
                        .scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });

                    setTimeout(() => {
                        document
                            .getElementById("authorName")
                            .focus();
                    }, 500);
                });

            document
                .getElementById("searchInput")
                .addEventListener("input", event => {
                    currentSearch = event.target.value;
                    renderStories();
                });

            document
                .getElementById("authorInput")
                .addEventListener("input", () => {
                    renderAuthorResults();
                });

            document
                .getElementById("resetBtn")
                .addEventListener("click", resetFilters);

            document
                .getElementById("backupBtn")
                .addEventListener("click", openBackupModal);

            document
                .getElementById("closeBackupBtn")
                .addEventListener("click", closeBackupModal);

            document
                .getElementById("exportBtn")
                .addEventListener("click", exportData);

            document
                .getElementById("importBtn")
                .addEventListener("click", () => {
                    document
                        .getElementById("importInput")
                        .click();
                });

            document
                .getElementById("importInput")
                .addEventListener("change", event => {
                    importData(event.target.files[0]);
                    event.target.value = "";
                });

            document
                .getElementById("backupModal")
                .addEventListener("click", event => {
                    if (event.target.id === "backupModal") {
                        closeBackupModal();
                    }
                });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    closeBackupModal();
                    document.body.classList.remove("focus-mode");
                }
            });

            window.addEventListener("scroll", updateProgress, {
                passive: true
            });

            window.addEventListener("hashchange", () => {
                const id = location.hash.replace("#", "");

                if (!id) return;

                const target =
                    document.getElementById("story-card-" + id);

                if (target) {
                    setTimeout(() => {
                        target.scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                    }, 250);
                }
            });
        }

        /* =========================================================
           التشغيل
        ========================================================= */

        function init() {
            getUserToken();
            loadState();
            setupTheme();
            setupEvents();
            renderAll();
            updateProgress();

            if (location.hash) {
                setTimeout(() => {
                    const id = location.hash.slice(1);
                    const target =
                        document.getElementById("story-card-" + id);

                    if (target) {
                        target.scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                    }
                }, 400);
            }
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
