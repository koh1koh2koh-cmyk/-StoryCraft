<!DOCTYPE1 html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryCraft - منصة القصص</title>
    
    <!-- ResponsiveVoice لقراءة النصوص صوتياً بكفاءة عالية -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        
        /* نموذج إضافة قصة */
        .story-form, .story-card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"], input[type="url"], textarea { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        
        /* أزرار */
        .btn { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-left: 5px; }
        .btn-add { background-color: #28a745; color: white; width: 100%; }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-audio { background-color: #007bff; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-close { background-color: #6c757d; color: white; }
        .btn:hover { opacity: 0.9; }

        /* عرض القصة */
        .story-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .story-title { font-size: 22px; color: #111; margin-top: 0; }
        .story-content { font-size: 17px; line-height: 1.8; color: #444; white-space: pre-line; }
        .actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }

        /* نافذة التعديل المنبثقة Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: #fff; width: 90%; max-width: 550px; padding: 25px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 StoryCraft</h1>

    <!-- نموذج إضافة قصة جديدة -->
    <div class="story-form">
        <h3>إضافة قصة جديدة</h3>
        <input type="text" id="new-title" placeholder="عنوان القصة...">
        <input type="url" id="new-image" placeholder="رابط صورة القصة (اختياري)...">
        <textarea id="new-content" rows="4" placeholder="اكتب القصة هنا مع التشكيل..."></textarea>
        <button class="btn btn-add" onclick="addStory()">نشر القصة</button>
    </div>

    <!-- قائمة عرض القصص -->
    <div id="stories-list"></div>
</div>

<!-- نافذة التعديل (Modal) -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-body">
        <h3>تعديل القصة</h3>
        <input type="hidden" id="edit-id">
        <label>عنوان القصة:</label>
        <input type="text" id="edit-title">
        <label>رابط الصورة:</label>
        <input type="url" id="edit-image">
        <label>محتوى القصة:</label>
        <textarea id="edit-content" rows="6"></textarea>
        
        <div style="text-align: left; margin-top: 10px;">
            <button class="btn btn-close" onclick="closeEditModal()">إلغاء</button>
            <button class="btn btn-add" style="width:auto;" onclick="saveStoryEdit()">حفظ التغييرات</button>
        </div>
    </div>
</div>

<script>
    // 1. إعدادات Firebase (ضع مفاتيحك الخاصة هنا)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // تهيئة Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. جلب وتحديث القصص تلقائياً من Firestore
    db.collection("stories").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const listDiv = document.getElementById("stories-list");
        listDiv.innerHTML = "";

        snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;

            const card = document.createElement("div");
            card.className = "story-card";
            card.innerHTML = `
                ${data.imageUrl ? `<img src="${data.imageUrl}" class="story-img" alt="صورة القصة" onerror="this.style.display='none'">` : ''}
                <h2 class="story-title">${escapeHtml(data.title)}</h2>
                <div class="story-content" id="content-${id}">${escapeHtml(data.content)}</div>
                
                <div class="actions">
                    <button class="btn btn-audio" id="audio-btn-${id}" onclick="toggleAudio('${id}')">🔊 استمع للقصة</button>
                    <button class="btn btn-edit" onclick="openEditModal('${id}', \`${escapeHtml(data.title)}\`, \`${escapeHtml(data.content)}\`, '${data.imageUrl || ''}')">✏️ تعديل</button>
                    <button class="btn btn-delete" onclick="deleteStory('${id}')">🗑️ حذف</button>
                </div>
            `;
            listDiv.appendChild(card);
        });
    });

    // 3. إضافة قصة جديدة
    async function addStory() {
        const title = document.getElementById("new-title").value.trim();
        const imageUrl = document.getElementById("new-image").value.trim();
        const content = document.getElementById("new-content").value.trim();

        if (!title || !content) {
            alert("يرجى إدخال العنوان والمحتوى.");
            return;
        }

        try {
            await db.collection("stories").add({
                title: title,
                imageUrl: imageUrl,
                content: content,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById("new-title").value = "";
            document.getElementById("new-image").value = "";
            document.getElementById("new-content").value = "";
            alert("تم نشر القصة بنجاح!");
        } catch (error) {
            alert("حدث خطأ أثناء إضافة القصة: " + error.message);
        }
    }

    // 4. فتح واغلاق نافذة التعديل
    function openEditModal(id, title, content, imageUrl) {
        document.getElementById("edit-id").value = id;
        document.getElementById("edit-title").value = title;
        document.getElementById("edit-content").value = content;
        document.getElementById("edit-image").value = imageUrl;
        document.getElementById("edit-modal").style.display = "flex";
    }

    function closeEditModal() {
        document.getElementById("edit-modal").style.display = "none";
    }

    // 5. حفظ تعديل القصة
    async function saveStoryEdit() {
        const id = document.getElementById("edit-id").value;
        const newTitle = document.getElementById("edit-title").value.trim();
        const newImage = document.getElementById("edit-image").value.trim();
        const newContent = document.getElementById("edit-content").value.trim();

        if (!newTitle || !newContent) {
            alert("لا يمكن ترك العنوان أو المحتوى فارغاً.");
            return;
        }

        try {
            await db.collection("stories").doc(id).update({
                title: newTitle,
                imageUrl: newImage,
                content: newContent,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeEditModal();
            alert("تم حفظ التعديلات بنجاح!");
        } catch (error) {
            alert("حدث خطأ أثناء التعديل: " + error.message);
        }
    }

    // 6. حذف القصة
    async function deleteStory(id) {
        if (confirm("هل أنت تأكد من رغبتك في حذف هذه القصة؟")) {
            await db.collection("stories").doc(id).delete();
        }
    }

    // 7. القراءة الصوتية (ResponsiveVoice)
    let currentSpeakingId = null;

    function toggleAudio(id) {
        const btn = document.getElementById(`audio-btn-${id}`);
        const contentText = document.getElementById(`content-${id}`).innerText;

        if (typeof responsiveVoice === 'undefined') {
            alert("محرك الصوت جاري تحضيره، يرجى الانتظار ثوانٍ ثم المحاولة.");
            return;
        }

        if (currentSpeakingId === id) {
            responsiveVoice.cancel();
            btn.innerText = "🔊 استمع للقصة";
            currentSpeakingId = null;
        } else {
            responsiveVoice.cancel();
            if (currentSpeakingId) {
                const prevBtn = document.getElementById(`audio-btn-${currentSpeakingId}`);
                if (prevBtn) prevBtn.innerText = "🔊 استمع للقصة";
            }

            responsiveVoice.speak(contentText, "Arabic Male", {
                pitch: 1,
                rate: 0.85,
                onstart: () => {
                    currentSpeakingId = id;
                    btn.innerText = "⏹️ إيقاف الصوت";
                },
                onend: () => {
                    btn.innerText = "🔊 استمع للقصة";
                    currentSpeakingId = null;
                }
            });
        }
    }

    // دالة حماية لحجب الأكواد الضارة
    function escapeHtml(text) {
        return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
</body>
</html>
