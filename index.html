<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية - إضافة قصة</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121824; color: #ffffff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; }
        
        .modal-card {
            background-color: #1e2638;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #2e3a52;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-card h2 { color: #ffffff; margin-top: 0; margin-bottom: 5px; font-size: 1.5rem; text-align: center; }
        .modal-subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; text-align: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2e3a52;
            background-color: #121824;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #e2b714; }
        .form-group textarea { height: 110px; resize: vertical; }

        .btn-submit {
            width: 100%;
            background-color: #e2b714;
            color: #121824;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #c9a20d; }
        .btn-submit:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="modal-card">
        <h2>إضافة قصة جديدة ✍️</h2>
        <p class="modal-subtitle">شارِك قصتك لتُحفظ في منصة حكاية وجدول البيانات</p>

        <div class="form-group">
            <label for="author">اسم الكاتب</label>
            <input type="text" id="author" placeholder="أدخل اسمك هنا...">
        </div>

        <div class="form-group">
            <label for="title">عنوان القصة</label>
            <input type="text" id="title" placeholder="أدخل عنوان القصة...">
        </div>

        <div class="form-group">
            <label for="category">تصنيف القصة</label>
            <select id="category">
                <option value="واقعية">واقعية</option>
                <option value="خيالية">خيالية</option>
                <option value="تاريخية">تاريخية</option>
                <option value="رعب">رعب</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="content">نص القصة الكامل</label>
            <textarea id="content" placeholder="اكتب قصتك هنا..."></textarea>
        </div>

        <div class="form-group">
            <label for="relation">الصلة (صلتك بالقصة)</label>
            <input type="text" id="relation" placeholder="مثال: حدثت معي، سمعتها من صديق...">
        </div>

        <button id="submit-btn" class="btn-submit" onclick="addStory()">🚀 نشر القصة الآن</button>
    </div>
</div>

<script>
    // تهيئة Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
        authDomain: "hikaya-5ff25.firebaseapp.com",
        databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
        projectId: "hikaya-5ff25",
        storageBucket: "hikaya-5ff25.firebasestorage.app",
        messagingSenderId: "1031922678593",
        appId: "1:1031922678593:web:c242a9e36ad40becc9bfc0",
        measurementId: "G-KR76L2WSZ7"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzWwfbplJcDgArVhtKLcQZ3u_TLbKcsbUBQmW9jmnjPhEqy7vzxYGFf4aBlu63rPFWl/exec";

    async function addStory() {
        const authorInput = document.getElementById("author");
        const titleInput = document.getElementById("title");
        const categoryInput = document.getElementById("category");
        const contentInput = document.getElementById("content");
        const relationInput = document.getElementById("relation");
        const submitBtn = document.getElementById("submit-btn");

        const author = authorInput.value.trim() || "زائر";
        const title = titleInput.value.trim();
        const category = categoryInput.value;
        const content = contentInput.value.trim();
        const relation = relationInput.value.trim() || "غير محدد";

        if (!title || !content) {
            alert("يرجى كتابة عنوان القصة ونصها الكامل أولاً.");
            return;
        }

        try {
            submitBtn.innerText = "جاري النشر...";
            submitBtn.disabled = true;

            // حفظ في Firebase
            await db.collection("stories").add({
                author: author,
                title: title,
                category: category,
                content: content,
                relation: relation,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // إرسال لـ Google Sheets
            fetch(GOOGLE_SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    author: author,
                    title: title,
                    category: category,
                    content: content,
                    relation: relation
                })
            });

            authorInput.value = "";
            titleInput.value = "";
            contentInput.value = "";
            relationInput.value = "";

            alert("تم نشر القصة وإضافتها لـ Google Sheets بنجاح!");
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء حفظ القصة: " + error.message);
        } finally {
            submitBtn.innerText = "🚀 نشر القصة الآن";
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
