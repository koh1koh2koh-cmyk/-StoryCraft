<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكاية - الصفحة الرئيسية</title>
</head>
<body style="background-color: #121824; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 0 0 50px 0; direction: rtl;">

    <!-- الهيدر الشامل -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; background-color: #1e2638; border-bottom: 1px solid #2e3a52;">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="logo.png" alt="حكاية HIKAYA" style="height: 55px; border-radius: 8px; background: #fff; padding: 2px;">
        </a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" style="color: #e2b714; text-decoration: none; font-weight: bold; font-size: 0.9rem;">الرئيسية</a>
            <a href="submit.html" style="color: #cbd5e1; text-decoration: none; font-size: 0.9rem;">شارك قصتك ✍️</a>
        </div>
    </header>

    <!-- الهيرو / القسم الترحيبي -->
    <section style="text-align: center; padding: 40px 20px; background-color: #182030; border-bottom: 1px solid #2e3a52;">
        <h1 style="color: #ffffff; font-size: 2rem; margin-bottom: 10px;">منصة حكاية للقصص والروايات 📖</h1>
        <p style="color: #94a3b8; font-size: 1rem; max-width: 600px; margin: 0 auto 20px auto;">
            استمتع بقراءة أحدث القصص المميزة أو شارك إبداعك الأدبي مع القراء حول العالم!
        </p>
        <a href="submit.html" style="display: inline-block; background-color: #e2b714; color: #121824; text-decoration: none; padding: 10px 24px; border-radius: 8px; font-weight: bold;">
            انشر قصتك الآن 🚀
        </a>
    </section>

    <!-- قسم عرض القصص المقبولة تلقائياً -->
    <main style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <h2 style="color: #ffffff; font-size: 1.5rem; margin-bottom: 20px; text-align: center;">أحدث القصص المنشورة ✨</h2>

        <!-- حاوية عرض القصص المجلوبة من Google Sheets -->
        <div id="stories-container" style="display: grid; gap: 20px;">
            <p style="color: #94a3b8; text-align: center;">جاري تحميل القصص المنشورة...</p>
        </div>
    </main>

    <!-- كود جلب البيانات تلقائياً عند تغيير الحالة إلى "مقبول" -->
    <script>
        // ID جدول Google Sheets الخاص بك
        const sheetID = "1372MSEs4QJJH4LCo1FDw1gxd5SAOA854YRK0prIs7t0";
        const fetchURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

        fetch(fetchURL)
            .then(res => res.text())
            .then(data => {
                // تنظيف الاستجابة القادمة من جوجل وتحويلها لنص مجرد
                const json = JSON.parse(data.substring(47, data.length - 2));
                const rows = json.table.rows;
                const container = document.getElementById("stories-container");
                container.innerHTML = "";

                let hasStories = false;

                rows.forEach(row => {
                    // ترتيب الأعمدة: [0: التاريخ, 1: الاسم, 2: العنوان, 3: التصنيف, 4: النص, 5: الحالة]
                    const author = (row.c[1] && row.c[1].v) ? row.c[1].v : "مجهول";
                    const title = (row.c[2] && row.c[2].v) ? row.c[2].v : "بدون عنوان";
                    const category = (row.c[3] && row.c[3].v) ? row.c[3].v : "عام";
                    const content = (row.c[4] && row.c[4].v) ? row.c[4].v : "";
                    const status = (row.c[5] && row.c[5].v) ? row.c[5].v : "";

                    // التحقق من أن القصة مضاف لها حالة "مقبول"
                    if (status.trim() === "مقبول") {
                        hasStories = true;
                        container.innerHTML += `
                            <div style="background-color: #1e2638; border-radius: 12px; padding: 25px; border: 1px solid #2e3a52; text-align: right; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
                                <span style="color: #e2b714; font-size: 0.85rem; font-weight: bold; background-color: #121824; padding: 4px 10px; border-radius: 6px; border: 1px solid #2e3a52;">${category}</span>
                                <h3 style="color: #ffffff; font-size: 1.4rem; margin: 15px 0 10px 0;">${title}</h3>
                                <p style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.8; white-space: pre-line;">${content}</p>
                                <div style="color: #64748b; font-size: 0.85rem; margin-top: 15px; border-top: 1px solid #2e3a52; padding-top: 10px; display: flex; justify-content: space-between;">
                                    <span>بقلم: <strong style="color: #94a3b8;">${author}</strong></span>
                                </div>
                            </div>
                        `;
                    }
                });

                if (!hasStories) {
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد قصص معروضة حالياً.</p>';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById("stories-container").innerHTML = '<p style="color: #ef4444; text-align: center;">تعذر تحميل القصص، تأكد من مشاركة الجدول كـ "عام".</p>';
            });
    </script>
</body>
</html>
