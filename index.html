<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --border-color: #334155;
            --font-main: 'Cairo', sans-serif;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            --story-font-size: 1.1rem;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .reading-progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 1000;
        }
        .reading-progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.1s ease;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: var(--shadow-sm);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-auth {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-auth:hover {
            background-color: var(--accent-hover);
        }

        .container {
            max-width: 1440px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .main-layout {
            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
        }

        aside {
            width: 380px;
            flex-shrink: 0;
            position: sticky;
            top: 5.5rem;
            max-height: calc(100vh - 7rem);
            overflow-y: auto;
            padding-bottom: 1rem;
        }

        main {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }
            aside {
                width: 100%;
                position: relative;
                top: 0;
                max-height: none;
            }
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            border-right: 5px solid var(--accent-color);
            padding-right: 10px;
            margin-bottom: 1rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .publish-box, .author-folder-box, .resume-reading-box {
            background-color: var(--bg-card);
            padding: 1.4rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.2rem;
        }

        .resume-reading-box {
            border-right: 4px solid var(--accent-color);
            display: none;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input, 
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, 
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .folder-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .folder-item {
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .folder-item:hover {
            border-color: var(--accent-color);
        }

        /* حزمة القصة */
        .story-bundle-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-top: 0 !important; /* إلغاء أي هامش علوي مفاجئ */
        }

        .bundle-title {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
        }

        .story-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem 0 0.5rem 0;
            margin-top: 1rem;
            border-top: 1px dashed var(--border-color);
            width: 100%;
            position: relative;
        }

        .story-card:first-of-type {
            border-top: none;
            padding-top: 0.5rem;
        }

        .story-card h3 {
            color: var(--accent-color);
            margin-bottom: 0.4rem;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .story-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .story-author {
            font-size: 0.88rem;
            color: var(--accent-color);
            font-weight: 700;
            background: rgba(245, 158, 11, 0.1);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        .read-time-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .story-text {
            font-size: var(--story-font-size);
            line-height: 2.2;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            width: 100%;
            margin-top: 10px;
        }

        .reading-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .tool-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .tool-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 700;
            position: absolute;
            top: 1rem;
            left: 0;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }

        .like-btn {
            background: var(--bg-input);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .like-btn:hover {
            background: #ef4444;
            color: #fff;
        }

        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            margin-top: 3rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="reading-progress-container">
        <div class="reading-progress-bar" id="readingProgressBar"></div>
    </div>

    <header>
        <h1 onclick="renderStories()">منصة حكاية</h1>
        <div class="header-actions">
            <button class="btn-auth" id="themeToggle" title="تغيير المظهر">🌙 المظهر</button>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            
            <aside>
                <div class="resume-reading-box" id="resumeReadingBox">
                    <h2 class="section-title" style="font-size: 1.05rem;">🔖 متابعة القراءة</h2>
                    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 10px;" id="resumeStoryText">توقفت عند قراءة: -</p>
                    <button class="btn-primary" style="font-size:0.85rem; padding: 6px 12px;" id="resumeStoryBtn">الانتقال للفصل مباشرة</button>
                </div>

                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group">
                            <input type="text" id="storyTitle" placeholder="عنوان القصة الرئيسي (مثال: رحلة غارلون)" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="authorName" placeholder="اسم الكاتب" required>
                        </div>
                        <div class="form-group">
                            <select id="storyPartNumber">
                                <option value="الجزء الأول">الجزء الأول</option>
                                <option value="الجزء الثاني">الجزء الثاني</option>
                                <option value="الجزء الثالث">الجزء الثالث</option>
                                <option value="الجزء الرابع">الجزء الرابع</option>
                                <option value="الجزء الخامس">الجزء الخامس</option>
                                <option value="قصة مستقلة">قصة مستقلة / كاملة</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <textarea id="storyContent" placeholder="اكتب نص القصة أو الجزء هنا..." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">نشر القصة الآن</button>
                    </form>
                </div>

                <div class="author-folder-box">
                    <h2 class="section-title" style="font-size: 1.05rem;">📁 مجلد أجزاء الكاتب</h2>
                    <div class="form-group" style="margin-bottom: 6px;">
                        <input type="text" id="folderSearchInput" placeholder="ابحث باسم الكاتب لعرض أرشيفه...">
                    </div>
                    <div class="folder-list" id="authorFolderList">
                        <div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding: 6px;">أدخل اسم الكاتب لعرض أرشيفه</div>
                    </div>
                </div>
            </aside>

            <main>
                <h2 class="section-title">
                    أحدث القصص والروايات المنشورة
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="globalSearchInput" placeholder="🔍 ابحث في القصص..." style="padding: 4px 10px; font-size: 0.85rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); outline: none;">
                        <button class="btn-auth" onclick="renderStories()" style="font-size: 0.8rem; padding: 4px 10px;">عرض الكل</button>
                    </div>
                </h2>
                <div id="stories-container"></div>
            </main>

        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © منصة حكاية 2026</p>
    </footer>

    <script>
        // إدارة التخزين المحلي بدلاً من السحابي
        const STORAGE_KEY = 'hikaya_local_stories';

        function getLocalStories() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveLocalStories(storiesList) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(storiesList));
        }

        // التبديل بين وضع الليل والنهار
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.body.removeAttribute('data-theme');
                themeToggleBtn.textContent = '🌙 المظهر';
            } else {
                document.body.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = '☀️ المظهر';
            }
        });

        // ترتيب الأجزاء
        const partOrder = {
            'الجزء الأول': 1,
            'الجزء الثاني': 2,
            'الجزء الثالث': 3,
            'الجزء الرابع': 4,
            'الجزء الخامس': 5,
            'قصة مستقلة': 6
        };

        function groupStoriesByTitle(storyList) {
            const groups = {};
            storyList.forEach(item => {
                const key = (item.title || 'بدون عنوان').trim() + '___' + (item.author || 'مجهول').trim();
                if (!groups[key]) {
                    groups[key] = [];
                }
                groups[key].push(item);
            });

            Object.keys(groups).forEach(key => {
                groups[key].sort((a, b) => {
                    const orderA = partOrder[a.part] || 99;
                    const orderB = partOrder[b.part] || 99;
                    return orderA - orderB;
                });
            });

            return groups;
        }

        // عرض القصص والأجزاء مباشرة بدون مشاكل اختفاء
        function renderStories(filterText = '') {
            const container = document.getElementById('stories-container');
            container.innerHTML = '';

            let stories = getLocalStories();

            if (filterText) {
                const q = filterText.toLowerCase();
                stories = stories.filter(s => 
                    (s.title && s.title.toLowerCase().includes(q)) || 
                    (s.author && s.author.toLowerCase().includes(q)) || 
                    (s.content && s.content.toLowerCase().includes(q))
                );
            }

            if (stories.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px;">لا توجد قصص لعرضها حالياً. اضف قصتك الأولى!</div>';
                return;
            }

            const grouped = groupStoriesByTitle(stories);

            Object.keys(grouped).forEach(groupKey => {
                const partList = grouped[groupKey];
                const mainTitle = partList[0].title || 'بدون عنوان';
                const authorName = partList[0].author || 'مجهول';

                const bundleBox = document.createElement('div');
                bundleBox.className = 'story-bundle-box';

                let html = `<div class="bundle-title">📖 ${mainTitle}</div>`;
                html += `<div class="story-meta"><span class="story-author">الكاتب: ${authorName}</span></div>`;

                partList.forEach((item) => {
                    const words = item.content ? item.content.trim().split(/\s+/).length : 0;
                    const readMinutes = Math.max(1, Math.ceil(words / 150));
                    const partTitle = item.part ? item.part : '';

                    html += `
                        <div class="story-card" id="story-${item.id}">
                            <button class="btn-delete" onclick="deleteStory('${item.id}')">حذف</button>
                            <h3>${partTitle ? partTitle : mainTitle}</h3>
                            <div class="story-meta">
                                <span class="read-time-badge">⏱️ وقت القراءة: ${readMinutes} دقيقة</span>
                            </div>
                            <div class="reading-toolbar">
                                <button class="tool-btn" onclick="changeFontSize('${item.id}', 0.1)">أ+ تكبير الخط</button>
                                <button class="tool-btn" onclick="changeFontSize('${item.id}', -0.1)">أ- تصغير الخط</button>
                                <button class="tool-btn" onclick="bookmarkStory('${item.id}', '${item.title}', '${partTitle}')">🔖 حفظ إشارة قراءة</button>
                            </div>
                            <div class="story-text" id="text-${item.id}">${item.content}</div>
                            <button class="like-btn" onclick="likeStory('${item.id}')">
                                ❤️ إعجاب (${item.likes || 0})
                            </button>
                        </div>
                    `;
                });

                bundleBox.innerHTML = html;
                container.appendChild(bundleBox);
            });
        }

        // نشر قصة جديدة وحفظها محلياً
        document.getElementById('storyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('storyTitle').value.trim();
            const author = document.getElementById('authorName').value.trim();
            const part = document.getElementById('storyPartNumber').value;
            const content = document.getElementById('storyContent').value.trim();

            const stories = getLocalStories();
            const newStory = {
                id: 'story_' + Date.now(),
                title: title,
                author: author,
                part: part,
                content: content,
                timestamp: Date.now(),
                likes: 0
            };

            stories.push(newStory);
            saveLocalStories(stories);

            alert('تم حفظ ونشر القصة بنجاح محلياً!');
            document.getElementById('storyContent').value = '';
            renderStories();
        });

        // حذف القصة
        function deleteStory(id) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا الجزء؟')) {
                let stories = getLocalStories();
                stories = stories.filter(s => s.id !== id);
                saveLocalStories(stories);
                renderStories();
            }
        }

        // الإعجاب بالقصة
        function likeStory(id) {
            const stories = getLocalStories();
            const story = stories.find(s => s.id === id);
            if (story) {
                story.likes = (story.likes || 0) + 1;
                saveLocalStories(stories);
                renderStories();
            }
        }

        // تغيير حجم الخط
        function changeFontSize(id, delta) {
            const textElem = document.getElementById('text-' + id);
            if (textElem) {
                const currentSize = parseFloat(window.getComputedStyle(textElem).fontSize);
                textElem.style.fontSize = (currentSize + (delta * 10)) + 'px';
            }
        }

        // إشارة القراءة
        function bookmarkStory(id, title, part) {
            const bookmark = { id, title, part };
            localStorage.setItem('hikaya_bookmark', JSON.stringify(bookmark));
            checkLastBookmark();
            alert('تم حفظ موضع القراءة بنجاح!');
        }

        function checkLastBookmark() {
            const saved = localStorage.getItem('hikaya_bookmark');
            const box = document.getElementById('resumeReadingBox');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('resumeStoryText').textContent = `توقفت عند: ${data.title} (${data.part || ''})`;
                document.getElementById('resumeStoryBtn').onclick = () => {
                    const el = document.getElementById('story-' + data.id);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                    else alert('لم يتم العثور على الفصل، قد يكون تم حذفه.');
                };
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        // شريط تقدم القراءة
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('readingProgressBar').style.width = scrolled + '%';
        });

        // البحث العام وبحث المجلدات
        document.getElementById('globalSearchInput').addEventListener('input', function(e) {
            renderStories(e.target.value);
        });

        document.getElementById('folderSearchInput').addEventListener('input', function(e) {
            const authorQuery = e.target.value.trim().toLowerCase();
            const listDiv = document.getElementById('authorFolderList');
            listDiv.innerHTML = '';

            if (!authorQuery) {
                listDiv.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding: 6px;">أدخل اسم الكاتب لعرض أرشيفه</div>';
                return;
            }

            const stories = getLocalStories();
            const filteredStories = stories.filter(s => s.author && s.author.toLowerCase().includes(authorQuery));
            if (filteredStories.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding: 6px;">لا يوجد أرشيف لهذا الكاتب</div>';
                return;
            }

            filteredStories.forEach(s => {
                const item = document.createElement('div');
                item.className = 'folder-item';
                item.textContent = `${s.title} - (${s.part || 'قصة كاملة'})`;
                item.onclick = () => {
                    renderStories(s.title);
                };
                listDiv.appendChild(item);
            });
        });

        // التشغيل المبدئي عند تحميل الصفحة
        window.onload = function() {
            checkLastBookmark();
            renderStories();
        };
    </script>
</body>
</html>
