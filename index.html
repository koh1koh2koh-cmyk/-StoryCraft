<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="4c2c610424848945f2a690ccb7b9be9e">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    <!-- كود التحقق الخاص بـ Monetag -->
    <meta name="monetag" content="ضع_الكود_هنا">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --border-color: #334155;
            --font-main: 'Cairo', sans-serif;
            --wa-bg: #111b21;
            --wa-card: #202c33;
            --wa-green: #00a884;
            --wa-bubble-me: #005c4b;
            --wa-bubble-them: #202c33;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            --story-font-size: 1.1rem;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --border-color: #e2e8f0;
            --wa-bg: #efeae2;
            --wa-card: #ffffff;
            --wa-bubble-me: #d9fdd3;
            --wa-bubble-them: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .reading-progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 1000;
        }
        .reading-progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.1s ease;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: var(--shadow-sm);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }

        .btn-auth {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-auth:hover {
            background-color: var(--accent-hover);
        }

        .btn-logout {
            background-color: #ef4444;
        }
        .btn-logout:hover {
            background-color: #dc2626;
        }

        .container {
            max-width: 1440px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .main-layout {
            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
        }

        aside {
            width: 380px;
            flex-shrink: 0;
            position: sticky;
            top: 5.5rem;
            max-height: calc(100vh - 7rem);
            overflow-y: auto;
            padding-bottom: 1rem;
        }

        main {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }
            aside {
                width: 100%;
                position: relative;
                top: 0;
                max-height: none;
            }
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            border-right: 5px solid var(--accent-color);
            padding-right: 10px;
            margin-bottom: 1rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .publish-box, .author-folder-box, .resume-reading-box {
            background-color: var(--bg-card);
            padding: 1.4rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.2rem;
        }

        .resume-reading-box {
            border-right: 4px solid var(--accent-color);
            display: none;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input, 
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, 
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .folder-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .folder-item {
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .folder-item:hover {
            border-color: var(--accent-color);
        }

        .story-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.8rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            width: 100%;
            position: relative;
        }

        .story-card h3 {
            color: var(--accent-color);
            margin-bottom: 0.4rem;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .story-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .story-author {
            font-size: 0.88rem;
            color: var(--accent-color);
            font-weight: 700;
            background: rgba(245, 158, 11, 0.1);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        .read-time-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .story-text {
            font-size: var(--story-font-size);
            line-height: 2.2;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            width: 100%;
        }

        .reading-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .tool-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .tool-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 700;
            position: absolute;
            top: 2rem;
            left: 2rem;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }

        .story-bundle-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.8rem;
            margin-bottom: 1.8rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .bundle-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .parts-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .part-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .part-btn:hover, .part-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .read-all-btn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 12px;
            display: inline-block;
        }
        .read-all-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        .like-btn {
            background: var(--bg-input);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .like-btn:hover {
            background: #ef4444;
            color: #fff;
        }

        .chat-float-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            background-color: var(--wa-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 1000;
            border: none;
        }

        .chat-modal {
            position: fixed;
            bottom: 105px;
            left: 30px;
            width: 400px;
            height: 580px;
            background-color: var(--wa-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .chat-modal.open {
            display: flex;
        }

        @media (max-width: 480px) {
            .chat-modal {
                bottom: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 0;
            }
        }

        .modal-header {
            background-color: var(--wa-card);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .chat-search-box {
            padding: 12px;
            background-color: var(--wa-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-search-box input {
            width: 100%;
            padding: 9px 14px;
            background: var(--wa-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .user-item:hover {
            background-color: var(--wa-card);
        }

        .user-item img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-item .name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .user-item .sub {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .active-chat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--wa-bg);
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .active-chat.open {
            display: flex;
        }

        .chat-sub-header {
            padding: 12px 18px;
            background-color: var(--wa-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .messages-area {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.92rem;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
        }

        .msg-bubble.me {
            align-self: flex-start;
            background-color: var(--wa-bubble-me);
            color: #fff;
        }

        .msg-bubble.them {
            align-self: flex-end;
            background-color: var(--wa-bubble-them);
            color: var(--text-main);
        }

        .msg-bubble img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }

        .chat-input-row {
            padding: 12px 16px;
            background-color: var(--wa-card);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .chat-input-row input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-row button[type="submit"] {
            background: var(--wa-green);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="reading-progress-container">
        <div class="reading-progress-bar" id="readingProgressBar"></div>
    </div>

    <header>
        <h1 onclick="renderStories()">منصة حكاية</h1>
        <div class="header-actions">
            <button class="btn-auth" id="themeToggle" title="تغيير المظهر">🌙 المظهر</button>
            <div id="authBox">
                <button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            
            <aside>
                <div class="resume-reading-box" id="resumeReadingBox">
                    <h2 class="section-title" style="font-size: 1.05rem;">🔖 متابعة القراءة</h2>
                    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 10px;" id="resumeStoryText">توقفت عند قراءة: -</p>
                    <button class="btn-primary" style="font-size:0.85rem; padding: 6px 12px;" id="resumeStoryBtn">الانتقال للفصل مباشرة</button>
                </div>

                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group">
                            <input type="text" id="storyTitle" placeholder="عنوان القصة أو الجزء (مثال: رحلة غارلون)" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="authorName" placeholder="اسم الكاتب" required>
                        </div>
                        <div class="form-group">
                            <select id="storyPartNumber">
                                <option value="الجزء الأول">الجزء الأول</option>
                                <option value="الجزء الثاني">الجزء الثاني</option>
                                <option value="الجزء الثالث">الجزء الثالث</option>
                                <option value="الجزء الرابع">الجزء الرابع</option>
                                <option value="الجزء الخامس">الجزء الخامس</option>
                                <option value="قصة مستقلة">قصة مستقلة / كاملة</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <textarea id="storyContent" placeholder="اكتب نص القصة أو الجزء هنا..." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">نشر القصة الآن</button>
                    </form>
                </div>

                <div class="author-folder-box">
                    <h2 class="section-title" style="font-size: 1.05rem;">📁 مجلد أجزاء الكاتب</h2>
                    <div class="form-group" style="margin-bottom: 6px;">
                        <input type="text" id="folderSearchInput" placeholder="ابحث باسم الكاتب لعرض أجزائه...">
                    </div>
                    <div class="folder-list" id="authorFolderList">
                        <div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding: 6px;">أدخل اسم الكاتب لعرض أرشيفه</div>
                    </div>
                </div>
            </aside>

            <main>
                <h2 class="section-title">
                    أحدث القصص والروايات المنشورة
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="globalSearchInput" placeholder="🔍 ابحث في القصص..." style="padding: 4px 10px; font-size: 0.85rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); outline: none;">
                        <button class="btn-auth" onclick="renderStories()" style="font-size: 0.8rem; padding: 4px 10px;">عرض الكل</button>
                    </div>
                </h2>
                <div id="stories-container"></div>
            </main>

        </div>
    </div>

    <button class="chat-float-btn" id="chatFloatBtn" title="المحادثات والأصدقاء">💬</button>

    <div class="chat-modal" id="chatModal">
        <div class="modal-header">
            <h3>💬 المحادثات والأصدقاء</h3>
            <button class="back-btn" onclick="toggleChatModal()">✖</button>
        </div>
        <div class="chat-search-box">
            <input type="text" id="userSearchInput" placeholder="🔍 ابحث عن اسم مستخدم...">
        </div>
        <div class="modal-body">
            <div class="users-list" id="usersList"></div>
            <div class="active-chat" id="activeChat">
                <div class="chat-sub-header">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="back-btn" onclick="closeActiveChat()">➡️</button>
                        <span id="targetUserName" style="font-weight: 700; color: var(--text-main);">المحادثة</span>
                    </div>
                    <button style="background:none; border:none; color:var(--wa-green); font-size:1.3rem; cursor:pointer;" onclick="startRealCallLink()" title="بدء مكالمة فيديو">📞</button>
                </div>
                <div class="messages-area" id="messagesArea"></div>
                <form class="chat-input-row" id="chatForm">
                    <label style="cursor:pointer; font-size:1.3rem; color:var(--text-muted);" title="إرسال صورة">
                        📷
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    </label>
                    <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                    <button type="submit">إرسال</button>
                </form>
            </div>
        </div>
    </div>

    <!-- مكتبات فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
          authDomain: "hikaya-5ff25.firebaseapp.com",
          databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
          projectId: "hikaya-5ff25",
          storageBucket: "hikaya-5ff25.firebasestorage.app",

        function calculateReadTime(text) {

        function saveBookmark(storyTitle, partIndex) {

        function checkLastBookmark() {
            const saved = localStorage.getItem("hikaya_bookmark");
            const box = document.getElementById("resumeReadingBox");
            if (saved && box) {
                const b = JSON.parse(saved);
                document.getElementById("resumeStoryText").textContent = `توقفت عند: ${b.title} (${b.partIndex + 1})`;
                document.getElementById("resumeStoryBtn").onclick = () => {
                    openStoryPart(encodeURIComponent(b.title), b.partIndex);
                };
                box.style.display = "block";
            }
        }

        function renderStories(filterText = null) {
            storiesContainer.innerHTML = "";
            let displayList = stories;
            if(filterText) {
                const q = filterText.toLowerCase();
                displayList = stories.filter(s => s.author.toLowerCase().includes(q) || s.title.toLowerCase().includes(q) || s.content.toLowerCase().includes(q));
            }

            if(displayList.length === 0) {
                storiesContainer.innerHTML = '<div style="background:var(--bg-card); padding:2rem; border-radius:16px; text-align:center; color:var(--text-muted);">لا توجد قصص أو نتائج مطابقة للبحث حالياً في السحابة.</div>';
                return;
            }

            const groupedStories = {};
            displayList.forEach(story => {
                const mainTitle = story.title.trim();
                if (!groupedStories[mainTitle]) {
                    groupedStories[mainTitle] = [];
                }
                groupedStories[mainTitle].push(story);
            });

            Object.keys(groupedStories).forEach(mainTitle => {
                const parts = groupedStories[mainTitle];
                const author = parts[0].author;
                const bundleBox = document.createElement("div");
                bundleBox.className = "story-bundle-box";

                let partsButtonsHtml = '';
                parts.forEach((p, index) => {
                    partsButtonsHtml += `<button class="part-btn" onclick="openStoryPart('${encodeURIComponent(mainTitle)}', ${index})">📖 ${p.part || ('الجزء ' + (index+1))}</button>`;
                });

                bundleBox.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <h3 class="bundle-title">${mainTitle}</h3>
                            <span class="story-author">الكاتب: ${author}</span>
                        </div>
                    </div>
                    <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom: 10px;">تحتوي هذه القصة على ${parts.length} جزء/أجزاء منشورة سحابياً. اختر الجزء للقراءة أو تصفح الملف الكامل:</p>

                    </div>
                `;
                storiesContainer.appendChild(bundleBox);

        function openStoryPart(encodedTitle, partIndex) {
            const title = decodeURIComponent(encodedTitle);
            const matchingParts = stories.filter(s => s.title.trim() === title);
            const targetStory = matchingParts[partIndex];
            if (!targetStory) return;

            saveBookmark(title, partIndex);
            SilentTracker.logEvent("read_part", { storyId: targetStory.id, title: targetStory.title, part: targetStory.part });

            storiesContainer.innerHTML = "";
            const article = document.createElement("article");
            article.className = "story-card";
            
            let deleteBtnHtml = "";
            if (currentUser && targetStory.userId && (currentUser.uid === targetStory.userId || currentUser.uid === "system")) {
                deleteBtnHtml = `<button class="btn-delete" onclick="deleteStory('${targetStory.id}')">إزالة هذا الجزء</button>`;
            }

            let partsNavHtml = '<div class="parts-btn-group" style="margin-bottom:20px;">';
            matchingParts.forEach((p, idx) => {
                const activeClass = idx === partIndex ? 'active' : '';
                partsNavHtml += `<button class="part-btn ${activeClass}" onclick="openStoryPart('${encodedTitle}', ${idx})">📖 ${p.part || ('الجزء ' + (idx+1))}</button>`;
            });
            partsNavHtml += '</div>';

            const readTimeStr = calculateReadTime(targetStory.content);

            article.innerHTML = `
                ${deleteBtnHtml}
                <button class="btn-auth" onclick="renderStories()" style="margin-bottom:12px; font-size:0.8rem; padding:4px 10px;">⬅ العودة لقائمة القصص</button>

            }
            const authorStories = stories.filter(s => s.author.toLowerCase().includes(query));
            authorFolderList.innerHTML = authorStories.length === 0 ? '<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding: 6px;">لا توجد أجزاء لهذا الكاتب</div>' : '';
            
            authorStories.forEach(s => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.textContent = `📖 ${s.title} (${s.part})`;
                div.onclick = () => {
                    openStoryPart(encodeURIComponent(s.title), authorStories.indexOf(s));
                };
                authorFolderList.appendChild(div);
            });
        };
    </script>
</body>
</html>
