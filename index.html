<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryCraft - منصة القصص</title>
    
    <!-- ResponsiveVoice لقراءة النصوص صوتياً -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    
    <!-- مكتبات Firebase (الإصدار 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 25px; }
        
        /* نموذج الإضافة وبطاقات القصص */
        .story-form, .story-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .story-form h3 { margin-top: 0; color: #222; }
        
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 12px; margin: 6px 0 12px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        input[type="text"]:focus, textarea:focus { border-color: #007bff; }
        
        /* الأزرار */
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; margin-left: 5px; margin-top: 5px; }
        .btn-add { background-color: #28a745; color: white; width: 100%; font-size: 16px; padding: 12px; }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-audio { background-color: #007bff; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-close { background-color: #6c757d; color: white; }
        .btn:hover { opacity: 0.88; }

        /* عرض عناصر القصة */
        .story-img { width: 100%; max-height: 380px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .story-title { font-size: 22px; color: #111; margin-top: 0; margin-bottom: 10px; }
        .story-content { font-size: 17px; line-height: 1.8; color: #333; white-space: pre-line; word-wrap: break-word; }
        .actions { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; }

        /* النافذة المنبثقة للتعديل Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: #fff; width: 90%; max-width: 550px; padding: 25px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .image-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-top: 5px; margin-bottom: 10px; display: none; }
        
        .loading-text { text-align: center; color: #888; font-size: 16px; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 StoryCraft</h1>

    <!-- نموذج إضافة قصة جديدة -->
    <div class="story-form">
        <h3>✍️ نشر قصة جديدة</h3>
        
        <label>عنوان القصة:</label>
        <input type="text" id="new-title" placeholder="أدخل عنوان القصة...">
        
        <label>اختر صورة من جهازك (اختياري):</label>
        <input type="file" id="new-image-file" accept="image/*">
        
        <label>محتوى القصة (مع التشكيل للحصول على قراءة صوتية أفضل):</label>
        <textarea id="new-content" rows="5" placeholder="اكتب القصة هنا..."></textarea>
        
        <button class="btn btn-add" id="submit-btn" onclick="addStory()">نشر القصة</button>
    </div>

    <!-- قائمة عرض القصص -->
    <div id="stories-list">
        <p class="loading-text">جاري تحميل القصص...</p>
    </div>
</div>

<!-- نافذة تعديل القصة (Modal) -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-body">
        <h3>✏️ تعديل القصة</h3>
        <input type="hidden" id="edit-id">
        
        <label>عنوان القصة:</label>
        <input type="text" id="edit-title">
        
        <label>الصورة الحالية / تغيير الصورة من الجهاز:</label>
        <img id="edit-preview" class="image-preview" alt="معاينة الصورة">
        <input type="file" id="edit-image-file" accept="image/*">
        
        <label>محتوى القصة:</label>
        <textarea id="edit-content" rows="6"></textarea>
        
        <div style="text-align: left; margin-top: 15px;">
            <button class="btn btn-close" onclick="closeEditModal()">إلغاء</button>
            <button class="btn btn-add" id="save-edit-btn" style="width:auto;" onclick="saveStoryEdit()">حفظ التعديلات</button>
        </div>
    </div>
</div>

<script>
    // 1. إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // تهيئة Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. دالة لضغط الصورة وتقليل حجمها تلقائياً وتفادي مشكلة Firestore
    function compressAndConvertImage(file) {
        return new Promise((resolve, reject) => {
            if (!file) {
                resolve('');
                return;
            }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 700; // أقصى عرض مسموح به
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = (maxWidth / width) * height;
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    // ضغط الجودة لـ 70% للحفاظ على جودة ممتازة وحجم صغير جداً
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

    // 3. التنسق التلقائي وجلب القصص من Firestore فور حدوث أي تغيير
    db.collection("stories").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const listDiv = document.getElementById("stories-list");
        listDiv.innerHTML = "";

        if (snapshot.empty) {
            listDiv.innerHTML = "<p class='loading-text'>لا توجد قصص حالياً. كن أول من ينشر قصة!</p>";
            return;
        }

        snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;

            const card = document.createElement("div");
            card.className = "story-card";
            card.innerHTML = `
                ${data.imageUrl ? `<img src="${data.imageUrl}" class="story-img" alt="صورة القصة" onerror="this.style.display='none'">` : ''}
                <h2 class="story-title">${escapeHtml(data.title)}</h2>
                <div class="story-content" id="content-${id}">${escapeHtml(data.content)}</div>
                
                <div class="actions">
                    <button class="btn btn-audio" id="audio-btn-${id}" onclick="toggleAudio('${id}')">🔊 استمع للقصة</button>
                    <button class="btn btn-edit" onclick="openEditModal('${id}', \`${escapeHtml(data.title)}\`, \`${escapeHtml(data.content)}\`, '${data.imageUrl || ''}')">✏️ تعديل</button>
                    <button class="btn btn-delete" onclick="deleteStory('${id}')">🗑️ حذف</button>
                </div>
            `;
            listDiv.appendChild(card);
        });
    }, (error) => {
        console.error("خطأ في جلب البيانات:", error);
        document.getElementById("stories-list").innerHTML = "<p class='loading-text' style='color:red;'>حدث خطأ أثناء تحميل القصص. تأكد من إعدادات Firebase.</p>";
    });

    // 4. إضافة قصة جديدة
    async function addStory() {
        const titleInput = document.getElementById("new-title");
        const contentInput = document.getElementById("new-content");
        const fileInput = document.getElementById("new-image-file");
        const submitBtn = document.getElementById("submit-btn");

        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const file = fileInput.files[0];

        if (!title || !content) {
            alert("يرجى كتابة عنوان ومحتوى القصة.");
            return;
        }

        try {
            submitBtn.innerText = "جاري رفع القصة...";
            submitBtn.disabled = true;

            // ضغط وتحويل الصورة إن وجدت
            let imageUrl = '';
            if (file) {
                imageUrl = await compressAndConvertImage(file);
            }

            // الحفظ في قاعدة البيانات
            await db.collection("stories").add({
                title: title,
                imageUrl: imageUrl,
                content: content,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // تفريغ المدخلات بعد النجاح
            titleInput.value = "";
            contentInput.value = "";
            fileInput.value = "";
            alert("تم نشر القصة بنجاح!");
        } catch (error) {
            console.error("خطأ عند إضافة القصة:", error);
            alert("حدث خطأ أثناء النشر: " + error.message);
        } finally {
            submitBtn.innerText = "نشر القصة";
            submitBtn.disabled = false;
        }
    }

    // 5. التحكم بفتحات وإغلاق نافذة التعديل
    let currentStoryImage = '';

    function openEditModal(id, title, content, imageUrl) {
        document.getElementById("edit-id").value = id;
        document.getElementById("edit-title").value = title;
        document.getElementById("edit-content").value = content;
        document.getElementById("edit-image-file").value = "";
        
        currentStoryImage = imageUrl;
        const preview = document.getElementById("edit-preview");
        if (imageUrl) {
            preview.src = imageUrl;
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }

        document.getElementById("edit-modal").style.display = "flex";
    }

    function closeEditModal() {
        document.getElementById("edit-modal").style.display = "none";
    }

    // 6. حفظ التعديل على القصة
    async function saveStoryEdit() {
        const id = document.getElementById("edit-id").value;
        const newTitle = document.getElementById("edit-title").value.trim();
        const newContent = document.getElementById("edit-content").value.trim();
        const fileInput = document.getElementById("edit-image-file");
        const saveBtn = document.getElementById("save-edit-btn");
        const file = fileInput.files[0];

        if (!newTitle || !newContent) {
            alert("لا يمكن ترك العنوان أو المحتوى فارغاً.");
            return;
        }

        try {
            saveBtn.innerText = "جاري الحفظ...";
            saveBtn.disabled = true;

            let finalImage = currentStoryImage;
            if (file) {
                finalImage = await compressAndConvertImage(file);
            }

            await db.collection("stories").doc(id).update({
                title: newTitle,
                imageUrl: finalImage,
                content: newContent,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeEditModal();
            alert("تم حفظ التغييرات بنجاح!");
        } catch (error) {
            console.error("خطأ في التعديل:", error);
            alert("حدث خطأ أثناء حفظ التغييرات: " + error.message);
        } finally {
            saveBtn.innerText = "حفظ التغييرات";
            saveBtn.disabled = false;
        }
    }

    // 7. حذف قصة
    async function deleteStory(id) {
        if (confirm("هل أنت متأكد من رغبتك في حذف هذه القصة؟")) {
            try {
                await db.collection("stories").doc(id).delete();
            } catch (error) {
                alert("حدث خطأ أثناء الحذف: " + error.message);
            }
        }
    }

    // 8. القراءة الصوتية (ResponsiveVoice)
    let currentSpeakingId = null;

    function toggleAudio(id) {
        const btn = document.getElementById(`audio-btn-${id}`);
        const contentText = document.getElementById(`content-${id}`).innerText;

        if (typeof responsiveVoice === 'undefined') {
            alert("جاري تحضير محرك الصوت، يُرجى الانتظار ثوانٍ ثم إعادة المحاولة.");
            return;
        }

        if (currentSpeakingId === id) {
            responsiveVoice.cancel();
            btn.innerText = "🔊 استمع للقصة";
            currentSpeakingId = null;
        } else {
            responsiveVoice.cancel();
            if (currentSpeakingId) {
                const prevBtn = document.getElementById(`audio-btn-${currentSpeakingId}`);
                if (prevBtn) prevBtn.innerText = "🔊 استمع للقصة";
            }

            responsiveVoice.speak(contentText, "Arabic Male", {
                pitch: 1,
                rate: 0.85,
                onstart: () => {
                    currentSpeakingId = id;
                    btn.innerText = "⏹️ إيقاف الصوت";
                },
                onend: () => {
                    btn.innerText = "🔊 استمع للقصة";
                    currentSpeakingId = null;
                }
            });
        }
    }

    // دالة حماية
    function escapeHtml(text) {
        return text ? text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
</body>
</html>
