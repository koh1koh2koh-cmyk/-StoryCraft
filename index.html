<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-gold: #e2b714;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --text-body: #cbd5e1;
            --border-color: #334155;
            --danger-color: #ef4444;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.6; }

        header {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 8%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { background: var(--accent-gold); color: var(--bg-main); width: 42px; height: 42px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .logo-text { font-size: 1.8rem; font-weight: 900; color: var(--accent-gold); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold), #b89200);
            color: var(--bg-main); padding: 10px 22px; border-radius: var(--radius-sm);
            font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px;
        }

        .container { max-width: 1080px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }

        .controls-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 20px; margin-bottom: 30px;
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center;
        }

        .search-box { flex: 1; min-width: 280px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 45px 12px 15px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-white); outline: none;
        }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .filter-tags { display: flex; gap: 10px; flex-wrap: wrap; }
        .tag-btn {
            background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 8px 18px; border-radius: 25px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
        }
        .tag-btn.active, .tag-btn:hover { background: var(--accent-gold); color: var(--bg-main); border-color: var(--accent-gold); font-weight: 700; }

        .stories-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }

        .story-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 28px; transition: var(--transition);
        }

        .story-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .story-title { font-size: 1.5rem; color: var(--text-white); font-weight: 700; cursor: pointer; }
        .story-title:hover { color: var(--accent-gold); }
        .category-badge { background: rgba(226, 183, 20, 0.1); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .story-meta { display: flex; gap: 20px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px; }
        .story-content { color: var(--text-body); line-height: 1.8; font-size: 1.05rem; margin-bottom: 22px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .story-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 18px; }
        .action-btns { display: flex; gap: 15px; }
        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.95rem; text-decoration: none; }
        .action-btn.liked { color: var(--danger-color); }
        .read-more-btn { color: var(--accent-gold); font-weight: 700; cursor: pointer; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: var(--transition); padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto; padding: 35px; position: relative; }
        .close-modal { position: absolute; top: 20px; left: 20px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }

        .loading-state, .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 45px; height: 45px; border-radius: 50%; border-left-color: var(--accent-gold); animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer { background: var(--bg-card); border-top: 1px solid var(--border-color); text-align: center; padding: 25px 20px; color: var(--text-muted); margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-book-open"></i></div>
            <span class="logo-text">حكاية</span>
        </a>
        <a href="submit.html" class="btn-primary"><i class="fa-solid fa-pen-nib"></i> انشر قصتك</a>
    </header>

    <div class="container">
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="renderStories()" placeholder="ابحث في القصص...">
            </div>
            <div class="filter-tags">
                <button class="tag-btn active" onclick="filterCategory('الكل', this)">✨ الكل</button>
                <button class="tag-btn" onclick="filterCategory('واقعية', this)">📖 واقعية</button>
                <button class="tag-btn" onclick="filterCategory('خيالية', this)">🔮 خيالية</button>
                <button class="tag-btn" onclick="filterCategory('رعب', this)">👻 رعب</button>
            </div>
        </div>

        <div id="storiesGrid" class="stories-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>جاري تحميل القصص...</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="storyModal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeStoryModal()"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 منصة حكاية - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        // الرابط الجديد الخاص بك
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzytiqTfBAaAMqGefmPn6z_yxbJj-Kliw3pSAtB6U7IRoCVzl1xxfm6Hyfhx-Q1UCuv/exec';

        let allStories = [];
        let currentCategory = 'الكل';

        function loadStories() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        allStories = data.map((item, index) => ({
                            id: 'story_' + index,
                            title: item.title || 'قصة بدون عنوان',
                            author: item.author || 'كاتب مجهول',
                            relation: item.relation || 'عام',
                            content: item.content || '',
                            category: item.category || 'واقعية',
                            likes: Math.floor(Math.random() * 10) + 2
                        })).reverse();
                        renderStories();
                    } else {
                        throw new Error('بيانات غير مقبولة');
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById("storiesGrid").innerHTML = `
                        <div class="empty-state">
                            <p>تعذر تحميل البيانات، جاري المتابعة...</p>
                        </div>
                    `;
                });
        }

        function renderStories() {
            const grid = document.getElementById("storiesGrid");
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            grid.innerHTML = "";

            const filtered = allStories.filter(story => {
                const matchCat = (currentCategory === 'الكل') || (story.category === currentCategory);
                const matchQuery = story.title.toLowerCase().includes(query) || 
                                   story.content.toLowerCase().includes(query) || 
                                   story.author.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><p>لا توجد قصص مطابقة.</p></div>`;
                return;
            }

            filtered.forEach(story => {
                const liked = isLiked(story.id);
                const card = document.createElement("div");
                card.className = "story-card";
                
                card.innerHTML = `
                    <div class="story-header">
                        <h2 class="story-title" onclick="openStoryModal('${story.id}')">${escapeHTML(story.title)}</h2>
                        <span class="category-badge">${escapeHTML(story.category)}</span>
                    </div>
                    <div class="story-meta">
                        <span><i class="fa-solid fa-user-pen"></i> ${escapeHTML(story.author)}</span>
                        <span><i class="fa-solid fa-link"></i> ${escapeHTML(story.relation)}</span>
                    </div>
                    <div class="story-content">${escapeHTML(story.content)}</div>
                    <div class="story-footer">
                        <div class="action-btns">
                            <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${story.id}', this)">
                                <i class="fa-solid fa-heart"></i> <span>${story.likes + (liked ? 1 : 0)}</span>
                            </button>
                        </div>
                        <div class="read-more-btn" onclick="openStoryModal('${story.id}')">
                            قراءة كاملة <i class="fa-solid fa-arrow-left"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderStories();
        }

        function isLiked(id) {
            return JSON.parse(localStorage.getItem('liked_stories') || '[]').includes(id);
        }

        function toggleLike(id, btn) {
            let likedList = JSON.parse(localStorage.getItem('liked_stories') || '[]');
            if (likedList.includes(id)) return;

            likedList.push(id);
            localStorage.setItem('liked_stories', JSON.stringify(likedList));
            btn.classList.add('liked');
            const countSpan = btn.querySelector('span');
            countSpan.innerText = parseInt(countSpan.innerText) + 1;
        }

        function openStoryModal(id) {
            const story = allStories.find(s => s.id === id);
            if (!story) return;

            const modal = document.getElementById('storyModal');
            document.getElementById('modalContent').innerHTML = `
                <span class="category-badge" style="margin-bottom: 12px; display: inline-block;">${escapeHTML(story.category)}</span>
                <h1 style="font-size: 1.8rem; margin-bottom: 12px;">${escapeHTML(story.title)}</h1>
                <div class="story-meta">
                    <span>✍️ الكاتب: ${escapeHTML(story.author)}</span>
                    <span>🔗 المصدر: ${escapeHTML(story.relation)}</span>
                </div>
                <div style="line-height: 1.9; font-size: 1.1rem; color: var(--text-body); white-space: pre-wrap; margin: 20px 0;">${escapeHTML(story.content)}</div>
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeStoryModal() {
            document.getElementById('storyModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        loadStories();
    </script>
</body>
</html>
