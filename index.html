<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-gold: #e2b714;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --text-body: #cbd5e1;
            --border-color: #334155;
            --danger-color: #ef4444;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.6; }

        header {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 8%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { background: var(--accent-gold); color: var(--bg-main); width: 42px; height: 42px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .logo-text { font-size: 1.8rem; font-weight: 900; color: var(--accent-gold); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold), #b89200);
            color: var(--bg-main); padding: 10px 22px; border-radius: var(--radius-sm);
            font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px;
        }

        .container { max-width: 1080px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }

        .controls-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 20px; margin-bottom: 30px;
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center;
        }

        .search-box { flex: 1; min-width: 280px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 45px 12px 15px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-white); outline: none;
        }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .stories-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }

        .story-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 28px; transition: var(--transition);
        }

        .story-title { font-size: 1.5rem; color: var(--accent-gold); font-weight: 700; margin-bottom: 10px; }
        .story-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; display: flex; gap: 15px; }
        .story-content { color: var(--text-body); font-size: 1.05rem; white-space: pre-wrap; line-height: 1.8; }

        .loading-state, .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); width: 40px; height: 40px;
            border-radius: 50%; border-left-color: var(--accent-gold); animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer { background: var(--bg-card); border-top: 1px solid var(--border-color); text-align: center; padding: 20px; color: var(--text-muted); margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-book-open"></i></div>
            <span class="logo-text">حكاية</span>
        </a>
        <a href="submit.html" class="btn-primary"><i class="fa-solid fa-pen-nib"></i> انشر قصتك</a>
    </header>

    <div class="container">
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="renderStories()" placeholder="ابحث في القصص...">
            </div>
        </div>

        <div id="storiesGrid" class="stories-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>جاري تحميل القصص من جدول البيانات...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 منصة حكاية - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        const SHEET_ID = '1372MSEs4QJJH4LQO1FDw1gxd5SAOA854YRK0prls7t0';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        let allStories = [];

        // جلب البيانات المباشر والمنظم
        fetch(SHEET_URL)
            .then(res => res.text())
            .then(data => {
                // تنظيف الاستجابة للحصول على JSON صالح
                const json = JSON.parse(data.substring(47, data.length - 2));
                const rows = json.table.rows;

                allStories = rows.map((row, index) => {
                    const c = row.c;
                    return {
                        id: index,
                        time: c[0] ? c[0].v : '',
                        title: c[1] ? c[1].v : 'قصة بدون عنوان',
                        author: c[2] ? c[2].v : 'كاتب مجهول',
                        relation: c[3] ? c[3].v : '',
                        content: c[4] ? c[4].v : (c[1] ? c[1].v : '') // للتعامل مع اختلاف ترتيب الأعمدة
                    };
                }).reverse(); // لعرض أحدث القصص أولاً

                renderStories();
            })
            .catch(err => {
                console.error("Error loading sheet:", err);
                document.getElementById("storiesGrid").innerHTML = `
                    <div class="empty-state">
                        <p>تعذر جلب القصص. تأكد من إعدادات المشاركة في Google Sheets وأنها ممتدة لـ (Anyone with link).</p>
                    </div>
                `;
            });

        function renderStories() {
            const grid = document.getElementById("storiesGrid");
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            grid.innerHTML = "";

            const filtered = allStories.filter(s => 
                (s.title && s.title.toLowerCase().includes(query)) ||
                (s.content && s.content.toLowerCase().includes(query)) ||
                (s.author && s.author.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><p>لا توجد قصص متطابقة حالياً.</p></div>`;
                return;
            }

            filtered.forEach(story => {
                const card = document.createElement("div");
                card.className = "story-card";
                card.innerHTML = `
                    <h2 class="story-title">${escapeHTML(story.title)}</h2>
                    <div class="story-meta">
                        <span><i class="fa-solid fa-user"></i> ${escapeHTML(story.author)}</span>
                        ${story.relation ? `<span><i class="fa-solid fa-link"></i> ${escapeHTML(story.relation)}</span>` : ''}
                    </div>
                    <div class="story-content">${escapeHTML(story.content)}</div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
