<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- ========================================== -->
    <!--          منصة حكاية - الملف الشامل         -->
    <!-- ========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حكاية | التجمع العربي الأكبر للقصص والروايات</title>
    
    <!-- خطوط جوجل العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /*          متغيرات الألوان والتصميم         */
        /* ========================================== */
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --border-color: #334155;
            --font-main: 'Cairo', sans-serif;
            --wa-bg: #111b21;
            --wa-card: #202c33;
            --wa-green: #00a884;
            --wa-bubble-me: #005c4b;
            --wa-bubble-them: #202c33;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --border-color: #e2e8f0;
            --wa-bg: #efeae2;
            --wa-card: #ffffff;
            --wa-bubble-me: #d9fdd3;
            --wa-bubble-them: #ffffff;
        }

        /* ========================================== */
        /*          التنسيقات العامة والأساسية        */
        /* ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* شريط التنقل العلوي */
        header {
            background-color: var(--bg-card);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 999;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.25rem;
            font-weight: 800;
            white-space: nowrap;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }
        
        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            cursor: pointer;
            object-fit: cover;
        }
        
        .btn-auth {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }
        
        .btn-logout {
            background-color: #ef4444;
        }

        /* تخطيط الصفحة الرئيسي */
        .container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .main-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        @media (max-width: 992px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.2rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        /* بطاقات القصص */
        .story-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .story-card h3 {
            color: var(--accent-color);
            margin-bottom: 0.4rem;
            font-size: 1.3rem;
        }

        .story-card .story-author {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }
        
        /* النص الكامل للقصة بدون أي قيود أو اقتصاص */
        .story-text {
            font-size: 1.05rem;
            line-height: 2;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
            overflow: visible;
            height: auto;
            max-height: none;
        }
        
        /* نموذج النشر */
        .publish-box {
            background-color: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-color);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* نظام الدردشة العائم */
        .chat-float-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background-color: var(--wa-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .chat-float-btn:hover {
            transform: scale(1.05);
        }

        .chat-modal {
            position: fixed;
            bottom: 95px;
            left: 25px;
            width: 380px;
            height: 550px;
            background-color: var(--wa-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-modal.open {
            display: flex;
        }

        @media (max-width: 480px) {
            .chat-modal {
                bottom: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
            }
        }

        .modal-header {
            background-color: var(--wa-card);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .modal-header h3 {
            font-size: 1rem;
            color: var(--text-main);
        }

        .chat-search-box {
            padding: 10px;
            background-color: var(--wa-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-search-box input {
            width: 100%;
            padding: 8px 12px;
            background: var(--wa-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }
        
        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover {
            background-color: var(--wa-card);
        }

        .user-item img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-item .details {
            flex: 1;
            overflow: hidden;
        }

        .user-item .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .user-item .sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .active-chat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--wa-bg);
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .active-chat.open {
            display: flex;
        }
        
        .chat-sub-header {
            padding: 10px 15px;
            background-color: var(--wa-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg-bubble.me {
            align-self: flex-start;
            background-color: var(--wa-bubble-me);
            color: #fff;
            border-top-right-radius: 0;
        }

        .msg-bubble.them {
            align-self: flex-end;
            background-color: var(--wa-bubble-them);
            color: var(--text-main);
            border-top-left-radius: 0;
        }

        .msg-bubble img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }

        .msg-bubble a {
            color: #38bdf8;
            text-decoration: underline;
            font-weight: bold;
        }
        
        .chat-input-row {
            padding: 12px;
            background-color: var(--wa-card);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
        }

        .chat-input-row input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .upload-img-label {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 4px;
            display: flex;
            align-items: center;
        }

        .chat-input-row button[type="submit"] {
            background: var(--wa-green);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!--            هيكل الصفحة الرئيسي            -->
    <!-- ========================================== -->
    <header>
        <h1>منصة حكاية</h1>
        <div class="header-actions">
            <button class="btn-auth" id="themeToggle">🌙 المظهر</button>
            <div id="authBox">
                <button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            <!-- قسم النشر -->
            <aside>
                <div class="publish-box">
                    <h2 class="section-title">انشر قصتك</h2>
                    <form id="storyForm">
                        <div class="form-group">
                            <input type="text" id="storyTitle" placeholder="عنوان القصة" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="authorName" placeholder="اسم الكاتب" required>
                        </div>
                        <div class="form-group">
                            <textarea id="storyContent" rows="6" placeholder="اكتب أو الصق نص القصة كاملاً هنا..." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">نشر القصة</button>
                    </form>
                </div>
            </aside>

            <!-- قسم عرض القصص -->
            <main>
                <h2 class="section-title">أحدث القصص المنشورة</h2>
                <div id="stories-container"></div>
            </main>
        </div>
    </div>

    <!-- زر الدردشة العائم -->
    <div class="chat-float-btn" id="chatFloatBtn">💬</div>

    <!-- نافذة المحادثة المنسدلة -->
    <div class="chat-modal" id="chatModal">
        <div class="modal-header">
            <h3>💬 المحادثات والأصدقاء</h3>
            <button class="back-btn" onclick="toggleChatModal()">✖</button>
        </div>
        
        <div class="chat-search-box" id="searchContainer">
            <input type="text" id="userSearchInput" placeholder="🔍 ابحث عن اسم مستخدم...">
        </div>

        <div class="modal-body">
            <div class="users-list" id="usersList"></div>

            <div class="active-chat" id="activeChat">
                <div class="chat-sub-header">
                    <div class="chat-header-info">
                        <button class="back-btn" onclick="closeActiveChat()">➡️</button>
                        <span id="targetUserName">المحادثة</span>
                    </div>
                    <button style="background:none; border:none; color:var(--wa-green); font-size:1.3rem; cursor:pointer;" onclick="startRealCallLink()" title="مكالمة صوتية/فيديو">📞</button>
                </div>
                
                <div class="messages-area" id="messagesArea"></div>
                
                <form class="chat-input-row" id="chatForm">
                    <label class="upload-img-label" title="إرسال صورة">
                        📷
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    </label>
                    <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                    <button type="submit">إرسال</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!--            مكتبات وخدمات Firebase           -->
    <!-- ========================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // إعدادات الاتصال بقاعدة بيانات Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
          authDomain: "hikaya-5ff25.firebaseapp.com",
          databaseURL: "https://hikaya-5ff25-default-rtdb.firebaseio.com",
          projectId: "hikaya-5ff25",
          storageBucket: "hikaya-5ff25.firebasestorage.app",
          messagingSenderId: "1031922678593",
          appId: "1:1031922678593:web:c242a9e36ad40becc9bfc0",
          measurementId: "G-KR76L2WSZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let selectedUser = null;
        let currentChatId = null;
        let allUsersData = [];

        // عناصر الواجهة البرمجية
        const authBox = document.getElementById('authBox');
        const usersList = document.getElementById('usersList');
        const activeChat = document.getElementById('activeChat');
        const messagesArea = document.getElementById('messagesArea');
        const targetUserName = document.getElementById('targetUserName');
        const msgInput = document.getElementById('msgInput');
        const userSearchInput = document.getElementById('userSearchInput');
        const imageInput = document.getElementById('imageInput');

        // نظام المصادقة وتسجيل الدخول
        function handleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("خطأ في التسجيل: " + err.message));
        }

        function handleLogout() {
            auth.signOut();
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                authBox.innerHTML = `
                    <img src="${user.photoURL}" class="user-avatar" title="${user.displayName}">
                    <button class="btn-auth btn-logout" onclick="handleLogout()">خروج</button>
                `;
                document.getElementById('authorName').value = user.displayName;

                database.ref('users/' + user.uid).set({
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL
                });

                loadUsers();
            } else {
                currentUser = null;
                authBox.innerHTML = `<button class="btn-auth" onclick="handleLogin()">تسجيل الدخول</button>`;
                usersList.innerHTML = '<div style="padding:20px; font-size:0.85rem; text-align:center; color:var(--text-muted);">سجّل الدخول للتواصل وإجراء المكالمات 📞</div>';
                closeActiveChat();
            }
        });

        // إدارة واجهة المحادثة والدردشة
        const chatModal = document.getElementById('chatModal');
        document.getElementById('chatFloatBtn').addEventListener('click', toggleChatModal);

        function toggleChatModal() {
            chatModal.classList.toggle('open');
        }

        function closeActiveChat() {
            activeChat.classList.remove('open');
        }

        function loadUsers() {
            database.ref('users').on('value', snapshot => {
                allUsersData = [];
                snapshot.forEach(child => {
                    const u = child.val();
                    if (currentUser && u.uid !== currentUser.uid) {
                        allUsersData.push(u);
                    }
                });
                renderUsersList(allUsersData);
            });
        }

        function renderUsersList(users) {
            usersList.innerHTML = '';
            if (users.length === 0) {
                usersList.innerHTML = '<div style="padding:20px; font-size:0.85rem; text-align:center; color:var(--text-muted);">لا يوجد مستخدمون مطابقة للبحث</div>';
                return;
            }
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `
                    <img src="${u.photo}">
                    <div class="details">
                        <div class="name">${u.name}</div>
                        <div class="sub">انقر للمراسلة والمكالمة</div>
                    </div>
                `;
                div.onclick = () => openChatWith(u);
                usersList.appendChild(div);
            });
        }

        userSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            const filtered = allUsersData.filter(u => u.name.toLowerCase().includes(query));
            renderUsersList(filtered);
        });

        function openChatWith(user) {
            if (!currentUser) return alert("سجل الدخول أولاً للمحادثة!");
            selectedUser = user;
            targetUserName.textContent = user.name;
            activeChat.classList.add('open');

            currentChatId = currentUser.uid < selectedUser.uid 
                ? `${currentUser.uid}_${selectedUser.uid}` 
                : `${selectedUser.uid}_${currentUser.uid}`;

            loadMessages();
        }

        function loadMessages() {
            database.ref('private_chats/' + currentChatId).on('value', snapshot => {
                messagesArea.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const b = document.createElement('div');
                    b.className = `msg-bubble ${msg.senderId === currentUser.uid ? 'me' : 'them'}`;
                    
                    if (msg.type === 'image') {
                        b.innerHTML = `<img src="${msg.text}">`;
                    } else if (msg.type === 'call_link') {
                        b.innerHTML = `🎥 رابط مكالمة صوتية/فيديو:<br><a href="${msg.text}" target="_blank">انقر هنا للانضمام</a>`;
                    } else {
                        b.textContent = msg.text;
                    }
                    messagesArea.appendChild(b);
                });
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        document.getElementById('chatForm').addEventListener('submit', e => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!currentChatId || !text) return;

            database.ref('private_chats/' + currentChatId).push({
                senderId: currentUser.uid,
                text: text,
                type: 'text',
                timestamp: Date.now()
            });

            msgInput.value = '';
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const base64Image = uploadEvent.target.result;
                database.ref('private_chats/' + currentChatId).push({
                    senderId: currentUser.uid,
                    text: base64Image,
                    type: 'image',
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
            imageInput.value = '';
        });

        function startRealCallLink() {
            if (!selectedUser || !currentChatId) return;
            const roomCode = 'HikayaCall-' + Math.random().toString(36).substring(2, 9);
            const callUrl = `https://meet.jit.si/${roomCode}`;

            database.ref('private_chats/' + currentChatId).push({
                senderId: currentUser.uid,
                text: callUrl,
                type: 'call_link',
                timestamp: Date.now()
            });

            window.open(callUrl, '_blank');
        }

        // تبديل المظهر (ليلي / نهاري)
        document.getElementById("themeToggle").addEventListener("click", () => {
            const isLight = document.documentElement.getAttribute("data-theme") === "light";
            document.documentElement.setAttribute("data-theme", isLight ? "" : "light");
        });

        // إدارة عرض وحفظ القصص محلياً وتجنب أي اقتصاص
        const storiesContainer = document.getElementById("stories-container");
        let stories = JSON.parse(localStorage.getItem("hikaya_stories_v3"));
        if (!stories) {
            stories = [
                { id: 1, title: "رحلة غارلون", author: "غارلون", content: "قصة مشوقة عن المغامرات والقتال في عوالم خيالية واسعة...\n\nالموقع يعمل بكفاءة تامة على الهواتف واللابتوب بدون أي قص أو تقييد للنصوص." }
            ];
            localStorage.setItem("hikaya_stories_v3", JSON.stringify(stories));
        }

        function renderStories() {
            storiesContainer.innerHTML = "";
            stories.forEach(story => {
                const article = document.createElement("article");
                article.className = "story-card";
                
                article.innerHTML = `
                    <h3>${story.title}</h3>
                    <span class="story-author">الكاتب: ${story.author}</span>
                    <div class="story-text">${story.content}</div>
                `;
                storiesContainer.appendChild(article);
            });
        }

        renderStories();

        document.getElementById("storyForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const title = document.getElementById("storyTitle").value.trim();
            const author = document.getElementById("authorName").value.trim();
            const content = document.getElementById("storyContent").value.trim();
            
            if (!title || !author || !content) return;

            stories.unshift({ id: Date.now(), title, author, content });
            localStorage.setItem("hikaya_stories_v3", JSON.stringify(stories));
            renderStories();
            document.getElementById("storyForm").reset();
        });
    </script>
</body>
</html>
