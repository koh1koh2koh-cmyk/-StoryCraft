<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة القصة | منصة حكاية</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; }
        .back-btn { color: #e2b714; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .story-title { font-size: 2rem; color: #f8fafc; margin-bottom: 15px; }
        .story-meta { display: flex; gap: 15px; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; flex-wrap: wrap; }
        .story-body { line-height: 1.8; font-size: 1.1rem; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 30px; }
        .share-box { background: #0f172a; padding: 15px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        .share-btn { padding: 8px 15px; border-radius: 6px; border: none; color: white; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 0.85rem; }
        .btn-wa { background-color: #25d366; }
        .btn-tg { background-color: #0088cc; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
        <div id="storyContainer">جاري تحميل القصة...</div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBcoMH8sFZmb8hJUOBZvRzMrFasya2JQek",
        authDomain: "hikaya-5ff25.firebaseapp.com",
        projectId: "hikaya-5ff25"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const storyId = urlParams.get('id');

    if (storyId) {
        db.collection("stories").doc(storyId).get().then(doc => {
            if (doc.exists) {
                const story = doc.data();
                const pageUrl = encodeURIComponent(window.location.href);
                document.getElementById("storyContainer").innerHTML = `
                    <h1 class="story-title">${story.title}</h1>
                    <div class="story-meta">
                        <span>✍️ ${story.author}</span>
                        <span>🏷️ ${story.category}</span>
                        <span>🔗 ${story.relation || 'غير محدد'}</span>
                    </div>
                    <div class="story-body">${story.content}</div>
                    <div class="share-box">
                        <span>مشاركة القصة:</span>
                        <a href="https://api.whatsapp.com/send?text=${pageUrl}" target="_blank" class="share-btn btn-wa"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                        <a href="https://t.me/share/url?url=${pageUrl}" target="_blank" class="share-btn btn-tg"><i class="fa-brands fa-telegram"></i> تليجرام</a>
                    </div>
                `;
            } else {
                document.getElementById("storyContainer").innerHTML = "<p>القصة غير موجودة.</p>";
            }
        });
    }
</script>
</body>
</html>
