<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكاية - شارك قصتك</title>
</head>
<body style="background-color: #121824; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 0 0 50px 0; direction: rtl;">

    <!-- الهيدر الشامل -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; background-color: #1e2638; border-bottom: 1px solid #2e3a52;">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="logo.png" alt="حكاية HIKAYA" style="height: 55px; border-radius: 8px; background: #fff; padding: 2px;">
        </a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-size: 0.9rem;">الرئيسية</a>
            <a href="submit.html" style="color: #e2b714; text-decoration: none; font-weight: bold; font-size: 0.9rem;">شارك قصتك ✍️</a>
        </div>
    </header>

    <!-- محتوى الصفحة -->
    <main style="max-width: 700px; margin: 40px auto; padding: 0 20px;">
        <div style="background-color: #1e2638; border-radius: 16px; border: 1px solid #2e3a52; padding: 30px;">
            <div style="text-align: center; margin-bottom: 25px;">
                <h1 style="color: #ffffff; font-size: 1.8rem; margin-bottom: 8px;">شارك قصتك مع العالم ✍️</h1>
                <p style="color: #94a3b8; font-size: 0.95rem;">هل لديك موهبة في كتابة القصص والروايات؟ أرسل قصتك لمراجعتها ونشرها باسمك على منصة حكاية!</p>
            </div>

            <form id="storyForm" action="https://docs.google.com/forms/d/e/1FAIpQLSc0SuW9ERZm2mcNDOIdWEUtlLo-uWwxMbaKrrGt7M07t7NY1g/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 5px;">اسم الكاتب / المستعار *</label>
                    <input type="text" name="entry.1983057398" required placeholder="أدخل اسمك" 
                           style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2e3a52; background-color: #121824; color: #fff; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 5px;">عنوان القصة *</label>
                    <input type="text" name="entry.1481180806" required placeholder="عنوان مشوق للقصة" 
                           style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2e3a52; background-color: #121824; color: #fff; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 5px;">تصنيف القصة *</label>
                    <select name="entry.1207185072" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2e3a52; background-color: #121824; color: #fff; outline: none; box-sizing: border-box;">
                        <option value="تحري وألغاز">تحري وألغاز</option>
                        <option value="إثارة وغموض">إثارة وغموض</option>
                        <option value="رعب ورعب نفسي">رعب ورعب نفسي</option>
                        <option value="خيال علمي">خيال علمي</option>
                        <option value="دراما وواقع">دراما وواقع</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 5px;">نص القصة الكامل *</label>
                    <textarea name="entry.1018991206" rows="8" required placeholder="اكتب تفاصيل القصة هنا..." 
                              style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2e3a52; background-color: #121824; color: #fff; outline: none; box-sizing: border-box; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <button type="submit" style="width: 100%; background-color: #e2b714; color: #121824; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">
                    إرسال القصة للمراجعة 🚀
                </button>
            </form>

            <div id="successMessage" style="display: none; background-color: #064e3b; color: #a7f3d0; padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; border: 1px solid #059669;">
                شُكراً لك! تم إرسال قصتك بنجاح، وتلقيناها في Google Drive وسيتم مراجعتها ونشرها قريباً. ✨
            </div>

            <!-- إطار خفي لإرسال البيانات دون خروج الزائر من موقعك -->
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { document.getElementById('storyForm').style.display='none'; document.getElementById('successMessage').style.display='block'; }"></iframe>
        </div>
    </main>

    <script>var submitted = false;</script>
</body>
</html>
